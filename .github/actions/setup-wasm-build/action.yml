# Single source of truth for the toolchain that scripts/build-wasm.sh needs.
# The wasm bundle is pure Rust end-to-end (the CSG kernel is the in-tree
# exact mesh-arrangement kernel — the Manifold C++ kernel and its LLVM-20 /
# libc++ wasm cross-toolchain were removed at M9, see
# docs/architecture/pure-rust-csg-kernel.md), so this is just the pinned
# Rust nightly + wasm-pack + the cargo cache.
#
# Used by test.yml, release.yml, sdk-canary.yml, benchmark.yml and
# export-schema-conformance.yml (#5942) so they
# stay in lock-step — a toolchain change here updates all of them at once,
# instead of one drifting (which is how sdk-canary once shipped without a
# toolchain piece and went red on an unrelated PR).
name: 'Setup WASM build toolchain'
description: 'Rust (rust-toolchain.toml) + wasm-pack for the wasm32 build'

inputs:
  cache-prefix:
    description: 'Swatinem/rust-cache prefix-key, to namespace the cargo cache per workflow'
    required: true
  # ONE CACHE PER WORKFLOW, WRITTEN FROM MAIN, READ BY EVERY PR (CI redesign,
  # step 1; the same shape test.yml's Rust jobs adopted in #4511). Without
  # `shared-key` rust-cache keys on the job AND the git ref, so every PR branch
  # wrote its own copy: measured at 46 caches / 10.96 GB against a 10 GB
  # budget, with `semver` alone at 19 x 269 MB and `build` at 19 x 142 MB,
  # while `main` itself held NO rust-tests cache -- the one every PR could
  # have restored from. With `shared-key: main` every caller of this action
  # restores `<prefix>-main-<lockfile hash>`, and `save-if` defaults to
  # writing it only from a push to main or a merge-queue batch, so PRs
  # restore and never save. Footprint ~3.1 GB, x2 during a lockfile turnover.
  shared-key:
    description: 'Swatinem/rust-cache shared-key; every ref restores this one key'
    required: false
    default: main
  save-if:
    description: 'Swatinem/rust-cache save-if; by default only a push to main or a merge_group batch writes the cache'
    required: false
    default: ${{ github.ref == 'refs/heads/main' || github.event_name == 'merge_group' }}

runs:
  using: composite
  steps:
    # rust-toolchain.toml pins the nightly + wasm32-unknown-unknown + rust-src;
    # `rustup show` triggers install of exactly that toolchain.
    - name: Setup Rust (pinned by rust-toolchain.toml)
      shell: bash
      run: rustup show

    - name: Cargo cache
      # Skipped only where the job set a warm CARGO_TARGET_DIR (the persistent
      # ifclite-rust runner); every other runner keeps rust-cache.
      if: env.CARGO_TARGET_DIR == ''
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        prefix-key: ${{ inputs.cache-prefix }}
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}

    # Downloaded directly rather than via jetli/wasm-pack-action, which always
    # fetched the x86_64 archive: on ubuntu-24.04-arm it reported success and
    # the first `wasm-pack build` then died with "Syntax error: Unterminated
    # quoted string" (the shell trying to run an x86 ELF, #7137). Pick the
    # musl archive for the host arch, verify it against the SHA256 pinned
    # below (GitHub's asset digest for the wasm-bindgen/wasm-pack v0.15.0
    # release), and run `wasm-pack --version` so a binary that cannot execute
    # fails HERE, in setup, not in the build. Pinned, not `latest`: resolving
    # `latest` hit the releases API every run and intermittently got an HTML
    # rate-limit page back. To bump: change WASM_PACK_VERSION and BOTH digests
    # (`gh api repos/wasm-bindgen/wasm-pack/releases/tags/<v> --jq
    # '.assets[] | [.name, .digest] | @tsv'`). If the release download exhausts
    # its retries, compile the same pinned version from crates.io, a separate
    # CDN. `--locked` pins its dependencies; the version check below guards
    # the result on either install path and on cache hits. Checksum failures
    # remain fatal rather than falling back from an untrusted archive.
    - name: Select pinned wasm-pack for host arch
      id: wasm-pack-config
      shell: bash
      env:
        WASM_PACK_VERSION: v0.15.0
        WASM_PACK_SHA256_X86_64: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        WASM_PACK_SHA256_AARCH64: e17ef0806381c3a0acb9c9ddad643a49facaa5a2ecf657a421d4d8f3357a24b7
      run: |
        set -euo pipefail
        if [ "$(uname -s)" != "Linux" ]; then
          echo "::error::setup-wasm-build installs the linux-musl wasm-pack only; got $(uname -s)" >&2
          exit 1
        fi
        case "$(uname -m)" in
          x86_64 | amd64) arch=x86_64; sha256="$WASM_PACK_SHA256_X86_64" ;;
          aarch64 | arm64) arch=aarch64; sha256="$WASM_PACK_SHA256_AARCH64" ;;
          *)
            echo "::error::no pinned wasm-pack ${WASM_PACK_VERSION} archive for host arch $(uname -m)" >&2
            exit 1
            ;;
        esac
        name="wasm-pack-${WASM_PACK_VERSION}-${arch}-unknown-linux-musl"
        echo "version=$WASM_PACK_VERSION" >> "$GITHUB_OUTPUT"
        echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "dest=${RUNNER_TEMP}/wasm-pack-${WASM_PACK_VERSION}-${arch}" >> "$GITHUB_OUTPUT"
        echo "key=wasm-pack-${WASM_PACK_VERSION}-${arch}-${sha256}" >> "$GITHUB_OUTPUT"

    - name: Cache pinned wasm-pack binary
      id: wasm-pack-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.wasm-pack-config.outputs.dest }}/wasm-pack
        key: ${{ steps.wasm-pack-config.outputs.key }}

    - name: Install wasm-pack (host arch, pinned)
      if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        WASM_PACK_VERSION: ${{ steps.wasm-pack-config.outputs.version }}
        sha256: ${{ steps.wasm-pack-config.outputs.sha256 }}
        name: ${{ steps.wasm-pack-config.outputs.name }}
        dest: ${{ steps.wasm-pack-config.outputs.dest }}
      run: |
        set -euo pipefail
        url="https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/${name}.tar.gz"
        rm -rf "$dest"
        mkdir -p "$dest"
        echo "Downloading $url"
        # Always remove partial downloads and the temporary Cargo install tree.
        trap 'rm -f "$dest/${name}.tar.gz"; rm -rf "$dest/cargo-install"' EXIT
        if curl --fail --silent --show-error --location \
          --retry 8 --retry-delay 5 --retry-max-time 240 --retry-all-errors \
          --connect-timeout 20 --max-time 240 \
          --output "$dest/${name}.tar.gz" "$url"; then
          echo "${sha256}  $dest/${name}.tar.gz" | sha256sum --check --strict
          tar -xzf "$dest/${name}.tar.gz" -C "$dest" --strip-components=1 "${name}/wasm-pack"
        else
          rm -f "$dest/${name}.tar.gz"
          echo "::warning::wasm-pack release download failed after retries; falling back to cargo install from crates.io (pinned version, --locked)"
          if ! cargo install wasm-pack --version "${WASM_PACK_VERSION#v}" --locked --root "$dest/cargo-install"; then
            echo "::error::wasm-pack crates.io cargo install fallback failed" >&2
            exit 1
          fi
          mv "$dest/cargo-install/bin/wasm-pack" "$dest/wasm-pack"
        fi
        chmod +x "$dest/wasm-pack"

    - name: Verify wasm-pack version (including cache hits)
      shell: bash
      env:
        WASM_PACK_VERSION: ${{ steps.wasm-pack-config.outputs.version }}
        dest: ${{ steps.wasm-pack-config.outputs.dest }}
      run: |
        set -euo pipefail
        # Fail in setup if the binary cannot run on this host (wrong arch,
        # truncated, wrong libc) and if it is not the pinned version.
        reported="$("$dest/wasm-pack" --version)"
        echo "$reported"
        if [ "$reported" != "wasm-pack ${WASM_PACK_VERSION#v}" ]; then
          echo "::error::expected 'wasm-pack ${WASM_PACK_VERSION#v}', got '$reported'" >&2
          exit 1
        fi
        echo "$dest" >> "$GITHUB_PATH"
