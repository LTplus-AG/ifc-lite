# Dependabot tracks third-party updates so SHA-pinned actions in
# .github/workflows/ don't rot, and npm/cargo deps get security PRs
# without manual auditing. Phase A hardening — see AGENTS.md.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # NOTE: `ignore` blocks BOTH version-update PRs and Dependabot
    # security-update PRs for the matched scope. Only ignore here when
    # the CVE-coverage cost is worth the noise reduction.
    # Runtime deps (apache-arrow, @anthropic-ai/sdk) intentionally stay
    # unignored so security PRs continue to flow; we'll close noisy
    # major bumps manually if they reappear.
    ignore:
      # vite is devDependency-only — CVE risk is mostly build-time.
      # Vite 8 switched the prod build to Rolldown and shipped a broken
      # `selectionHandlers` chunk to ifc-lite-ltplus.vercel.app
      # (see #741 / #746). Block the next semver-major until Rolldown
      # output is verified stable for this repo.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # pdfjs-dist is pinned exactly because PDF vector decoding is
      # qualified against one decoder build: the version string is
      # checked in apps/viewer/src/lib/appearance/pdf/vector-adapter.ts,
      # rust/processing/src/pdf_vector/mod.rs and
      # rust/wasm-bindings/src/api/pdf_vector.rs, so any bump fails those
      # checks. Moving it is a qualified upgrade done by hand (see #7391),
      # including security fixes.
      - dependency-name: "pdfjs-dist"
      # The 1.2.0 dialog and 1.3.0 tooltip minors changed behaviour the
      # viewer depends on: dialog broke the HelpHint popovers in
      # extensions-panels-chrome.i18n.test.tsx, tooltip broke the
      # aria-describedby wiring in icon-button.test.tsx (see #7391).
      # Patch releases on the current minors still flow; lift these once
      # the viewer is adapted to the new minors.
      - dependency-name: "@radix-ui/react-dialog"
        versions: [">=1.2.0"]
      - dependency-name: "@radix-ui/react-tooltip"
        versions: [">=1.3.0"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  # requirements-docs.txt builds ifclite.dev/docs in CI (mkdocs + plugins).
  # Build-time only, but it is a manifest Dependabot was blind to.
  #
  # rust/python/pyproject.toml is deliberately NOT listed: it declares no
  # runtime dependencies, only `maturin>=1.7,<2.0` under build-system, and
  # that upper bound is a deliberate pin rather than drift to be chased.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch

  # Base images for the three shipped containers. Dependabot only tracks the
  # image tag/digest here; it does not see CVEs inside a pulled layer, so a
  # bump landing is the mechanism by which those get picked up at all.
  - package-ecosystem: docker
    directories:
      - /apps/server
      - /packages/collab-server
      - /tools/ifcopenshell_reference
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # tools/ifcopenshell_reference pins the parity reference engine, and
      # requirements.lock rides the interpreter version: numpy/shapely ship
      # cp-tagged wheels, so a python feature bump breaks `pip install`
      # outright — 3.14 has no numpy 2.0.2 or shapely 2.0.7 wheel, and the
      # slim image has no compiler to fall back on (see #2008). Moving this
      # image means moving the lock and regenerating reference dumps, which
      # requirements.lock already calls a reviewed change. Patch bumps
      # (3.12.x) still flow.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
