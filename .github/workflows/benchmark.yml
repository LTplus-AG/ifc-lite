# Evidence-only diagnostic branch. Never merge this workflow replacement.
name: Benchmark
on:
  workflow_dispatch:
    inputs:
      base:
        description: Immutable 40-character base source SHA
        required: true
        type: string
      candidate:
        description: Immutable 40-character candidate source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-6940-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      BASE_SHA: ${{ inputs.base }}
      CANDIDATE_SHA: ${{ inputs.candidate }}
    steps:
      - name: Checkout diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          lfs: false
          persist-credentials: false
      - name: Validate immutable source inputs
        run: |
          mkdir -p "$RUNNER_TEMP/native-6940-evidence"
          python3 - <<'PY'
          import os,re,json,pathlib
          for key in ('BASE_SHA','CANDIDATE_SHA'):
              assert re.fullmatch(r'[0-9a-f]{40}',os.environ[key]), f'{key} must be a lowercase immutable 40-character SHA'
          assert os.environ['BASE_SHA'] != os.environ['CANDIDATE_SHA'], 'A/B requires distinct source revisions'
          pathlib.Path(os.environ['RUNNER_TEMP'],'native-6940-evidence','dispatch.json').write_text(json.dumps({k:os.environ.get(k) for k in ('BASE_SHA','CANDIDATE_SHA','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','RUNNER_OS','RUNNER_ARCH')},indent=2))
          PY
      - name: Checkout immutable base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          path: source-base
          lfs: false
          persist-credentials: false
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: source-branch
          lfs: false
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install and record pinned native Rust toolchain
        run: |
          python3 - <<'PY'
          import pathlib,tomllib
          a=tomllib.loads(pathlib.Path('source-base/rust-toolchain.toml').read_text())['toolchain']['channel']
          b=tomllib.loads(pathlib.Path('source-branch/rust-toolchain.toml').read_text())['toolchain']['channel']
          assert a == b == 'nightly-2025-11-15', (a,b)
          PY
          rustup toolchain install nightly-2025-11-15 --profile minimal
          RUSTUP_TOOLCHAIN=nightly-2025-11-15 rustup show > "$RUNNER_TEMP/native-6940-evidence/rustup-show.txt" 2>&1
          rustup run nightly-2025-11-15 rustc -Vv > "$RUNNER_TEMP/native-6940-evidence/rustc.txt" 2>&1
          rustup run nightly-2025-11-15 cargo -Vv > "$RUNNER_TEMP/native-6940-evidence/cargo.txt" 2>&1
          node --version > "$RUNNER_TEMP/native-6940-evidence/node.txt"
      - name: Fetch and verify four catalogue fixtures
        working-directory: controller
        run: |
          node scripts/fixtures/fetch-fixtures.mjs ara3d/AC20-FZK-Haus.ifc ara3d/ISSUE_129_N1540_17_EXE_MOD_448200_02_09_11SMC_IGC_V17.ifc ara3d/ISSUE_053_20181220Holter_Tower_10.ifc georeferencer/MiniBIM-3.1-DO_01_VORM.ifc > "$RUNNER_TEMP/native-6940-evidence/fixture-fetch.stdout" 2> "$RUNNER_TEMP/native-6940-evidence/fixture-fetch.stderr"
          node scripts/fixtures/fetch-fixtures.mjs --check ara3d/AC20-FZK-Haus.ifc ara3d/ISSUE_129_N1540_17_EXE_MOD_448200_02_09_11SMC_IGC_V17.ifc ara3d/ISSUE_053_20181220Holter_Tower_10.ifc georeferencer/MiniBIM-3.1-DO_01_VORM.ifc > "$RUNNER_TEMP/native-6940-evidence/fixture-check.stdout" 2> "$RUNNER_TEMP/native-6940-evidence/fixture-check.stderr"
      - name: Build base and candidate sequentially in separate targets
        run: |
          cd "$GITHUB_WORKSPACE/source-base"
          CARGO_TARGET_DIR="$RUNNER_TEMP/native-target-base" cargo +nightly-2025-11-15 build --locked --profile profiling -p ifc-lite-processing --example perf_probe > "$RUNNER_TEMP/native-6940-evidence/build-base.stdout" 2> "$RUNNER_TEMP/native-6940-evidence/build-base.stderr"
          cd "$GITHUB_WORKSPACE/source-branch"
          CARGO_TARGET_DIR="$RUNNER_TEMP/native-target-branch" cargo +nightly-2025-11-15 build --locked --profile profiling -p ifc-lite-processing --example perf_probe > "$RUNNER_TEMP/native-6940-evidence/build-branch.stdout" 2> "$RUNNER_TEMP/native-6940-evidence/build-branch.stderr"
      - name: Run finite native A/B once without retrying or dropping failures
        run: |
          python3 controller/work/6940/native-evidence.py --controller "$GITHUB_WORKSPACE/controller" --base "$GITHUB_WORKSPACE/source-base" --branch "$GITHUB_WORKSPACE/source-branch" --base-binary "$RUNNER_TEMP/native-target-base/profiling/examples/perf_probe" --branch-binary "$RUNNER_TEMP/native-target-branch/profiling/examples/perf_probe" --base-sha "$BASE_SHA" --branch-sha "$CANDIDATE_SHA" --out "$RUNNER_TEMP/native-6940-evidence"
      - name: Upload all evidence including refusals and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-6940-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-6940-evidence
          retention-days: 14
          if-no-files-found: error
