# Temporary, dispatch-only native A/B harness for #6283. This file exists only
# on scratch/6283-hosted-ab and must never be merged into main.
name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ab:
    name: Hosted #6283 native A/B
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download SHA-verified AC20 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/models/ara3d
          curl --fail --location --retry 5 --retry-all-errors \
            'https://github.com/LTplus-AG/ifc-lite/releases/download/fixtures-v1/ea6f04eaf92fac4d7ad0038bc3d2dfea4c094dd3f516ecc33c50bf1835ca108d' \
            --output tests/models/ara3d/AC20-FZK-Haus.ifc
          echo 'ea6f04eaf92fac4d7ad0038bc3d2dfea4c094dd3f516ecc33c50bf1835ca108d  tests/models/ara3d/AC20-FZK-Haus.ifc' | sha256sum --check -

      - name: Build exact parent and child probes
        shell: bash
        run: |
          set -euo pipefail
          parent=185ccf276b23dd57820efef592dee3a5a586ef06
          child=f278a70a3ad10921ccc40a6bbaa12f0b3611b2c4
          git cat-file -e "$parent^{commit}"
          git cat-file -e "$child^{commit}"
          git worktree add --detach "$RUNNER_TEMP/parent" "$parent"
          git worktree add --detach "$RUNNER_TEMP/child" "$child"
          (cd "$RUNNER_TEMP/parent" && rustup show && cargo build --locked --profile profiling -p ifc-lite-processing --example perf_probe)
          cp "$RUNNER_TEMP/parent/target/profiling/examples/perf_probe" "$RUNNER_TEMP/probe-parent"
          (cd "$RUNNER_TEMP/child" && rustup show && cargo build --locked --profile profiling -p ifc-lite-processing --example perf_probe)
          cp "$RUNNER_TEMP/child/target/profiling/examples/perf_probe" "$RUNNER_TEMP/probe-child"
          printf 'Built parent %s and child %s\n' "$parent" "$child"

      - name: Five balanced fresh-process A/B pairs and identity assertion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hosted-ab-results
          python3 - <<'PY'
          import json
          import os
          import statistics
          import subprocess
          from pathlib import Path

          out = Path('hosted-ab-results')
          fixture = str(Path('tests/models/ara3d/AC20-FZK-Haus.ifc').resolve())
          runner_temp = Path(os.environ['RUNNER_TEMP'])
          order = [('parent', 'child'), ('child', 'parent'), ('parent', 'child'), ('child', 'parent'), ('parent', 'child')]
          rows = []
          keys = ('entities', 'meshes', 'vertices', 'triangles', 'meshFingerprintsFnv1a64')
          baseline = None
          for round_number, pair in enumerate(order, 1):
              for position, side in enumerate(pair, 1):
                  cmd = [str(runner_temp / f'probe-{side}'), fixture, '--iters', '5', '--json', '--fingerprint']
                  result = subprocess.run(cmd, text=True, capture_output=True, check=True)
                  (out / f'{round_number:02d}-{position}-{side}.json').write_text(result.stdout)
                  (out / f'{round_number:02d}-{position}-{side}.stderr.txt').write_text(result.stderr)
                  probes = json.loads(result.stdout)
                  if len(probes) != 1:
                      raise AssertionError(f'{side} round {round_number}: expected one fixture, got {len(probes)}')
                  probe = probes[0]
                  identity = {key: probe[key] for key in keys}
                  if len(identity['meshFingerprintsFnv1a64']) != 5:
                      raise AssertionError(f'{side} round {round_number}: expected five ordered fingerprints')
                  if baseline is None:
                      baseline = identity
                  elif identity != baseline:
                      raise AssertionError(f'{side} round {round_number}: output identity changed: {identity} != {baseline}')
                  row = {'round': round_number, 'position': position, 'side': side, **probe}
                  rows.append(row)
                  print(f"round {round_number} position {position}: {side} parse={probe['parseMs']} geometry={probe['geometryMs']} total={probe['totalMs']} ms", flush=True)

          paired = []
          for round_number in range(1, 6):
              parent = next(row for row in rows if row['round'] == round_number and row['side'] == 'parent')
              child = next(row for row in rows if row['round'] == round_number and row['side'] == 'child')
              paired.append({'round': round_number, 'parseDeltaMs': child['parseMs'] - parent['parseMs'],
                             'geometryDeltaMs': child['geometryMs'] - parent['geometryMs'],
                             'totalDeltaMs': child['totalMs'] - parent['totalMs']})
          summary = {
              'parent': '185ccf276b23dd57820efef592dee3a5a586ef06',
              'child': 'f278a70a3ad10921ccc40a6bbaa12f0b3611b2c4',
              'fixtureSha256': 'ea6f04eaf92fac4d7ad0038bc3d2dfea4c094dd3f516ecc33c50bf1835ca108d',
              'roundOrder': order,
              'identity': baseline,
              'paired': paired,
              'medianParentMs': {key: statistics.median(row[key] for row in rows if row['side'] == 'parent') for key in ('parseMs', 'geometryMs', 'totalMs')},
              'medianChildMs': {key: statistics.median(row[key] for row in rows if row['side'] == 'child') for key in ('parseMs', 'geometryMs', 'totalMs')},
              'medianPairedDeltaMs': {key: statistics.median(pair[key] for pair in paired) for key in ('parseDeltaMs', 'geometryDeltaMs', 'totalDeltaMs')},
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          (out / 'runs.json').write_text(json.dumps(rows, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as step_summary:
              step_summary.write('## #6283 hosted AC20 native A/B\n\n```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always()
        with:
          name: hosted-6283-native-ab
          path: hosted-ab-results/
          if-no-files-found: warn
