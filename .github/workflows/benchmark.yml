# Diagnostic-only controller. NEVER MERGE this workflow replacement.
name: Benchmark
on:
  workflow_dispatch:
    inputs:
      source:
        description: Immutable forty-character source SHA to qualify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: features-6940-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      IFC_LITE_REQUIRE_FIXTURES: '1'
      SOURCE_SHA: ${{ inputs.source }}
    steps:
      - name: Checkout diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controller
          persist-credentials: false
      - name: Validate immutable input
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}",os.environ["SOURCE_SHA"])'
          mkdir -p "$RUNNER_TEMP/feature-evidence"
      - name: Checkout immutable tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          path: source
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Pinned toolchain and full fixture verification
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rustup show > "$RUNNER_TEMP/feature-evidence/toolchain.txt"
          rustc -Vv >> "$RUNNER_TEMP/feature-evidence/toolchain.txt"
          node scripts/fixtures/fetch-fixtures.mjs > "$RUNNER_TEMP/feature-evidence/fixtures.log" 2>&1
          node scripts/fixtures/fetch-fixtures.mjs --check >> "$RUNNER_TEMP/feature-evidence/fixtures.log" 2>&1
      - name: Execute full feature contracts and detached consumer builds
        run: python3 controller/work/6940/feature-evidence.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/feature-evidence"
      - name: Preserve every result including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: features-6940-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/feature-evidence
          if-no-files-found: error
          retention-days: 14
