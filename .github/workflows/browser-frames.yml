# Nightly deterministic frame-cost rig (#6960, perf charter #6954).
#
# chrome-headless-shell driven at 120 Hz over CDP HeadlessExperimental.beginFrame
# (tests/benchmark/frames/frame-rig.spec.ts): streaming load, scripted orbit
# and hover sweep on AC20-FZK-Haus and Snowdon. Uploads `browser-frames` rows
# ({fixture, scenario, metric, value}). Admitted rows feed the M4 ratchet
# (#6959) as the `browser-frames` family; perf-ratchet-lower.yml lowers its
# ceilings from this lane's latest successful run on main.
# Main-thread cost and encoded GPU work only: WebGPU runs on SwiftShader here,
# so no number from this lane is a GPU time. Not a PR gate; a red scheduled
# run opens or updates the scheduled-lane issue.

name: Browser frames (deterministic rig)

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Measurement or isolated SwiftShader diagnostics (#7655)
        type: choice
        default: frames
        options:
          - frames
          - instance
          - diagnostic-frames
          - qualification-frames

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'frames' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frames:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'instance'
    name: BeginFrame 120 Hz rig (FZK + Snowdon)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Resolve prebuilt-WASM eligibility
        id: wasm
        run: echo "eligible=$(bash scripts/ci-wasm-prebuilt-eligible.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup WASM build toolchain
        if: steps.wasm.outputs.eligible != 'true'
        uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: browser-frames

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch prebuilt WASM
        if: steps.wasm.outputs.eligible == 'true'
        run: |
          for attempt in 1 2 3; do
            if node scripts/fetch-prebuilt-wasm.mjs; then exit 0; fi
            echo "::warning::prebuilt WASM fetch attempt ${attempt} failed; retrying…"
            sleep $((attempt * 5))
          done
          echo "::error::Could not fetch the prebuilt @ifc-lite/wasm bundle after 3 attempts."
          exit 1

      - name: Build WASM
        if: steps.wasm.outputs.eligible != 'true'
        run: bash scripts/build-wasm.sh

      - name: Cache frame-rig fixtures
        id: fixtures-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/models
          key: browser-frames-fixtures-${{ runner.os }}-${{ hashFiles('tests/models/manifest.json') }}

      - name: Fetch frame-rig fixtures
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        run: node scripts/fixtures/fetch-fixtures.mjs "ara3d/AC20-FZK-Haus.ifc" "various/01_Snowdon_Towers_Sample_Structural(1).ifc"

      # A missing fixture makes the spec SKIP, which would upload an empty
      # result as a green run; fail here instead.
      - name: Verify frame-rig fixtures
        run: node scripts/fixtures/fetch-fixtures.mjs --check "ara3d/AC20-FZK-Haus.ifc" "various/01_Snowdon_Towers_Sample_Structural(1).ifc"

      - name: Build viewer app
        run: pnpm turbo build --filter=@ifc-lite/viewer

      # BeginFrame control exists only in chrome-headless-shell, not in the
      # runner's preinstalled Chrome (new headless).
      - name: Install chrome-headless-shell
        run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: Run deterministic frame rig
        if: inputs.mode != 'qualification-frames'
        env:
          FRAME_RIG_OUT: test-results/browser-frames.json
          FRAME_INSTANCE_DIAGNOSTICS: ${{ inputs.mode == 'diagnostic-frames' && '1' || '' }}
          DEBUG: ${{ inputs.mode == 'diagnostic-frames' && 'pw:browser' || '' }}
        run: pnpm test:benchmark:frames

      # Separate Playwright output directories preserve earlier cohorts when
      # Playwright cleans its output directory before each invocation.
      - name: Qualify ten frame cohorts against one build
        if: inputs.mode == 'qualification-frames'
        run: |
          status=0
          mkdir -p test-results/qualification
          for cohort in $(seq -w 1 10); do
            result="test-results/qualification/browser-frames-${cohort}.json"
            FRAME_RIG_OUT="$result" pnpm test:benchmark:frames \
              --output="test-results/qualification/playwright-${cohort}" || status=$?
            node scripts/perf/check-frame-results.mjs "$result" || status=$?
          done
          exit "$status"

      - name: Require complete uncontaminated frame evidence
        if: always() && inputs.mode != 'diagnostic-frames' && inputs.mode != 'qualification-frames'
        run: node scripts/perf/check-frame-results.mjs test-results/browser-frames.json

      # `browser-frames` ratchet family (#6975, M4 #6959). Runs only for
      # measurements when admission above passed: a partial or GPU-contaminated
      # artifact never reaches a ceiling. The measurer re-admits anyway and
      # refuses (exit 2) instead of evaluating. Only the rows the same-build
      # evidence supports are gated; the rest print as informational. A breach
      # turns this lane red, and a scheduled red run opens the lane's issue.
      - name: Measure perf-ratchet browser-frames family
        if: inputs.mode != 'diagnostic-frames' && inputs.mode != 'qualification-frames'
        run: node scripts/perf-ratchet/measure-browser-frames.mjs --frames test-results/browser-frames.json --out "$RUNNER_TEMP/perf-ratchet/browser-frames.json" --commit "$(git rev-parse HEAD)"

      - name: Check the browser-frames ceilings
        if: inputs.mode != 'diagnostic-frames' && inputs.mode != 'qualification-frames'
        run: |
          set +e
          node scripts/perf-ratchet/perf-ratchet.mjs check \
            --measured "$RUNNER_TEMP/perf-ratchet/browser-frames.json" \
            --markdown "$RUNNER_TEMP/perf-ratchet-report.md"
          status=$?
          set -e
          [ -f "$RUNNER_TEMP/perf-ratchet-report.md" ] && cat "$RUNNER_TEMP/perf-ratchet-report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload frame-rig results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.mode == 'qualification-frames' && format('qualification-frames-{0}', github.sha) || inputs.mode == 'diagnostic-frames' && format('diagnostic-frames-{0}', github.sha) || 'browser-frames' }}
          # The rows JSON on success, Playwright's error contexts on failure.
          path: test-results/
          if-no-files-found: error
          retention-days: 90

  instance:
    name: Isolated SwiftShader instance diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'instance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frame-evidence admission
        run: node --test scripts/perf/check-frame-results.test.mjs

      - name: Install chrome-headless-shell
        run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: Run isolated instance diagnostic
        env:
          DEBUG: pw:browser
          INSTANCE_DIAGNOSTIC_OUT: test-results/swiftshader-instance.json
        run: pnpm exec tsx scripts/perf/diagnostics/swiftshader-instance.mts

      - name: Upload instance diagnostic results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftshader-instance-${{ github.sha }}
          path: test-results/
          if-no-files-found: error
          retention-days: 90

  report-scheduled-failure:
    needs: [frames]
    if: always() && github.event_name == 'schedule' && needs.frames.result != 'success'
    uses: ./.github/workflows/report-scheduled-failure.yml
    with:
      workflow_name: Browser frames (deterministic rig)
      jobs: frames
      result: frames=${{ needs.frames.result }}
    permissions:
      contents: read
      issues: write
