name: CI reporting cancellation observer

on:
  workflow_run:
    workflows: [CI reporting outcome probe]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-cancelled:
    if: github.event.workflow_run.conclusion == 'cancelled'
    uses: ./.github/workflows/report-scheduled-failure.yml
    with:
      workflow_name: CI reporting outcome probe
      jobs: cancelled workflow run
      result: ${{ github.event.workflow_run.conclusion }}
      dry_run: true
    permissions:
      contents: read
      issues: write
