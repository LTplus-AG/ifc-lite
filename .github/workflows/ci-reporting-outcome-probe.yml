name: CI reporting outcome probe

on:
  workflow_dispatch:
    inputs:
      outcome:
        description: Real dependency conclusion to send through the reporter.
        required: true
        type: choice
        options:
          - failure
          - skipped
          - cancelled

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  subject:
    if: inputs.outcome != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      evidence: ${{ steps.completed.outputs.evidence }}
    steps:
      - name: Produce a real failed dependency
        if: inputs.outcome == 'failure'
        run: exit 23
      - name: Cancel this workflow through the Actions API
        if: inputs.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"
          sleep 300
      - name: Output written only by a successful subject
        id: completed
        run: echo 'evidence=unexpected-success' >> "$GITHUB_OUTPUT"

  report:
    needs: subject
    if: always() && inputs.outcome != 'cancelled'
    uses: ./.github/workflows/report-scheduled-failure.yml
    with:
      workflow_name: CI reporting outcome probe
      jobs: subject
      result: ${{ needs.subject.result }} output=${{ needs.subject.outputs.evidence }}
      dry_run: true
    permissions:
      contents: read
      issues: write
