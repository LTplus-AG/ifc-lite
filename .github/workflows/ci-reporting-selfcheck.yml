name: CI reporting selfcheck

on:
  pull_request:
    paths:
      - '.github/workflows/ci-reporting-selfcheck.yml'
      - '.github/workflows/ci-reporting-outcome-probe.yml'
      - '.github/workflows/ci-reporting-cancellation-observer.yml'
      - '.github/workflows/report-scheduled-failure.yml'
      - '.github/workflows/determinism.yml'
      - '.github/workflows/export-schema-conformance.yml'
      - '.github/workflows/ifcopenshell-parity.yml'
      - '.github/workflows/wide-arithmetic.yml'
      - '.github/workflows/xmatch-fixture.yml'
      - 'scripts/check-workflow-report-paths.mjs'
      - 'scripts/check-workflow-report-paths.test.mjs'
      - 'scripts/build-rustdoc-index.mjs'
      - 'scripts/build-rustdoc-index.test.mjs'
      - 'scripts/report-scheduled-failure.mjs'
      - 'scripts/report-scheduled-failure.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit reporting topology
        run: node scripts/check-workflow-report-paths.mjs
      - name: Exercise reporting audit mutations
        run: node --test scripts/check-workflow-report-paths.test.mjs scripts/report-scheduled-failure.test.mjs
