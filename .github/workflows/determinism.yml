# Temporary, manual-only #6402 comparison on the provisional post-#6309 parent.
# This branch is a scratch measurement branch and is not a product PR.
name: Scratch #6402 native A/B

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_BUILD_JOBS: '2'

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source pair
        shell: bash
        run: |
          test "$(git rev-parse 2f14c997c^)" = 3329522ecce13cbf86429e344b4a24659a33ec14
          test "$(git rev-parse HEAD^)" = "$(git rev-parse 2f14c997c)"
          test "$(git show --format= 2f14c997c | git patch-id --stable | cut -d' ' -f1)" = e55afcbece06cdd7c592d489daf42342eda5c1d3
          git diff --exit-code 2f14c997c -- rust/geometry rust/processing rust/core
          git worktree add --detach /tmp/ifclite-6402-base 3329522ecce13cbf86429e344b4a24659a33ec14
          git rev-parse 2f14c997c > scratch-child-commit.txt
          git -C /tmp/ifclite-6402-base rev-parse HEAD > scratch-base-commit.txt
      - name: Setup Rust
        run: rustup show
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.12'
      - name: Fetch exact fixtures
        run: |
          node scripts/fixtures/fetch-fixtures.mjs \
            ara3d/AC20-FZK-Haus.ifc \
            'various/01_Snowdon_Towers_Sample_Structural(1).ifc'
          sha256sum tests/models/ara3d/AC20-FZK-Haus.ifc \
            'tests/models/various/01_Snowdon_Towers_Sample_Structural(1).ifc'
      - name: Build detached base binary
        run: |
          cd /tmp/ifclite-6402-base
          CARGO_TARGET_DIR=/tmp/ifclite-6402-base-target cargo build --profile profiling -p ifc-lite-processing --example perf_probe
      - name: Build exact child binary
        run: CARGO_TARGET_DIR=/tmp/ifclite-6402-child-target cargo build --profile profiling -p ifc-lite-processing --example perf_probe
      - name: Five balanced interleaved pairs per fixture
        run: |
          python3 scripts/perf/scratch_6402_ab.py \
            /tmp/ifclite-6402-base-target/profiling/examples/perf_probe \
            /tmp/ifclite-6402-child-target/profiling/examples/perf_probe \
            scratch-perf-results \
            tests/models/ara3d/AC20-FZK-Haus.ifc \
            'tests/models/various/01_Snowdon_Towers_Sample_Structural(1).ifc'
          cp scratch-base-commit.txt scratch-child-commit.txt scratch-perf-results/
      - name: Native mesh determinism manifest
        run: CARGO_TARGET_DIR=/tmp/ifclite-6402-child-target cargo test -p ifc-lite-processing --test mesh_determinism --quiet
      - name: Quick IfcOpenShell committed-reference parity
        run: |
          python3 -m pip install maturin
          maturin build --release -m rust/python/Cargo.toml -o /tmp/ifclite-6402-wheels
          python3 -m pip install /tmp/ifclite-6402-wheels/*.whl
          cd tools/ifcopenshell_reference
          python3 -m unittest test_harness
          python3 dump_ifclite.py \
            ../../rust/geometry/tests/fixtures/bath_csg_solid.ifc \
            ../../rust/geometry/tests/fixtures/issue_1155_halfspace_flyaway.ifc \
            ../../rust/geometry/tests/fixtures/swept_disk_composite_arc_crankbar.ifc \
            ../../rust/geometry/tests/fixtures/swept_disk_trimmed_line.ifc \
            --out-dir ../../scratch-perf-results/parity
          fail=0
          for f in bath_csg_solid issue_1155_halfspace_flyaway \
                   swept_disk_composite_arc_crankbar swept_disk_trimmed_line; do
            python3 compare.py --reference "reference/$f.reference.json" \
              --ifclite "../../scratch-perf-results/parity/$f.ifclite.json" \
              --allowlist allowlist.json || fail=1
          done
          exit $fail
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scratch-6402-provisional-ab
          path: scratch-perf-results/
          if-no-files-found: warn
