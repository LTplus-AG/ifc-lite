# SPDX-License-Identifier: MPL-2.0
# Opt-in qualification of the isolated NVIDIA SMLib native adapter, its Rust
# worker client and its browser module-Worker build. Nothing in core/geometry/processing/wasm depends on either, so
# this workflow is path-filtered to them and is intentionally NOT a required check.
# It costs about an hour of hosted runner per commit, so a PR runs it only for
# changes it can observe; the nightly run catches what the narrow filter misses.
name: Geometry platform (native adapter)

on:
  pull_request:
    paths:
      - 'native/**'
      # M2-D builds and drives the real opt-in viewer. Only its retained code,
      # the viewport that hosts it and its build configuration: an ordinary
      # viewer change must not queue an hour-long native build.
      - 'apps/viewer/**/*[Rr]etained*'
      - 'apps/viewer/src/lib/retained/**'
      - 'apps/viewer/src/components/viewer/Viewport.tsx'
      - 'apps/viewer/src/components/viewer/ViewportContainer.tsx'
      - 'apps/viewer/vite.config.ts'
      - 'apps/viewer/vite-plugins/**'
      - 'apps/viewer/package.json'
      - 'tests/e2e/retained-viewer.e2e.spec.ts'
      - 'tests/benchmark/frames/**'
      - 'playwright.config.ts'
      - 'tests/evidence/m2-d/**'
      - 'rust/geometry-runtime/**'
      - 'rust/retained-native/**'
      - 'rust/processing/tests/fixtures/issue_2019_*'
      - 'rust/processing/tests/fixtures/issue_3641_*'
      - 'rust/processing/src/processor/**'
      - 'rust/processing/src/element/session_retained/**'
      - 'rust/geometry/src/program/retained/**'
      - 'rust/geometry/tests/m3_*'
      - 'rust/geometry/tests/support/m3_opening_fixtures.rs'
      - 'rust/processing/tests/m3_*'
      - 'rust/processing/src/element.rs'
      - 'rust/processing/Cargo.toml'
      - 'tests/fixtures/cli-retained/**'
      - 'apps/viewer/public/_fixtures/AC20-FZK-Haus.ifc'
      - 'tests/fixtures/synthetic-retained/**'
      - 'tests/manifests/cli-retained-coverage.tsv'
      - 'tests/models/manifest.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # Retained requests the worker executes are lowered here.
      - 'rust/geometry/src/document/**'
      - 'rust/geometry/src/program/**'
      - 'rust/geometry/tests/m*'
      # Shared test fixtures (CUT-0 prisms) used by the native and Worker witnesses.
      - 'rust/geometry/tests/support/**'
      - 'rust/processing/tests/m*'
      - 'tests/manifests/cli-retained-coverage.d/**'
      - 'tests/evidence/*/witnesses.txt'
      - 'rust/geometry/src/analytic/**'
      # Browser module-Worker staging and its actual-Worker probe.
      - 'scripts/stage-retained-browser-assets.mjs'
      - 'scripts/stage-retained-runtime-peer.mjs'
      - 'scripts/lib/__fixtures__/retained-driver/**'
      - 'scripts/stage-cli-retained-engine.mjs'
      - 'scripts/stage-cli-retained-engine.test.mjs'
      - 'scripts/cli-retained-engine/**'
      - 'scripts/retained-compare/**'
      - 'packages/cli/**'
      - 'packages/geometry/**'
      - 'packages/wasm/**'
      - 'scripts/*retained*'
      - 'scripts/smlib-*'
      - 'scripts/lib/*retained*'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'scripts/smlib-node-transport.test.mjs'
      - 'scripts/lib/__fixtures__/smlib-node/**'
      - 'tests/evidence/m1-f1/**'
      - 'LICENSE'
      - 'licenses/retained/**'
      - 'scripts/smlib-browser-worker-probe.mjs'
      - 'scripts/wasm-test-mime-driver.mjs'
      # The browser executor lives in the published wasm crate.
      - 'rust/wasm-bindings/src/retained_browser/**'
      # M2-A streaming session and view meshes.
      - 'rust/wasm-bindings/src/api/retained_*.rs'
      - 'rust/wasm-bindings/src/retained_view.rs'
      - 'rust/wasm-bindings/js/**'
      # Feature wiring for the retained-browser build (the wasm32 path
      # only these actual-Worker lanes exercise).
      - 'rust/wasm-bindings/Cargo.toml'
      - 'rust/wasm-bindings/src/lib.rs'
      - 'rust/geometry/Cargo.toml'
      - 'rust/wasm-bindings/src/api/retained_browser.rs'
      - 'rust/wasm-bindings/tests/retained-browser/**'
      - 'scripts/retained-browser-contract.mjs'
      # The actual-Worker contract serves the geometry fixture directory to the browser.
      - 'rust/geometry/tests/fixtures/**'
      - 'scripts/build-wasm.sh'
      - 'packages/wasm/retained.*'
      - 'packages/wasm/pkg-retained/**'
      - 'packages/wasm/test/retained-browser.test.mjs'
      - '.github/workflows/geometry-platform.yml'
  # The backstop for the narrow pull_request filter above.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      corpus:
        type: boolean
        default: false
        description: Run the downloaded model corpus as well as committed fixtures

# A new commit makes the PR's running qualification worthless; nightly and
# manual runs are never cancelled.
concurrency:
  group: geometry-platform-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Checkout pinned upstream SDK (fetched, never vendored)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: NVIDIA-Omniverse/usd-brep
          ref: c9c5979f04cea8c38213004d4f04df0dcfb40d05
          path: upstream-smlib
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Build native owned boundary and worker
        run: |
          cmake -S native/smlib-adapter -B "$RUNNER_TEMP/smlib-native" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSMLIB_SOURCE="$GITHUB_WORKSPACE/upstream-smlib"
          cmake --build "$RUNNER_TEMP/smlib-native" --parallel 4
      - name: Collect native runtime licence review inputs and verify installation
        run: |
          node scripts/retained-native-link-inventory.mjs "$RUNNER_TEMP/smlib-native/ifclite_smlib_worker" \
            "$RUNNER_TEMP/smlib-native" "$RUNNER_TEMP/retained-native-link-inventory.json"
          cmake --install "$RUNNER_TEMP/smlib-native" --prefix "$RUNNER_TEMP/retained-native-install"
          cmp "$RUNNER_TEMP/retained-native-install/share/licenses/ifclite-smlib/THIRD_PARTY_NOTICES.txt" \
            licenses/retained/THIRD_PARTY_NOTICES.txt
      - name: Execute every native owned boundary
        id: native-ctest
        continue-on-error: true
        run: ctest --test-dir "$RUNNER_TEMP/smlib-native" --output-on-failure
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: geometry-platform
      - name: Real Rust subprocess integration
        id: native-consumers
        continue-on-error: true
        env:
          IFCLITE_SMLIB_PATH: ${{ runner.temp }}/smlib-native/ifclite_smlib_worker
        run: |
          test -x "$IFCLITE_SMLIB_PATH"
          IFCLITE_SMLIB_WORKER="$IFCLITE_SMLIB_PATH" \
            cargo test --locked -p ifc-lite-geometry-runtime --all-targets --no-fail-fast
      - name: Check generated halfspace boundary fixtures
        id: halfspace-generated
        continue-on-error: true
        run: python3 tests/fixtures/synthetic-retained/generate-halfspace-boundaries.py --check
      - name: Fetch required native halfspace witnesses
        id: halfspace-fetch
        continue-on-error: true
        run: |
          node scripts/fixtures/fetch-fixtures.mjs \
            ara3d/AC20-FZK-Haus.ifc issues/960_house_segmented_roof_clip.ifc
      - name: Retained native comparison and real executor tests
        id: native-compare
        continue-on-error: true
        env:
          IFC_LITE_REQUIRE_FIXTURES: "1"
        run: |
          # The default step shell has no pipefail: without it `| tee` would hide
          # a failing cargo test whose witness markers were already printed.
          set -o pipefail
          export IFCLITE_REQUIRE_SMLIB=1
          export IFCLITE_M9_REFERENCE="$RUNNER_TEMP/m9-native-types.json"
          export IFCLITE_M8_NATIVE_REFERENCE="$RUNNER_TEMP/m8-native.json"
          export IFCLITE_M11F_REFERENCE="$RUNNER_TEMP/m11-f-native-faces.json"
          export IFCLITE_M11_N_REFERENCE="$RUNNER_TEMP/m11-n-native.json"
          export IFCLITE_M11A_REFERENCE="$RUNNER_TEMP/m11-a-native-appearance.json"
          export IFCLITE_M11_I_REFERENCE="$RUNNER_TEMP/m11-i-native-instances.json"
          export IFCLITE_SMLIB_WORKER="$RUNNER_TEMP/smlib-native/ifclite_smlib_worker"
          # Native parity references the browser lanes read (one file per
          # slice, named after the /smlib path the browser test fetches).
          mkdir -p "$RUNNER_TEMP/native-references"
          export IFCLITE_M5_REFERENCE="$RUNNER_TEMP/native-references/m5-native-clips.json"
          export IFCLITE_M5_LINEAGE_REFERENCE="$RUNNER_TEMP/native-references/m5-native-lineage.json"
          export IFCLITE_M6_REFERENCE="$RUNNER_TEMP/native-references/m6-native.json"
          cargo test --locked -p ifc-lite-retained-native --features retained-runtime --all-targets -- --nocapture 2>&1 | tee "$RUNNER_TEMP/native-witnesses.log"
          for file in tests/evidence/*/witnesses.txt; do
            [[ -f "$file" ]] || continue
            while IFS= read -r witness; do
              [[ -z "$witness" || "$witness" == \#* ]] && continue
              # End-anchored only: parallel tests under --nocapture can land this
              # whole line inside an unbuffered eprintln!, as `Skipping unsupported
              # sdk witness executed: x`. The end anchor still rejects `x_longer`.
              grep -Eq "sdk witness executed: ${witness}\$" "$RUNNER_TEMP/native-witnesses.log"
            done < "$file"
          done
          cargo run --release --locked -p ifc-lite-retained-native --features retained-runtime --example retained_compare -- \
            --worker "$IFCLITE_SMLIB_WORKER" --out "$RUNNER_TEMP/native-compare" --committed --gate
      - name: M3 native opening witnesses
        id: m3-native
        continue-on-error: true
        run: |
          export IFCLITE_REQUIRE_SMLIB=1
          export IFCLITE_SMLIB_WORKER="$RUNNER_TEMP/smlib-native/ifclite_smlib_worker"
          export IFCLITE_M3_REFERENCE="$RUNNER_TEMP/m3-native-openings.json"
          cargo test --locked -p ifc-lite-retained-native --features retained-runtime --test m3_native -- --nocapture | tee "$RUNNER_TEMP/m3-native.log"
          for witness in m3_prism_curved m3_synthetic_empty m3_scaled_cutter m3_nonbakeable_cutter m3_unsupported m3_kernel_failure m3_frames m3_lineage m3_reference m3_two_parts_two_openings m3_empty_opening_body; do
            grep -E "sdk witness executed: ${witness}\$" "$RUNNER_TEMP/m3-native.log"
          done
      - name: Download optional corpus
        if: inputs.corpus == true
        run: corepack enable && pnpm fixtures
      - name: Optional retained native corpus
        if: inputs.corpus == true
        run: |
          cargo run --release --locked -p ifc-lite-retained-native --features retained-runtime --example retained_compare -- \
            --worker "$RUNNER_TEMP/smlib-native/ifclite_smlib_worker" --out "$RUNNER_TEMP/native-corpus" --manifest tests/models/manifest.json
      - name: Upload native comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retained-native-comparison
          path: |
            ${{ runner.temp }}/native-compare/*.json
            ${{ runner.temp }}/native-compare/*.tsv
            ${{ runner.temp }}/native-corpus/*.json
            ${{ runner.temp }}/native-corpus/*.tsv
          if-no-files-found: error
      - name: Checkout pinned Emscripten SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: emscripten-core/emsdk
          ref: 3b3963d86a5c97adaf6eaa845cdfe0b811c2f960
          path: emsdk
          persist-credentials: false
      - name: Build the browser module-Worker boundary (Emscripten 4.0.15)
        run: |
          emsdk/emsdk install 4.0.15
          emsdk/emsdk activate 4.0.15
          source emsdk/emsdk_env.sh
          emcmake cmake -S native/smlib-adapter -B "$RUNNER_TEMP/smlib-wasm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSMLIB_SOURCE="$GITHUB_WORKSPACE/upstream-smlib"
          cmake --build "$RUNNER_TEMP/smlib-wasm" --parallel 4
      - name: Execute every owned boundary under Node, plus the browser binary
        id: wasm-ctest
        continue-on-error: true
        run: ctest --test-dir "$RUNNER_TEMP/smlib-wasm" --output-on-failure
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuilt-worker open tessellation refusal (#7955)
        id: open-tessellation
        continue-on-error: true
        run: |
          # The same witness the revert oracle runs: it rebuilds the worker from
          # this checkout, so a native adapter regression cannot hide behind a
          # stale binary. A skip here is a failure (IFCLITE_REQUIRE_SMLIB).
          set -o pipefail
          IFCLITE_REQUIRE_SMLIB=1 IFCLITE_SMLIB_NATIVE_BUILD="$RUNNER_TEMP/smlib-native" \
            node --test scripts/smlib-open-tessellation.test.mjs | tee "$RUNNER_TEMP/open-tessellation.log"
          grep -F "sdk witness executed: open_tessellation_rebuilt_worker" "$RUNNER_TEMP/open-tessellation.log"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Actual module Workers over the staged /smlib bundle
        id: browser-workers
        continue-on-error: true
        run: |
          node scripts/smlib-browser-worker-probe.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib"
      - name: Strict Clippy and unit tests with the opt-in retained-browser feature
        id: retained-clippy
        continue-on-error: true
        run: |
          cargo clippy --locked -p ifc-lite-wasm --all-targets --features retained-browser -- -D warnings
          cargo clippy --locked -p ifc-lite-wasm --all-targets --features retained-browser \
            --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked -p ifc-lite-wasm --lib --features retained-browser retained_browser
      - name: Stage /smlib beside the wasm crate for its actual-Worker tests
        run: |
          # wasm-bindgen-test serves the crate directory; the staging script
          # refuses an existing output, so this is always a fresh bundle.
          node scripts/stage-retained-browser-assets.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib" --out "$GITHUB_WORKSPACE/rust/wasm-bindings/smlib"
          # The SMLib-free runtime test uses its own transport; real-Worker
          # tests continue to use the untouched SDK assets under /smlib/.
          # m3-native is continue-on-error: a missing reference must not abort the
          # later independent lanes; m3-browser then fails with its own message.
          if [ -f "$RUNNER_TEMP/m3-native-openings.json" ]; then
            cp "$RUNNER_TEMP/m3-native-openings.json" rust/wasm-bindings/smlib/m3-native-openings.json
          fi
          if [ -f "$RUNNER_TEMP/m9-native-types.json" ]; then
            cp "$RUNNER_TEMP/m9-native-types.json" rust/wasm-bindings/smlib/m9-native-types.json
          fi
          if [ -f "$RUNNER_TEMP/m11-f-native-faces.json" ]; then
            cp "$RUNNER_TEMP/m11-f-native-faces.json" rust/wasm-bindings/smlib/m11-f-native-faces.json
          fi
          if [ -f "$RUNNER_TEMP/m11-n-native.json" ]; then
            cp "$RUNNER_TEMP/m11-n-native.json" rust/wasm-bindings/smlib/m11-n-native.json
          fi
          if [ -f "$RUNNER_TEMP/m11-i-native-instances.json" ]; then
            cp "$RUNNER_TEMP/m11-i-native-instances.json" rust/wasm-bindings/smlib/m11-i-native-instances.json
          fi
          if [ -f "$RUNNER_TEMP/m11-a-native-appearance.json" ]; then
            cp "$RUNNER_TEMP/m11-a-native-appearance.json" rust/wasm-bindings/smlib/m11-a-native-appearance.json
          fi
          # Generic: every reference a native lane wrote is served beside /smlib.
          # Same rule as above: an absent file is reported by the browser test.
          set -o pipefail
          shopt -s nullglob
          for reference in "$RUNNER_TEMP"/native-references/*.json; do
            cp "$reference" "rust/wasm-bindings/smlib/$(basename "$reference")"
          done
          node scripts/stage-retained-runtime-peer.mjs
          if [ -f "$RUNNER_TEMP/m8-native.json" ]; then
            cp "$RUNNER_TEMP/m8-native.json" rust/wasm-bindings/smlib/m8-native.json
          fi
          echo "IFCLITE_REAL_CHROMEDRIVER=$(command -v chromedriver)" >> "$GITHUB_ENV"
      - name: Actual module-Worker retained browser executor (ifc-lite-wasm)
        id: browser-runtime
        continue-on-error: true
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: |
          # The default step shell has no pipefail: without it `| tee` would hide
          # any failing retained_browser test behind the witness grep below.
          set -o pipefail
          wasm-pack test --headless --chrome \
            --chromedriver "$GITHUB_WORKSPACE/scripts/wasm-test-mime-driver.mjs" rust/wasm-bindings --lib \
            --features retained-browser -- retained_browser --nocapture | tee "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: m8 real browser Worker parity" "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: retained refusal browser lifecycle" "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: retained consumed-host browser lifecycle" "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: m10_browser_parity" "$RUNNER_TEMP/retained-browser.log"
          for witness in m5_browser_parity m5_browser_lineage m5_browser_clipped_opening; do
            grep -F "sdk witness executed: $witness" "$RUNNER_TEMP/retained-browser.log"
          done
      - name: M3 native and browser opening parity
        id: m3-browser
        continue-on-error: true
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: |
          wasm-pack test --headless --chrome \
            --chromedriver "$GITHUB_WORKSPACE/scripts/wasm-test-mime-driver.mjs" rust/wasm-bindings --lib \
            --features retained-browser -- retained_browser_m3_opening_parity
      - name: Build the canonical WASM package and the opt-in retained bundle
        run: BUILD_RETAINED=1 bash scripts/build-wasm.sh
      - name: Committed declarations match both bundles
        id: generated-types
        continue-on-error: true
        run: git diff --exit-code -- packages/wasm/pkg/ifc-lite.d.ts packages/wasm/pkg-retained/ifc-lite.d.ts
      - name: Opt-in package boundary (default engine, loader, retained engine)
        id: package-boundary
        continue-on-error: true
        run: node --test packages/wasm/test/retained-browser.test.mjs
      - name: Canonical JavaScript retained API with an actual module Worker
        id: browser-api
        continue-on-error: true
        run: |
          node scripts/retained-browser-contract.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib"
      - name: Staged Node retained engine with real worker_threads
        id: cli-retained
        continue-on-error: true
        run: |
          node scripts/stage-cli-retained-engine.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib" \
            --pkg-retained "$GITHUB_WORKSPACE/packages/wasm/pkg-retained" \
            --toolchain-notice "Emscripten-LICENSE=$GITHUB_WORKSPACE/emsdk/upstream/emscripten/LICENSE" \
            --out "$RUNNER_TEMP/cli-retained-engine"
          pnpm build --filter=@ifc-lite/cli
          IFCLITE_RETAINED_ENGINE="$RUNNER_TEMP/cli-retained-engine" \
            node --test scripts/cli-retained-engine/real-kernel.test.mjs
          IFCLITE_RETAINED_ENGINE="$RUNNER_TEMP/cli-retained-engine" \
            IFCLITE_NATIVE_PRODUCTS="$RUNNER_TEMP/native-compare/products.tsv" \
            IFCLITE_M3_REFERENCE="$RUNNER_TEMP/m3-native-openings.json" \
            IFCLITE_M11A_REFERENCE="$RUNNER_TEMP/m11-a-native-appearance.json" \
            node --test scripts/retained-compare/real-engine.test.mjs
          # Real authoring-tool exports through the built CLI: exact vs retained per product (#7955 item 4).
          IFCLITE_REQUIRE_SMLIB=1 IFCLITE_RETAINED_ENGINE="$RUNNER_TEMP/cli-retained-engine" \
            IFCLITE_NATIVE_PRODUCTS="$RUNNER_TEMP/native-compare/products.tsv" \
            node --test scripts/retained-compare/real-authoring.test.mjs
      - name: Browser parity and real retained viewer
        id: viewer-retained
        continue-on-error: true
        env:
          IFCLITE_RETAINED_ENGINE: ${{ runner.temp }}/cli-retained-engine
          IFCLITE_NATIVE_PRODUCTS: ${{ runner.temp }}/native-compare/products.tsv
          IFCLITE_BROWSER_OUT: ${{ runner.temp }}/viewer-retained
          IFCLITE_VIEWER_OUT: ${{ runner.temp }}/viewer-retained/e2e
          VITE_RETAINED_GEOMETRY: 'on'
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          # A skip is not parity evidence: missing upstream products fail this lane.
          test -s "$IFCLITE_RETAINED_ENGINE/engine-manifest.json"
          test -s "$IFCLITE_NATIVE_PRODUCTS"
          node --test scripts/retained-compare/browser.test.mjs
          # Turbo cache restoration does not remove outputs from another build mode.
          rm -rf apps/viewer/dist
          pnpm build:e2e --concurrency=1
          IFCLITE_REQUIRE_SMLIB=1 pnpm exec playwright test --project=viewer-retained
          rm -rf apps/viewer/dist
          VITE_RETAINED_GEOMETRY= IFCLITE_RETAINED_ENGINE= pnpm build:e2e --concurrency=1
          node scripts/check-viewer-retained-free.mjs
          VITE_RETAINED_GEOMETRY= IFCLITE_RETAINED_ENGINE= pnpm exec playwright test --project=viewer-retained-default
      - name: Optional retained browser corpus (report only)
        if: inputs.corpus == true
        continue-on-error: true
        run: |
          node scripts/retained-compare/browser.mjs --engine "$RUNNER_TEMP/cli-retained-engine" \
            --native "$RUNNER_TEMP/native-corpus/products.tsv" --out "$RUNNER_TEMP/viewer-retained-corpus" --corpus
      - name: Upload retained viewer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retained-viewer-comparison
          path: |
            ${{ runner.temp }}/retained-native-link-inventory.json
            ${{ runner.temp }}/viewer-retained/
            ${{ runner.temp }}/viewer-retained-corpus/
            test-results/
          if-no-files-found: error
      # Gather independent failures, then preserve a failing overall verdict.
      - name: Require every independent result
        if: always()
        env:
          M3_NATIVE: ${{ steps.m3-native.outcome }}
          M3_BROWSER: ${{ steps.m3-browser.outcome }}
          HALFSPACE_GENERATED: ${{ steps.halfspace-generated.outcome }}
          HALFSPACE_FETCH: ${{ steps.halfspace-fetch.outcome }}
          NATIVE_COMPARE: ${{ steps.native-compare.outcome }}
          NATIVE_CTEST: ${{ steps.native-ctest.outcome }}
          NATIVE_CONSUMERS: ${{ steps.native-consumers.outcome }}
          WASM_CTEST: ${{ steps.wasm-ctest.outcome }}
          BROWSER_WORKERS: ${{ steps.browser-workers.outcome }}
          BROWSER_RUNTIME: ${{ steps.browser-runtime.outcome }}
          BROWSER_API: ${{ steps.browser-api.outcome }}
          GENERATED_TYPES: ${{ steps.generated-types.outcome }}
          PACKAGE_BOUNDARY: ${{ steps.package-boundary.outcome }}
          RETAINED_CLIPPY: ${{ steps.retained-clippy.outcome }}
          CLI_RETAINED: ${{ steps.cli-retained.outcome }}
          VIEWER_RETAINED: ${{ steps.viewer-retained.outcome }}
          OPEN_TESSELLATION: ${{ steps.open-tessellation.outcome }}
        run: |
          failed=0
          for lane in HALFSPACE_GENERATED HALFSPACE_FETCH M3_NATIVE M3_BROWSER NATIVE_COMPARE NATIVE_CTEST NATIVE_CONSUMERS WASM_CTEST BROWSER_WORKERS BROWSER_RUNTIME BROWSER_API GENERATED_TYPES PACKAGE_BOUNDARY RETAINED_CLIPPY CLI_RETAINED VIEWER_RETAINED OPEN_TESSELLATION; do
            printf '%s=%s\n' "$lane" "${!lane}"
            if [[ "${!lane}" != success ]]; then failed=1; fi
          done
          exit "$failed"
