# SPDX-License-Identifier: MPL-2.0
name: Geometry platform integration

on:
  pull_request:
    paths:
      - 'native/smlib-adapter/**'
      - 'rust/geometry-runtime/**'
      - 'rust/core/**'
      - 'rust/geometry/Cargo.toml'
      - 'rust/geometry/src/test_support.rs'
      - 'rust/geometry/src/analytic/**'
      - 'rust/geometry/src/resource/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rust/geometry/src/document/**'
      - 'rust/processing/src/authored_geometry/**'
      - 'rust/processing/src/retained_geometry.rs'
      - 'rust/processing/tests/retained_*.rs'
      - 'rust/processing/src/element/**'
      - 'rust/processing/src/element.rs'
      - 'rust/geometry/src/program/**'
      - 'rust/wasm-bindings/src/api/retained_product*'
      - 'rust/wasm-bindings/src/api/retained_browser*'
      - 'rust/wasm-bindings/tests/retained-browser-contract.*'
      - 'rust/wasm-bindings/src/api/product_job.rs'
      - 'scripts/stage-retained-browser-assets.mjs'
      - 'scripts/wasm-test-mime-driver*'
      - 'scripts/verify-source-resource-feature-boundary.mjs'
      - 'scripts/perf/browser-static-server.ts'
      - 'scripts/perf/browser-cold-server-path.ts'
      - 'tests/e2e/retained-browser*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/models/manifest.json'
      - '.github/workflows/geometry-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-resource-account:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: source-resource-account
      - name: Prove ordinary and explicitly opted-in normal-library API boundaries
        run: node scripts/verify-source-resource-feature-boundary.mjs
      - name: Exercise the same normal core gate with the actual geometry account
        run: |
          cargo test --locked -p ifc-lite-core --lib --features source-resource-gate-test-support source_resources -- --nocapture
          cargo test --locked -p ifc-lite-geometry --lib --features source-resource-gate-test-support resource:: -- --nocapture
      - name: Compile the opted-in wasm test target
        run: cargo test --locked -p ifc-lite-core --lib --target wasm32-unknown-unknown --features source-resource-gate-test-support --no-run
      - name: Require strict Clippy for the unified test-support feature graph
        run: cargo clippy --workspace --all-targets --features ifc-lite-core/source-resource-gate-test-support -- -D warnings

  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch and authenticate actual model fixtures
        run: |
          pnpm fixtures
          pnpm fixtures:check
      - name: Checkout pinned upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: NVIDIA-Omniverse/usd-brep
          ref: c9c5979f04cea8c38213004d4f04df0dcfb40d05
          path: upstream-smlib
          persist-credentials: false
      - name: Build native owned boundary and worker
        run: |
          cmake -S native/smlib-adapter -B /tmp/smlib-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSMLIB_SOURCE="$GITHUB_WORKSPACE/upstream-smlib"
          cmake --build /tmp/smlib-native --parallel 4
      - name: Execute every native owned boundary
        id: native-ctest
        continue-on-error: true
        run: ctest --test-dir /tmp/smlib-native --output-on-failure
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: geometry-platform
      - name: Real Rust subprocess integration
        id: native-consumers
        continue-on-error: true
        env:
          IFCLITE_SMLIB_WORKER: /tmp/smlib-native/ifclite_smlib_worker
        run: |
          test -x "$IFCLITE_SMLIB_WORKER"
          cargo test --locked -p ifc-lite-geometry-runtime -p ifc-lite-processing --all-targets --no-fail-fast
      - name: Checkout pinned Emscripten SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: emscripten-core/emsdk
          ref: 3b3963d86a5c97adaf6eaa845cdfe0b811c2f960
          path: emsdk
          persist-credentials: false
      - name: Install Emscripten 4.0.15
        run: |
          emsdk/emsdk install 4.0.15
          emsdk/emsdk activate 4.0.15
      - name: Build WASM owned boundary
        shell: bash
        run: |
          source emsdk/emsdk_env.sh
          emcmake cmake -S native/smlib-adapter -B /tmp/smlib-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSMLIB_SOURCE="$GITHUB_WORKSPACE/upstream-smlib"
          cmake --build /tmp/smlib-wasm --parallel 4
      - name: Execute every WASM owned boundary under Node
        id: wasm-ctest
        continue-on-error: true
        run: ctest --test-dir /tmp/smlib-wasm --output-on-failure

      - name: Stage canonical assets for actual module-Worker tests
        shell: bash
        run: |
          # The runner serves /smlib relative to each test crate. Stage into new
          # directories; the canonical publisher refuses every existing output.
          node scripts/stage-retained-browser-assets.mjs --build /tmp/smlib-wasm \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib" --out "$GITHUB_WORKSPACE/rust/geometry-runtime/smlib"
          node scripts/stage-retained-browser-assets.mjs --build /tmp/smlib-wasm \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib" --out "$GITHUB_WORKSPACE/rust/processing/smlib"
          node scripts/stage-retained-browser-assets.mjs --build /tmp/smlib-wasm \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib" --out "$GITHUB_WORKSPACE/rust/wasm-bindings/smlib"
      - name: Authenticate the real ChromeDriver behind the MIME adapter
        shell: bash
        run: |
          driver=$(command -v chromedriver)
          "$driver" --version
          echo "IFCLITE_REAL_CHROMEDRIVER=$driver" >> "$GITHUB_ENV"
      - name: Actual browser runtime
        id: browser-runtime
        continue-on-error: true
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 180
        run: wasm-pack test --headless --chrome --chromedriver "$GITHUB_WORKSPACE/scripts/wasm-test-mime-driver.mjs" rust/geometry-runtime --lib
      - name: Actual browser shared product continuations
        id: browser-processing
        continue-on-error: true
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 180
        # wasm-pack also invokes cargo build; only test-runner arguments belong
        # after this separator, so the filter never reaches cargo build.
        run: wasm-pack test --headless --chrome --chromedriver "$GITHUB_WORKSPACE/scripts/wasm-test-mime-driver.mjs" rust/processing --lib -- session_retained
      - name: Actual browser canonical source and product APIs
        id: browser-api
        continue-on-error: true
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 180
        run: wasm-pack test --headless --chrome --chromedriver "$GITHUB_WORKSPACE/scripts/wasm-test-mime-driver.mjs" rust/wasm-bindings --lib -- retained_
      - name: Build canonical package for the actual JavaScript export contract
        run: pnpm build:wasm
      - name: Verify committed canonical declarations
        id: generated-types
        continue-on-error: true
        run: git diff --exit-code -- packages/wasm/pkg/ifc-lite.d.ts
      - name: Stage actual Worker assets for the JavaScript export contract
        run: |
          node scripts/stage-retained-browser-assets.mjs --build /tmp/smlib-wasm \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib" --out "$GITHUB_WORKSPACE/apps/viewer/public/smlib"
      - name: Install browser for the canonical JavaScript contract
        run: pnpm exec playwright install --with-deps chromium
      - name: Execute canonical JavaScript exports with actual browser Worker
        id: browser-js
        continue-on-error: true
        run: pnpm test:retained-browser
      - name: Preserve actual JavaScript browser witness
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retained-browser-contract
          path: test-results/retained-browser
          if-no-files-found: ignore
      # Gather independent failures, then preserve a failing overall verdict.
      # No skipped/unrun lane or continued numerical failure qualifies the job.
      - name: Require every independent boundary and consumer result
        if: always()
        env:
          NATIVE_CTEST: ${{ steps.native-ctest.outcome }}
          NATIVE_CONSUMERS: ${{ steps.native-consumers.outcome }}
          WASM_CTEST: ${{ steps.wasm-ctest.outcome }}
          BROWSER_RUNTIME: ${{ steps.browser-runtime.outcome }}
          BROWSER_PROCESSING: ${{ steps.browser-processing.outcome }}
          BROWSER_API: ${{ steps.browser-api.outcome }}
          GENERATED_TYPES: ${{ steps.generated-types.outcome }}
          BROWSER_JS: ${{ steps.browser-js.outcome }}
        run: |
          failed=0
          for lane in NATIVE_CTEST NATIVE_CONSUMERS WASM_CTEST BROWSER_RUNTIME BROWSER_PROCESSING BROWSER_API GENERATED_TYPES BROWSER_JS; do
            printf '%s=%s\n' "$lane" "${!lane}"
            if [[ "${!lane}" != success ]]; then failed=1; fi
          done
          exit "$failed"
