# SPDX-License-Identifier: MPL-2.0
# Opt-in qualification of the isolated NVIDIA SMLib native adapter, its Rust
# worker client and its browser module-Worker build. Nothing in core/geometry/processing/wasm depends on either, so
# this workflow is path-filtered to them and is intentionally NOT a required check.
# It holds a hosted runner for over an hour per commit, so it does not run on every
# push to main.
#
# WHAT RUNS WHERE
# - Merge queue (before merge, blocking): a batch whose diff touches the native/retained
#   engine runs the native-adapter job through `workflow_call` from test.yml's
#   `native-adapter` job, so a failure blocks the merge via the required
#   `Build + WASM + Rust + Node` aggregate. Which of the paths below count for a batch:
#   on.pull_request.paths less BATCH_EXCLUDE, plus BATCH_KEEP
#   (scripts/lib/native-adapter-batch.mjs). BATCH_EXCLUDE (rust/core, the rest of
#   rust/processing including src/style, non-retained packages/cli, packages/wasm/pkg,
#   the viewer host, root config, ...) is checked NIGHTLY ONLY. No corpus.
# - Labelled PR (before merge, opt-in): add the `ci:native-adapter` label to run the
#   native-adapter job on a PR touching any path below, BATCH_EXCLUDE included. Do it for
#   a change to an excluded path that could break retained parity. The corpus never runs
#   on a PR; for it too: `gh workflow run geometry-platform.yml --ref <branch> -f corpus=true`.
# - Nightly (after merge, 02:30 UTC, main's HEAD): the whole lane with no path filter:
#   native-adapter (browser parity, the retained viewer), all corpus shards and the
#   browser corpus. `nightly-range` lists every commit since the last green full run (the
#   record is GitHub's own run history), so a cancelled, missing or red night widens the
#   next range instead of dropping commits. A red night comments on one tracking issue
#   (`ci: scheduled Geometry platform (native adapter) lane failed`, label nightly-red)
#   with that range and the run, and native-adapter-bisect.yml then re-runs only the
#   failed job or shards to name the first bad commit there.
# scripts/check-native-adapter-triggers.mjs holds all of this, including that a path
# BATCH_EXCLUDE takes off the queue is still covered nightly (lib/native-adapter-nightly.mjs).
name: Geometry platform (native adapter)

on:
  pull_request:
    # `labeled` lets the label start the job on the current commit.
    types: [opened, synchronize, reopened, labeled]
    paths:
      # Every crate in the retained engine's path-dependency closure, derived from
      # the Cargo manifests and held by scripts/check-native-adapter-triggers.mjs.
      # Directory-wide, not exact paths: shared exact-engine code (geometry/src/processors,
      # core, processing/src/style) feeds retained parity too (#7955).
      - 'rust/clash/**'
      - 'rust/core/**'
      - 'rust/export/**'
      - 'rust/geometry/**'
      - 'rust/geometry-runtime/**'
      - 'rust/landxml/**'
      - 'rust/processing/**'
      - 'rust/retained-native/**'
      - 'rust/testkit/**'
      - 'rust/wasm-bindings/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      # Local actions the job calls.
      - '.github/actions/setup-wasm-build/**'
      - 'native/**'
      # M2-D builds and drives the real opt-in viewer. Only its retained code,
      # the viewport that hosts it and its build configuration: an ordinary
      # viewer change must not queue an hour-long native build.
      - 'apps/viewer/**/*Retained*'
      - 'apps/viewer/**/*retained*'
      - 'apps/viewer/src/lib/retained/**'
      - 'apps/viewer/src/components/viewer/Viewport.tsx'
      - 'apps/viewer/src/components/viewer/ViewportContainer.tsx'
      - 'apps/viewer/vite.config.ts'
      - 'apps/viewer/vite-plugins/**'
      - 'apps/viewer/package.json'
      - 'tests/e2e/retained-viewer.e2e.spec.ts'
      - 'tests/benchmark/frames/**'
      - 'playwright.config.ts'
      - 'rust/geometry-runtime/**'
      - 'rust/retained-native/**'
      - 'rust/processing/tests/fixtures/issue_2019_*'
      - 'rust/processing/tests/fixtures/issue_3641_*'
      - 'rust/processing/src/processor/**'
      - 'rust/processing/src/element/session_retained/**'
      - 'rust/geometry/src/program/retained/**'
      - 'rust/geometry/tests/m3_*'
      - 'rust/geometry/tests/support/m3_opening_fixtures.rs'
      - 'rust/processing/tests/m3_*'
      - 'rust/processing/src/element.rs'
      - 'rust/processing/Cargo.toml'
      - 'tests/fixtures/cli-retained/**'
      - 'apps/viewer/public/_fixtures/AC20-FZK-Haus.ifc'
      - 'apps/viewer/public/samples/building-architecture.ifc'
      - 'apps/viewer/public/samples/hello-wall.ifc'
      - 'tests/fixtures/synthetic-retained/**'
      - 'tests/manifests/cli-retained-coverage.tsv'
      - 'tests/models/manifest.json'
      # Retained requests the worker executes are lowered here.
      - 'rust/geometry/src/document/**'
      - 'rust/geometry/src/program/**'
      - 'rust/geometry/tests/m1*'
      - 'rust/geometry/tests/m2*'
      - 'rust/geometry/tests/m3*'
      - 'rust/geometry/tests/m4*'
      - 'rust/geometry/tests/m5*'
      - 'rust/geometry/tests/m6*'
      - 'rust/geometry/tests/m7*'
      - 'rust/geometry/tests/m8*'
      - 'rust/geometry/tests/m9*'
      # Shared test fixtures (CUT-0 prisms) used by the native and Worker witnesses.
      - 'rust/geometry/tests/support/**'
      # Milestone witnesses only: `m*` also matched module_size_*, mesh_* and material_*.
      - 'rust/processing/tests/m1*'
      - 'rust/processing/tests/m2*'
      - 'rust/processing/tests/m3*'
      - 'rust/processing/tests/m4*'
      - 'rust/processing/tests/m5*'
      - 'rust/processing/tests/m6*'
      - 'rust/processing/tests/m7*'
      - 'rust/processing/tests/m8*'
      - 'rust/processing/tests/m9*'
      - 'tests/manifests/cli-retained-coverage.d/**'
      - 'tests/evidence/*/witnesses.txt'
      - 'rust/geometry/src/analytic/**'
      # Browser module-Worker staging and its actual-Worker probe.
      - 'scripts/stage-retained-browser-assets.mjs'
      - 'scripts/stage-retained-runtime-peer.mjs'
      - 'scripts/lib/__fixtures__/retained-driver/**'
      - 'scripts/stage-cli-retained-engine.mjs'
      - 'scripts/stage-cli-retained-engine.test.mjs'
      - 'scripts/cli-retained-engine/**'
      - 'scripts/retained-compare/**'
      - 'packages/cli/**'
      - 'packages/geometry/**'
      - 'packages/wasm/**'
      - 'scripts/*retained*'
      - 'scripts/smlib-*'
      # The fixture fetch steps run this gate and import its siblings.
      - 'scripts/fixtures/*.mjs'
      # Scripts the job itself runs (the guard in its first step, with what it imports; the corpus judge).
      - 'scripts/check-native-adapter-triggers.mjs'
      - 'scripts/check-retained-corpus-summary.mjs'
      - 'scripts/lib/ci-path-coverage.mjs'
      - 'scripts/lib/native-adapter-batch.mjs'
      - 'scripts/lib/native-adapter-nightly.mjs'
      - 'scripts/lib/is-main-entry.mjs'
      - 'scripts/lib/workflow-job-condition.mjs'
      - 'scripts/lib/workflow-permissions.mjs'
      # The split lane's plumbing, verdicts and audit (shadow phase).
      - 'scripts/native-adapter-split.mjs'
      - 'scripts/lib/native-adapter-split.mjs'
      - 'scripts/lib/native-adapter-split-compare.mjs'
      # check-viewer-retained-free.mjs --lazy reads the startup graph with its eagerScripts().
      - 'scripts/perf-ratchet/measure-bundle.mjs'
      - 'scripts/lib/*retained*'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'scripts/smlib-node-transport.test.mjs'
      - 'scripts/lib/__fixtures__/smlib-node/**'
      - 'LICENSE'
      - 'licenses/retained/**'
      - 'scripts/smlib-browser-worker-probe.mjs'
      - 'scripts/wasm-test-mime-driver.mjs'
      # The browser executor lives in the published wasm crate.
      - 'rust/wasm-bindings/src/retained_browser/**'
      # M2-A streaming session and view meshes.
      - 'rust/wasm-bindings/src/api/retained_*.rs'
      - 'rust/wasm-bindings/src/retained_view.rs'
      - 'rust/wasm-bindings/js/**'
      # Feature wiring for the retained-browser build (the wasm32 path
      # only these actual-Worker lanes exercise).
      - 'rust/wasm-bindings/Cargo.toml'
      - 'rust/wasm-bindings/src/lib.rs'
      - 'rust/geometry/Cargo.toml'
      - 'rust/wasm-bindings/src/api/retained_browser.rs'
      - 'rust/wasm-bindings/tests/retained-browser/**'
      - 'scripts/retained-browser-contract.mjs'
      # The actual-Worker contract serves the geometry fixture directory to the browser.
      - 'rust/geometry/tests/fixtures/**'
      - 'scripts/build-wasm.sh'
      - 'packages/wasm/retained.*'
      - 'packages/wasm/pkg-retained/**'
      - 'packages/wasm/test/retained-browser.test.mjs'
      - '.github/workflows/geometry-platform.yml'
  # The backstop for PRs that do not opt in, and the only run that carries the corpus.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      corpus:
        type: boolean
        default: false
        description: Run the downloaded model corpus as well as committed fixtures
  # A merge-queue batch (test.yml). Inside a called workflow `github.event_name` is the
  # caller's `pull_request`, so `batch` is what lets the job past the label gate. There
  # is no `corpus` input: the corpus jobs stay nightly and dispatch only.
  workflow_call:
    inputs:
      batch:
        type: boolean
        default: false
        description: Called by a merge-queue batch's Test run
      # native-adapter-bisect.yml: check out this commit and run only the parts named below.
      bisect_sha:
        type: string
        default: ''
        description: Bisect probe commit (full SHA)
      bisect_adapter:
        type: boolean
        default: false
        description: Bisect probe runs the native-adapter job
      bisect_shards:
        type: string
        default: ''
        description: Bisect probe runs these corpus shards (JSON array)

permissions:
  contents: read

jobs:
  native-adapter:
    # A bot applying any other label must neither start nor restart this job.
    # A merge-queue batch calls it with `batch` (see on.workflow_call).
    # A bisect probe (bisect_sha) runs it only when asked to.
    if: >-
      (!inputs.bisect_sha || inputs.bisect_adapter) && (
      inputs.batch == true ||
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:native-adapter') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:native-adapter')))
    # At job level, because a workflow-level group would let a skipped run cancel
    # this one. A new commit makes the PR's running job worthless; nightly and
    # manual runs are never cancelled. A batch run gets its own group (the caller's
    # run id, never the batch PR's number) and is never cancelled from here: a
    # re-pushed batch cancels the whole Test run through test.yml's own concurrency.
    concurrency:
      group: geometry-platform-${{ !inputs.batch && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.batch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Empty (the event's commit) except on a bisect probe.
          ref: ${{ inputs.bisect_sha }}
          persist-credentials: false
      # Native witness enforcement also uses the repository's supported Node.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Guard the lane's own triggers
        run: node scripts/check-native-adapter-triggers.mjs
      - name: Checkout pinned upstream SDK (fetched, never vendored)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: NVIDIA-Omniverse/usd-brep
          ref: c9c5979f04cea8c38213004d4f04df0dcfb40d05
          path: upstream-smlib
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Build native owned boundary and worker
        run: |
          cmake -S native/smlib-adapter -B "$RUNNER_TEMP/smlib-native" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSMLIB_SOURCE="$GITHUB_WORKSPACE/upstream-smlib"
          cmake --build "$RUNNER_TEMP/smlib-native" --parallel 4
      - name: Collect native runtime licence review inputs and verify installation
        run: |
          node scripts/retained-native-link-inventory.mjs "$RUNNER_TEMP/smlib-native/ifclite_smlib_worker" \
            "$RUNNER_TEMP/smlib-native" "$RUNNER_TEMP/retained-native-link-inventory.json"
          cmake --install "$RUNNER_TEMP/smlib-native" --prefix "$RUNNER_TEMP/retained-native-install"
          cmp "$RUNNER_TEMP/retained-native-install/share/licenses/ifclite-smlib/THIRD_PARTY_NOTICES.txt" \
            licenses/retained/THIRD_PARTY_NOTICES.txt
      - name: Execute every native owned boundary
        id: native-ctest
        continue-on-error: true
        run: ctest --test-dir "$RUNNER_TEMP/smlib-native" --output-on-failure
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: geometry-platform
      - name: Real Rust subprocess integration
        id: native-consumers
        continue-on-error: true
        env:
          IFCLITE_SMLIB_PATH: ${{ runner.temp }}/smlib-native/ifclite_smlib_worker
        run: |
          test -x "$IFCLITE_SMLIB_PATH"
          IFCLITE_SMLIB_WORKER="$IFCLITE_SMLIB_PATH" \
            cargo test --locked -p ifc-lite-geometry-runtime --all-targets --no-fail-fast
      - name: Check generated halfspace boundary fixtures
        id: halfspace-generated
        continue-on-error: true
        run: python3 tests/fixtures/synthetic-retained/generate-halfspace-boundaries.py --check
      # Restore-only: test.yml on main saves this exact tree. The fetch below
      # then re-hashes every file and downloads only what is missing, so a
      # release-CDN outage no longer fails the lane while the manifest is
      # unchanged (#9329, #9342, #9351).
      - name: Restore fixtures from the main-branch cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/models
          key: ci-fixtures-source-v2-${{ runner.os }}-${{ hashFiles('tests/models/manifest.json', 'tests/models/README.md', 'tests/models/.manifest-ignore') }}
      - name: Fetch required native halfspace witnesses
        id: halfspace-fetch
        continue-on-error: true
        run: |
          node scripts/fixtures/fetch-fixtures.mjs \
            ara3d/AC20-FZK-Haus.ifc issues/960_house_segmented_roof_clip.ifc
      - name: Retained native comparison and real executor tests
        id: native-compare
        continue-on-error: true
        env:
          IFC_LITE_REQUIRE_FIXTURES: "1"
        run: |
          # The default step shell has no pipefail: without it `| tee` would hide
          # a failing cargo test whose witness markers were already printed.
          set -o pipefail
          export IFCLITE_REQUIRE_SMLIB=1
          export IFCLITE_M9_REFERENCE="$RUNNER_TEMP/m9-native-types.json"
          export IFCLITE_M8_NATIVE_REFERENCE="$RUNNER_TEMP/m8-native.json"
          export IFCLITE_M11F_REFERENCE="$RUNNER_TEMP/m11-f-native-faces.json"
          export IFCLITE_M11_N_REFERENCE="$RUNNER_TEMP/m11-n-native.json"
          export IFCLITE_M11A_REFERENCE="$RUNNER_TEMP/m11-a-native-appearance.json"
          export IFCLITE_M11T_REFERENCE="$RUNNER_TEMP/m11-t-native-surface.json"
          export IFCLITE_M11_I_REFERENCE="$RUNNER_TEMP/m11-i-native-instances.json"
          export IFCLITE_SMLIB_WORKER="$RUNNER_TEMP/smlib-native/ifclite_smlib_worker"
          # Native parity references the browser lanes read (one file per
          # slice, named after the /smlib path the browser test fetches).
          mkdir -p "$RUNNER_TEMP/native-references"
          export IFCLITE_M5_REFERENCE="$RUNNER_TEMP/native-references/m5-native-clips.json"
          export IFCLITE_M5_LINEAGE_REFERENCE="$RUNNER_TEMP/native-references/m5-native-lineage.json"
          export IFCLITE_M6_REFERENCE="$RUNNER_TEMP/native-references/m6-native.json"
          cargo test --locked -p ifc-lite-retained-native --features retained-runtime --all-targets -- --nocapture 2>&1 | tee "$RUNNER_TEMP/native-witnesses.log"
          node scripts/check-retained-witnesses.mjs --lane native --log "$RUNNER_TEMP/native-witnesses.log"
          cargo run --release --locked -p ifc-lite-retained-native --features retained-runtime --example retained_compare -- \
            --worker "$IFCLITE_SMLIB_WORKER" --out "$RUNNER_TEMP/native-compare" --committed --gate
      - name: M3 native opening witnesses
        id: m3-native
        continue-on-error: true
        run: |
          export IFCLITE_REQUIRE_SMLIB=1
          export IFCLITE_SMLIB_WORKER="$RUNNER_TEMP/smlib-native/ifclite_smlib_worker"
          export IFCLITE_M3_REFERENCE="$RUNNER_TEMP/m3-native-openings.json"
          cargo test --locked -p ifc-lite-retained-native --features retained-runtime --test m3_native -- --nocapture | tee "$RUNNER_TEMP/m3-native.log"
          for witness in m3_prism_curved m3_synthetic_empty m3_scaled_cutter m3_nonbakeable_cutter m3_unsupported m3_kernel_failure m3_frames m3_lineage m3_reference m3_two_parts_two_openings m3_empty_opening_body; do
            grep -E "sdk witness executed: ${witness}\$" "$RUNNER_TEMP/m3-native.log"
          done
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upload native comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retained-native-comparison
          path: |
            ${{ runner.temp }}/native-compare/*.json
            ${{ runner.temp }}/native-compare/*.tsv
          if-no-files-found: error
      - name: Checkout pinned Emscripten SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: emscripten-core/emsdk
          ref: 3b3963d86a5c97adaf6eaa845cdfe0b811c2f960
          path: emsdk
          persist-credentials: false
      - name: Build the browser module-Worker boundary (Emscripten 4.0.15)
        run: |
          emsdk/emsdk install 4.0.15
          emsdk/emsdk activate 4.0.15
          source emsdk/emsdk_env.sh
          emcmake cmake -S native/smlib-adapter -B "$RUNNER_TEMP/smlib-wasm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSMLIB_SOURCE="$GITHUB_WORKSPACE/upstream-smlib"
          cmake --build "$RUNNER_TEMP/smlib-wasm" --parallel 4
      - name: Execute every owned boundary under Node, plus the browser binary
        id: wasm-ctest
        continue-on-error: true
        run: ctest --test-dir "$RUNNER_TEMP/smlib-wasm" --output-on-failure
      - name: Rebuilt-worker open tessellation refusal (#7955)
        id: open-tessellation
        continue-on-error: true
        run: |
          # The same witness the revert oracle runs: it rebuilds the worker from
          # this checkout, so a native adapter regression cannot hide behind a
          # stale binary. A skip here is a failure (IFCLITE_REQUIRE_SMLIB).
          set -o pipefail
          IFCLITE_REQUIRE_SMLIB=1 IFCLITE_SMLIB_NATIVE_BUILD="$RUNNER_TEMP/smlib-native" \
            node --test scripts/smlib-open-tessellation.test.mjs | tee "$RUNNER_TEMP/open-tessellation.log"
          grep -F "sdk witness executed: open_tessellation_rebuilt_worker" "$RUNNER_TEMP/open-tessellation.log"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Actual module Workers over the staged /smlib bundle
        id: browser-workers
        continue-on-error: true
        run: |
          node scripts/smlib-browser-worker-probe.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib"
      - name: Retained finish join allocation and equality witnesses
        run: cargo test -p ifc-lite-processing --features retained-runtime --test retained_finishes_from_source -- --nocapture
      - name: Strict Clippy and unit tests with the opt-in retained-browser feature
        id: retained-clippy
        continue-on-error: true
        run: |
          cargo clippy --locked -p ifc-lite-wasm --all-targets --features retained-browser -- -D warnings
          cargo clippy --locked -p ifc-lite-wasm --all-targets --features retained-browser \
            --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked -p ifc-lite-wasm --lib --features retained-browser retained_browser
      - name: Stage /smlib beside the wasm crate for its actual-Worker tests
        run: |
          # wasm-bindgen-test serves the crate directory; the staging script
          # refuses an existing output, so this is always a fresh bundle.
          node scripts/stage-retained-browser-assets.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib" --out "$GITHUB_WORKSPACE/rust/wasm-bindings/smlib"
          # The SMLib-free runtime test uses its own transport; real-Worker
          # tests continue to use the untouched SDK assets under /smlib/.
          # m3-native is continue-on-error: a missing reference must not abort the
          # later independent lanes; m3-browser then fails with its own message.
          if [ -f "$RUNNER_TEMP/m3-native-openings.json" ]; then
            cp "$RUNNER_TEMP/m3-native-openings.json" rust/wasm-bindings/smlib/m3-native-openings.json
          fi
          if [ -f "$RUNNER_TEMP/m9-native-types.json" ]; then
            cp "$RUNNER_TEMP/m9-native-types.json" rust/wasm-bindings/smlib/m9-native-types.json
          fi
          if [ -f "$RUNNER_TEMP/m11-f-native-faces.json" ]; then
            cp "$RUNNER_TEMP/m11-f-native-faces.json" rust/wasm-bindings/smlib/m11-f-native-faces.json
          fi
          if [ -f "$RUNNER_TEMP/m11-n-native.json" ]; then
            cp "$RUNNER_TEMP/m11-n-native.json" rust/wasm-bindings/smlib/m11-n-native.json
          fi
          if [ -f "$RUNNER_TEMP/m11-i-native-instances.json" ]; then
            cp "$RUNNER_TEMP/m11-i-native-instances.json" rust/wasm-bindings/smlib/m11-i-native-instances.json
          fi
          if [ -f "$RUNNER_TEMP/m11-a-native-appearance.json" ]; then
            cp "$RUNNER_TEMP/m11-a-native-appearance.json" rust/wasm-bindings/smlib/m11-a-native-appearance.json
          fi
          if [ -f "$RUNNER_TEMP/m11-t-native-surface.json" ]; then
            cp "$RUNNER_TEMP/m11-t-native-surface.json" rust/wasm-bindings/smlib/m11-t-native-surface.json
          fi
          # Generic: every reference a native lane wrote is served beside /smlib.
          # Same rule as above: an absent file is reported by the browser test.
          set -o pipefail
          shopt -s nullglob
          for reference in "$RUNNER_TEMP"/native-references/*.json; do
            cp "$reference" "rust/wasm-bindings/smlib/$(basename "$reference")"
          done
          node scripts/stage-retained-runtime-peer.mjs
          if [ -f "$RUNNER_TEMP/m8-native.json" ]; then
            cp "$RUNNER_TEMP/m8-native.json" rust/wasm-bindings/smlib/m8-native.json
          fi
          echo "IFCLITE_REAL_CHROMEDRIVER=$(command -v chromedriver)" >> "$GITHUB_ENV"
      - name: Actual module-Worker retained browser executor (ifc-lite-wasm)
        id: browser-runtime
        continue-on-error: true
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: |
          # The default step shell has no pipefail: without it `| tee` would hide
          # any failing retained_browser test behind the witness grep below.
          set -o pipefail
          wasm-pack test --headless --chrome \
            --chromedriver "$GITHUB_WORKSPACE/scripts/wasm-test-mime-driver.mjs" rust/wasm-bindings --lib \
            --features retained-browser -- retained_browser --nocapture | tee "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: m8 real browser Worker parity" "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: retained refusal browser lifecycle" "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: retained consumed-host browser lifecycle" "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: m10_browser_parity" "$RUNNER_TEMP/retained-browser.log"
          for witness in m5_browser_parity m5_browser_lineage m5_browser_clipped_opening; do
            grep -F "sdk witness executed: $witness" "$RUNNER_TEMP/retained-browser.log"
          done
      - name: M3 native and browser opening parity
        id: m3-browser
        continue-on-error: true
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: |
          wasm-pack test --headless --chrome \
            --chromedriver "$GITHUB_WORKSPACE/scripts/wasm-test-mime-driver.mjs" rust/wasm-bindings --lib \
            --features retained-browser -- retained_browser_m3_opening_parity
      - name: Build the canonical WASM package and the opt-in retained bundle
        run: BUILD_RETAINED=1 bash scripts/build-wasm.sh
      - name: Committed declarations match both bundles
        id: generated-types
        continue-on-error: true
        run: git diff --exit-code -- packages/wasm/pkg/ifc-lite.d.ts packages/wasm/pkg-retained/ifc-lite.d.ts
      - name: Opt-in package boundary (default engine, loader, retained engine)
        id: package-boundary
        continue-on-error: true
        run: node --test packages/wasm/test/retained-browser.test.mjs
      - name: Canonical JavaScript retained API with an actual module Worker
        id: browser-api
        continue-on-error: true
        run: |
          node scripts/retained-browser-contract.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib"
      - name: Staged Node retained engine with real worker_threads
        id: cli-retained
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/stage-cli-retained-engine.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib" \
            --pkg-retained "$GITHUB_WORKSPACE/packages/wasm/pkg-retained" \
            --toolchain-notice "Emscripten-LICENSE=$GITHUB_WORKSPACE/emsdk/upstream/emscripten/LICENSE" \
            --out "$RUNNER_TEMP/cli-retained-engine"
          pnpm build --filter=@ifc-lite/cli
          IFCLITE_RETAINED_ENGINE="$RUNNER_TEMP/cli-retained-engine" \
            node --test scripts/cli-retained-engine/real-kernel.test.mjs
          IFCLITE_RETAINED_ENGINE="$RUNNER_TEMP/cli-retained-engine" \
            IFCLITE_NATIVE_PRODUCTS="$RUNNER_TEMP/native-compare/products.tsv" \
            IFCLITE_M3_REFERENCE="$RUNNER_TEMP/m3-native-openings.json" \
            IFCLITE_M11A_REFERENCE="$RUNNER_TEMP/m11-a-native-appearance.json" \
            node --test scripts/retained-compare/real-engine.test.mjs
          # Real authoring-tool exports through the built CLI: exact vs retained per product (#7955 item 4).
          IFCLITE_REQUIRE_SMLIB=1 IFCLITE_RETAINED_ENGINE="$RUNNER_TEMP/cli-retained-engine" \
            IFCLITE_NATIVE_PRODUCTS="$RUNNER_TEMP/native-compare/products.tsv" \
            node --test scripts/retained-compare/real-authoring.test.mjs 2>&1 | tee "$RUNNER_TEMP/cli-real-authoring.log"
          node scripts/check-retained-witnesses.mjs --lane cli --log "$RUNNER_TEMP/cli-real-authoring.log"
      # The report-only browser corpus job reads the staged engine from here.
      - name: Keep the staged retained engine for the browser corpus
        if: inputs.corpus == true || github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-retained-engine
          path: ${{ runner.temp }}/cli-retained-engine
          # The engine manifest lists pkg-retained/.gitignore and .npmignore, and
          # validateEngine rejects an inventory that differs from it. upload-artifact
          # drops dotfiles unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      # browser.mjs imports the CLI's compiled retained validator and report
      # (packages/cli/dist/retained/*.js). The browser corpus job has no Rust
      # or WASM toolchain to rebuild them, so hand over the dist built above.
      - name: Keep the built CLI for the browser corpus
        if: inputs.corpus == true || github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist
          path: packages/cli/dist
          if-no-files-found: error
          retention-days: 3
      - name: Browser parity and real retained viewer
        id: viewer-retained
        continue-on-error: true
        env:
          IFCLITE_RETAINED_ENGINE: ${{ runner.temp }}/cli-retained-engine
          IFCLITE_NATIVE_PRODUCTS: ${{ runner.temp }}/native-compare/products.tsv
          IFCLITE_BROWSER_OUT: ${{ runner.temp }}/viewer-retained
          IFCLITE_VIEWER_OUT: ${{ runner.temp }}/viewer-retained/e2e
          VITE_RETAINED_GEOMETRY: 'on'
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          # A skip is not parity evidence: missing upstream products fail this lane.
          test -s "$IFCLITE_RETAINED_ENGINE/engine-manifest.json"
          test -s "$IFCLITE_NATIVE_PRODUCTS"
          node --test scripts/retained-compare/browser.test.mjs
          # Turbo cache restoration does not remove outputs from another build mode.
          rm -rf apps/viewer/dist
          pnpm build:e2e --concurrency=1
          IFCLITE_REQUIRE_SMLIB=1 pnpm exec playwright test --project=viewer-retained --reporter=list 2>&1 | tee "$RUNNER_TEMP/retained-viewer-witnesses.log"
          node scripts/check-retained-witnesses.mjs --lane viewer --log "$RUNNER_TEMP/retained-viewer-witnesses.log"
          rm -rf apps/viewer/dist
          VITE_RETAINED_GEOMETRY= IFCLITE_RETAINED_ENGINE= pnpm build:e2e --concurrency=1
          node scripts/check-viewer-retained-free.mjs
          VITE_RETAINED_GEOMETRY= IFCLITE_RETAINED_ENGINE= pnpm exec playwright test --project=viewer-retained-default
      - name: Upload retained viewer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retained-viewer-comparison
          path: |
            ${{ runner.temp }}/cli-real-authoring.log
            ${{ runner.temp }}/retained-viewer-witnesses.log
            ${{ runner.temp }}/retained-native-link-inventory.json
            ${{ runner.temp }}/viewer-retained/
            test-results/
          if-no-files-found: error
      # Shadow phase of the split lane (na-* jobs below): hand this job's references,
      # logs and step outcomes to na-split-compare. Verdict-neutral: continue-on-error,
      # and only when the split runs beside this job.
      - name: Collect evidence for the split comparison (shadow)
        if: always() && inputs.batch != true && !inputs.bisect_sha && vars.NATIVE_ADAPTER_SPLIT == 'shadow'
        continue-on-error: true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs collect --job native-adapter --out "$RUNNER_TEMP/na-evidence"
      - name: Upload evidence for the split comparison (shadow)
        if: always() && inputs.batch != true && !inputs.bisect_sha && vars.NATIVE_ADAPTER_SPLIT == 'shadow'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-mono-evidence
          path: ${{ runner.temp }}/na-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      # Gather independent failures, then preserve a failing overall verdict.
      - name: Require every independent result
        if: always()
        env:
          M3_NATIVE: ${{ steps.m3-native.outcome }}
          M3_BROWSER: ${{ steps.m3-browser.outcome }}
          HALFSPACE_GENERATED: ${{ steps.halfspace-generated.outcome }}
          HALFSPACE_FETCH: ${{ steps.halfspace-fetch.outcome }}
          NATIVE_COMPARE: ${{ steps.native-compare.outcome }}
          NATIVE_CTEST: ${{ steps.native-ctest.outcome }}
          NATIVE_CONSUMERS: ${{ steps.native-consumers.outcome }}
          WASM_CTEST: ${{ steps.wasm-ctest.outcome }}
          BROWSER_WORKERS: ${{ steps.browser-workers.outcome }}
          BROWSER_RUNTIME: ${{ steps.browser-runtime.outcome }}
          BROWSER_API: ${{ steps.browser-api.outcome }}
          GENERATED_TYPES: ${{ steps.generated-types.outcome }}
          PACKAGE_BOUNDARY: ${{ steps.package-boundary.outcome }}
          RETAINED_CLIPPY: ${{ steps.retained-clippy.outcome }}
          CLI_RETAINED: ${{ steps.cli-retained.outcome }}
          VIEWER_RETAINED: ${{ steps.viewer-retained.outcome }}
          OPEN_TESSELLATION: ${{ steps.open-tessellation.outcome }}
        run: |
          failed=0
          for lane in HALFSPACE_GENERATED HALFSPACE_FETCH M3_NATIVE M3_BROWSER NATIVE_COMPARE NATIVE_CTEST NATIVE_CONSUMERS WASM_CTEST BROWSER_WORKERS BROWSER_RUNTIME BROWSER_API GENERATED_TYPES PACKAGE_BOUNDARY RETAINED_CLIPPY CLI_RETAINED VIEWER_RETAINED OPEN_TESSELLATION; do
            printf '%s=%s\n' "$lane" "${!lane}"
            if [[ "${!lane}" != success ]]; then failed=1; fi
          done
          exit "$failed"

  # SPLIT LANE, SHADOW PHASE (scripts/lib/native-adapter-split.mjs holds the shape and
  # check-native-adapter-triggers.mjs audits it). The job above stays the verdict. These
  # run the same steps in six parallel jobs (critical path about 30-41 min against 53-76),
  # na-split-judge requires every one of them, and na-split-compare reports both layouts
  # per lane. Only with the repo variable NATIVE_ADAPTER_SPLIT=shadow, and never on a
  # merge-queue batch or a bisect probe. Every job is job-level continue-on-error until
  # the flip, so it cannot colour a run; the judge reads each job's own `verdict` output,
  # because a continue-on-error job's result says nothing. Artifacts are na-* (test.yml
  # shares the run's artifact namespace when it calls this workflow).
  na-native:
    if: >-
      (!inputs.bisect_sha || inputs.bisect_adapter) && (
      inputs.batch == true ||
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:native-adapter') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:native-adapter'))) &&
      inputs.batch != true && !inputs.bisect_sha && vars.NATIVE_ADAPTER_SPLIT == 'shadow'
    concurrency:
      group: geometry-platform-na-native-${{ !inputs.batch && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.batch }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      head: ${{ steps.verdict.outputs.head }}
      steps: ${{ toJSON(steps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.bisect_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Guard the lane's own triggers
        run: node scripts/check-native-adapter-triggers.mjs
      - name: Checkout pinned upstream SDK (fetched, never vendored)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: NVIDIA-Omniverse/usd-brep
          ref: c9c5979f04cea8c38213004d4f04df0dcfb40d05
          path: upstream-smlib
          persist-credentials: false
      - name: Ensure CMake and Ninja are available
        shell: bash
        run: |
          missing=()
          command -v cmake || missing+=(cmake)
          command -v ninja || missing+=(ninja-build)
          if (( ${#missing[@]} )); then
            for attempt in 1 2 3; do
              sudo apt-get install -y --no-install-recommends "${missing[@]}" && break
              if (( attempt < 3 )); then
                sleep $((attempt * 15))
                sudo apt-get update || true
              fi
            done
          fi
          cmake --version
          ninja --version
      - name: Build native owned boundary and worker
        run: |
          cmake -S native/smlib-adapter -B "$RUNNER_TEMP/smlib-native" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSMLIB_SOURCE="$GITHUB_WORKSPACE/upstream-smlib"
          cmake --build "$RUNNER_TEMP/smlib-native" --parallel 4
      - name: Collect native runtime licence review inputs and verify installation
        run: |
          node scripts/retained-native-link-inventory.mjs "$RUNNER_TEMP/smlib-native/ifclite_smlib_worker" \
            "$RUNNER_TEMP/smlib-native" "$RUNNER_TEMP/retained-native-link-inventory.json"
          cmake --install "$RUNNER_TEMP/smlib-native" --prefix "$RUNNER_TEMP/retained-native-install"
          cmp "$RUNNER_TEMP/retained-native-install/share/licenses/ifclite-smlib/THIRD_PARTY_NOTICES.txt" \
            licenses/retained/THIRD_PARTY_NOTICES.txt
      - name: Execute every native owned boundary
        id: native-ctest
        continue-on-error: true
        run: ctest --test-dir "$RUNNER_TEMP/smlib-native" --output-on-failure
      # Restore-only, from the single job's own key: the shadow phase writes no Rust
      # cache (the Actions cache is at its limit), and both layouts start alike.
      # The split's own cache arrangement is decided at the flip.
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: geometry-platform
          save-if: 'false'
      - name: Real Rust subprocess integration
        id: native-consumers
        continue-on-error: true
        env:
          IFCLITE_SMLIB_PATH: ${{ runner.temp }}/smlib-native/ifclite_smlib_worker
        run: |
          test -x "$IFCLITE_SMLIB_PATH"
          IFCLITE_SMLIB_WORKER="$IFCLITE_SMLIB_PATH" \
            cargo test --locked -p ifc-lite-geometry-runtime --all-targets --no-fail-fast
      - name: Check generated halfspace boundary fixtures
        id: halfspace-generated
        continue-on-error: true
        run: python3 tests/fixtures/synthetic-retained/generate-halfspace-boundaries.py --check
      - name: Restore fixtures from the main-branch cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/models
          key: ci-fixtures-source-v2-${{ runner.os }}-${{ hashFiles('tests/models/manifest.json', 'tests/models/README.md', 'tests/models/.manifest-ignore') }}
      - name: Fetch required native halfspace witnesses
        id: halfspace-fetch
        continue-on-error: true
        run: |
          node scripts/fixtures/fetch-fixtures.mjs \
            ara3d/AC20-FZK-Haus.ifc issues/960_house_segmented_roof_clip.ifc
      - name: Retained native comparison and real executor tests
        id: native-compare
        continue-on-error: true
        env:
          IFC_LITE_REQUIRE_FIXTURES: "1"
        run: |
          set -o pipefail
          export IFCLITE_REQUIRE_SMLIB=1
          export IFCLITE_M9_REFERENCE="$RUNNER_TEMP/m9-native-types.json"
          export IFCLITE_M8_NATIVE_REFERENCE="$RUNNER_TEMP/m8-native.json"
          export IFCLITE_M11F_REFERENCE="$RUNNER_TEMP/m11-f-native-faces.json"
          export IFCLITE_M11_N_REFERENCE="$RUNNER_TEMP/m11-n-native.json"
          export IFCLITE_M11A_REFERENCE="$RUNNER_TEMP/m11-a-native-appearance.json"
          export IFCLITE_M11T_REFERENCE="$RUNNER_TEMP/m11-t-native-surface.json"
          export IFCLITE_M11_I_REFERENCE="$RUNNER_TEMP/m11-i-native-instances.json"
          export IFCLITE_SMLIB_WORKER="$RUNNER_TEMP/smlib-native/ifclite_smlib_worker"
          mkdir -p "$RUNNER_TEMP/native-references"
          export IFCLITE_M5_REFERENCE="$RUNNER_TEMP/native-references/m5-native-clips.json"
          export IFCLITE_M5_LINEAGE_REFERENCE="$RUNNER_TEMP/native-references/m5-native-lineage.json"
          export IFCLITE_M6_REFERENCE="$RUNNER_TEMP/native-references/m6-native.json"
          # Only here: the M1 browser parity in na-browser requires it (the single job never fed it).
          export IFCLITE_M1_REFERENCE="$RUNNER_TEMP/native-references/m1-native-unit-rectangle.json"
          cargo test --locked -p ifc-lite-retained-native --features retained-runtime --all-targets -- --nocapture 2>&1 | tee "$RUNNER_TEMP/native-witnesses.log"
          node scripts/check-retained-witnesses.mjs --lane native --log "$RUNNER_TEMP/native-witnesses.log"
          cargo run --release --locked -p ifc-lite-retained-native --features retained-runtime --example retained_compare -- \
            --worker "$IFCLITE_SMLIB_WORKER" --out "$RUNNER_TEMP/native-compare" --committed --gate
      - name: M3 native opening witnesses
        id: m3-native
        continue-on-error: true
        run: |
          export IFCLITE_REQUIRE_SMLIB=1
          export IFCLITE_SMLIB_WORKER="$RUNNER_TEMP/smlib-native/ifclite_smlib_worker"
          export IFCLITE_M3_REFERENCE="$RUNNER_TEMP/m3-native-openings.json"
          cargo test --locked -p ifc-lite-retained-native --features retained-runtime --test m3_native -- --nocapture | tee "$RUNNER_TEMP/m3-native.log"
          for witness in m3_prism_curved m3_synthetic_empty m3_scaled_cutter m3_nonbakeable_cutter m3_unsupported m3_kernel_failure m3_frames m3_lineage m3_reference m3_two_parts_two_openings m3_empty_opening_body; do
            grep -E "sdk witness executed: ${witness}\$" "$RUNNER_TEMP/m3-native.log"
          done
      # Here, not with the browser lanes: it rebuilds the worker in this job's native build dir.
      - name: Rebuilt-worker open tessellation refusal (#7955)
        id: open-tessellation
        continue-on-error: true
        run: |
          set -o pipefail
          IFCLITE_REQUIRE_SMLIB=1 IFCLITE_SMLIB_NATIVE_BUILD="$RUNNER_TEMP/smlib-native" \
            node --test scripts/smlib-open-tessellation.test.mjs | tee "$RUNNER_TEMP/open-tessellation.log"
          grep -F "sdk witness executed: open_tessellation_rebuilt_worker" "$RUNNER_TEMP/open-tessellation.log"
      # Judged on its own: the single job runs it as a hard step outside its lane list,
      # so a failure there aborts every later lane.
      - name: Retained finish join allocation and equality witnesses
        id: finish-join
        continue-on-error: true
        run: cargo test -p ifc-lite-processing --features retained-runtime --test retained_finishes_from_source -- --nocapture
      - name: Pack the native references for the browser and CLI lanes
        if: always()
        run: node scripts/native-adapter-split.mjs pack --out "$RUNNER_TEMP/na-native-refs"
      - name: Hand the native references over
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-native-refs
          path: ${{ runner.temp }}/na-native-refs
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Upload native comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-retained-native-comparison
          path: |
            ${{ runner.temp }}/native-compare/*.json
            ${{ runner.temp }}/native-compare/*.tsv
          if-no-files-found: error
          overwrite: true
      - name: Keep the link inventory for the retained viewer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-viewer-part-na-native
          path: ${{ runner.temp }}/retained-native-link-inventory.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Collect evidence for the comparison
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs collect --job na-native --out "$RUNNER_TEMP/na-evidence"
      - name: Upload evidence for the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-evidence-na-native
          path: ${{ runner.temp }}/na-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: This job's verdict
        id: verdict
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs verdict --job na-native

  na-emscripten:
    if: >-
      (!inputs.bisect_sha || inputs.bisect_adapter) && (
      inputs.batch == true ||
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:native-adapter') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:native-adapter'))) &&
      inputs.batch != true && !inputs.bisect_sha && vars.NATIVE_ADAPTER_SPLIT == 'shadow'
    concurrency:
      group: geometry-platform-na-emscripten-${{ !inputs.batch && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.batch }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      head: ${{ steps.verdict.outputs.head }}
      steps: ${{ toJSON(steps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.bisect_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checkout pinned upstream SDK (fetched, never vendored)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: NVIDIA-Omniverse/usd-brep
          ref: c9c5979f04cea8c38213004d4f04df0dcfb40d05
          path: upstream-smlib
          persist-credentials: false
      - name: Ensure CMake and Ninja are available
        shell: bash
        run: |
          missing=()
          command -v cmake || missing+=(cmake)
          command -v ninja || missing+=(ninja-build)
          if (( ${#missing[@]} )); then
            for attempt in 1 2 3; do
              sudo apt-get install -y --no-install-recommends "${missing[@]}" && break
              if (( attempt < 3 )); then
                sleep $((attempt * 15))
                sudo apt-get update || true
              fi
            done
          fi
          cmake --version
          ninja --version
      - name: Checkout pinned Emscripten SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: emscripten-core/emsdk
          ref: 3b3963d86a5c97adaf6eaa845cdfe0b811c2f960
          path: emsdk
          persist-credentials: false
      - name: Build the browser module-Worker boundary (Emscripten 4.0.15)
        run: |
          emsdk/emsdk install 4.0.15
          emsdk/emsdk activate 4.0.15
          source emsdk/emsdk_env.sh
          emcmake cmake -S native/smlib-adapter -B "$RUNNER_TEMP/smlib-wasm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSMLIB_SOURCE="$GITHUB_WORKSPACE/upstream-smlib"
          cmake --build "$RUNNER_TEMP/smlib-wasm" --parallel 4
      - name: Execute every owned boundary under Node, plus the browser binary
        id: wasm-ctest
        continue-on-error: true
        run: ctest --test-dir "$RUNNER_TEMP/smlib-wasm" --output-on-failure
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          version=$(pnpm exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: native-adapter-chromium-ubuntu24.04-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Ensure Playwright Chromium system dependencies are available
        run: |
          # The dry run simulates apt and reports the missing packages for this image.
          pnpm exec playwright install-deps --dry-run chromium ||
            pnpm exec playwright install-deps chromium
      - name: Actual module Workers over the staged /smlib bundle
        id: browser-workers
        continue-on-error: true
        run: |
          node scripts/smlib-browser-worker-probe.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib"
      # Exactly what the staging scripts read. Consumers restore it at this same
      # absolute path: stage-retained-browser-assets.mjs checks CMakeCache.txt's
      # adapter and SDK paths, and the SDK checkout's revision and cleanliness.
      - name: Hand the Emscripten build over
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-smlib-wasm
          path: |
            ${{ runner.temp }}/smlib-wasm/CMakeCache.txt
            ${{ runner.temp }}/smlib-wasm/client.mjs
            ${{ runner.temp }}/smlib-wasm/worker.mjs
            ${{ runner.temp }}/smlib-wasm/module.mjs
            ${{ runner.temp }}/smlib-wasm/contract.mjs
            ${{ runner.temp }}/smlib-wasm/sweep.mjs
            ${{ runner.temp }}/smlib-wasm/sweep-contract.mjs
            ${{ runner.temp }}/smlib-wasm/ifclite_smlib_browser.mjs
            ${{ runner.temp }}/smlib-wasm/ifclite_smlib_browser.wasm
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      # The staged CLI engine carries it as a toolchain notice; it exists only after emsdk install.
      - name: Hand the Emscripten licence over
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-emscripten-license
          path: emsdk/upstream/emscripten/LICENSE
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Collect evidence for the comparison
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs collect --job na-emscripten --out "$RUNNER_TEMP/na-evidence"
      - name: Upload evidence for the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-evidence-na-emscripten
          path: ${{ runner.temp }}/na-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: This job's verdict
        id: verdict
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs verdict --job na-emscripten

  na-wasm:
    if: >-
      (!inputs.bisect_sha || inputs.bisect_adapter) && (
      inputs.batch == true ||
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:native-adapter') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:native-adapter'))) &&
      inputs.batch != true && !inputs.bisect_sha && vars.NATIVE_ADAPTER_SPLIT == 'shadow'
    concurrency:
      group: geometry-platform-na-wasm-${{ !inputs.batch && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.batch }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      head: ${{ steps.verdict.outputs.head }}
      steps: ${{ toJSON(steps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.bisect_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Restore-only, from the single job's own key: the shadow phase writes no Rust
      # cache (the Actions cache is at its limit), and both layouts start alike.
      # The split's own cache arrangement is decided at the flip.
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: geometry-platform
          save-if: 'false'
      - name: Strict Clippy and unit tests with the opt-in retained-browser feature
        id: retained-clippy
        continue-on-error: true
        run: |
          cargo clippy --locked -p ifc-lite-wasm --all-targets --features retained-browser -- -D warnings
          cargo clippy --locked -p ifc-lite-wasm --all-targets --features retained-browser \
            --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked -p ifc-lite-wasm --lib --features retained-browser retained_browser
      - name: Build the canonical WASM package and the opt-in retained bundle
        run: BUILD_RETAINED=1 bash scripts/build-wasm.sh
      - name: Committed declarations match both bundles
        id: generated-types
        continue-on-error: true
        run: git diff --exit-code -- packages/wasm/pkg/ifc-lite.d.ts packages/wasm/pkg-retained/ifc-lite.d.ts
      - name: Opt-in package boundary (default engine, loader, retained engine)
        id: package-boundary
        continue-on-error: true
        run: node --test packages/wasm/test/retained-browser.test.mjs
      # Every bundle build-wasm.sh wrote (pkg, pkg-retained, pkg-diff, pkg-rhino, ...):
      # the viewer build imports pkg-diff too. pkg-retained/.gitignore and .npmignore
      # are listed in the staged engine's manifest.
      - name: Hand every WASM package over
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-wasm-pkg
          path: packages/wasm/pkg*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Collect evidence for the comparison
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs collect --job na-wasm --out "$RUNNER_TEMP/na-evidence"
      - name: Upload evidence for the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-evidence-na-wasm
          path: ${{ runner.temp }}/na-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: This job's verdict
        id: verdict
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs verdict --job na-wasm

  na-viewer:
    needs: [na-emscripten, na-wasm]
    if: >-
      !cancelled() && (!inputs.bisect_sha || inputs.bisect_adapter) && (
      inputs.batch == true ||
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:native-adapter') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:native-adapter'))) &&
      inputs.batch != true && !inputs.bisect_sha && vars.NATIVE_ADAPTER_SPLIT == 'shadow'
    concurrency:
      group: geometry-platform-na-viewer-${{ !inputs.batch && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.batch }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      head: ${{ steps.verdict.outputs.head }}
      steps: ${{ toJSON(steps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.bisect_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checkout pinned upstream SDK (fetched, never vendored)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: NVIDIA-Omniverse/usd-brep
          ref: c9c5979f04cea8c38213004d4f04df0dcfb40d05
          path: upstream-smlib
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: na-split-smlib-wasm
          path: ${{ runner.temp }}/smlib-wasm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: na-split-emscripten-license
          path: emsdk/upstream/emscripten
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: na-split-wasm-pkg
          path: packages/wasm
      # The CLI and viewer builds reach build-wasm.sh through turbo. Without wasm-pack it
      # keeps the runtime on disk (na-wasm's). With one, it would rebuild through a Rust
      # toolchain this job does not install, so refuse that instead of guessing.
      - name: Use na-wasm's packages, never a rebuild
        run: |
          if command -v wasm-pack >/dev/null || [ -x "$HOME/.cargo/bin/wasm-pack" ]; then
            echo "::error::wasm-pack is on this runner: build-wasm.sh would rebuild instead of using na-wasm's packages"
            exit 1
          fi
          for f in packages/wasm/pkg/ifc-lite_bg.wasm packages/wasm/pkg/ifc-lite.js packages/wasm/pkg-retained/ifc-lite_bg.wasm packages/wasm/pkg-retained/ifc-lite.js \
            packages/wasm/pkg-diff/ifc-lite-diff.js packages/wasm/pkg-rhino/ifc-lite-rhino.js; do
            test -s "$f"
          done
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          version=$(pnpm exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: native-adapter-chromium-ubuntu24.04-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Ensure Playwright Chromium system dependencies are available
        run: |
          # The dry run simulates apt and reports the missing packages for this image.
          pnpm exec playwright install-deps --dry-run chromium ||
            pnpm exec playwright install-deps chromium
      - name: Staged Node retained engine with real worker_threads
        id: cli-retained
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/stage-cli-retained-engine.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib" \
            --pkg-retained "$GITHUB_WORKSPACE/packages/wasm/pkg-retained" \
            --toolchain-notice "Emscripten-LICENSE=$GITHUB_WORKSPACE/emsdk/upstream/emscripten/LICENSE" \
            --out "$RUNNER_TEMP/cli-retained-engine"
          pnpm build --filter=@ifc-lite/cli
          # na-cli-parity runs the parity tests on these exact builds.
          tar -cf "$RUNNER_TEMP/na-dists.tar" packages/*/dist
          IFCLITE_RETAINED_ENGINE="$RUNNER_TEMP/cli-retained-engine" \
            node --test scripts/cli-retained-engine/real-kernel.test.mjs
      - name: Hand the staged retained engine over
        if: steps.cli-retained.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-cli-retained-engine
          path: ${{ runner.temp }}/cli-retained-engine
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Hand the built packages over
        if: steps.cli-retained.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-dists
          path: ${{ runner.temp }}/na-dists.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      # The single job's viewer-retained step less browser.test.mjs, which needs the
      # native products and runs in na-cli-parity.
      - name: Real retained viewer
        id: viewer-retained
        continue-on-error: true
        env:
          IFCLITE_RETAINED_ENGINE: ${{ runner.temp }}/cli-retained-engine
          IFCLITE_VIEWER_OUT: ${{ runner.temp }}/viewer-retained/e2e
          VITE_RETAINED_GEOMETRY: 'on'
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          test -s "$IFCLITE_RETAINED_ENGINE/engine-manifest.json"
          rm -rf apps/viewer/dist
          pnpm build:e2e --concurrency=1
          IFCLITE_REQUIRE_SMLIB=1 pnpm exec playwright test --project=viewer-retained --reporter=list 2>&1 | tee "$RUNNER_TEMP/retained-viewer-witnesses.log"
          node scripts/check-retained-witnesses.mjs --lane viewer --log "$RUNNER_TEMP/retained-viewer-witnesses.log"
          rm -rf apps/viewer/dist
          VITE_RETAINED_GEOMETRY= IFCLITE_RETAINED_ENGINE= pnpm build:e2e --concurrency=1
          node scripts/check-viewer-retained-free.mjs
          VITE_RETAINED_GEOMETRY= IFCLITE_RETAINED_ENGINE= pnpm exec playwright test --project=viewer-retained-default
      - name: Keep this job's retained viewer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-viewer-part-na-viewer
          path: |
            ${{ runner.temp }}/retained-viewer-witnesses.log
            ${{ runner.temp }}/viewer-retained/
            test-results/
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Collect evidence for the comparison
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs collect --job na-viewer --out "$RUNNER_TEMP/na-evidence"
      - name: Upload evidence for the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-evidence-na-viewer
          path: ${{ runner.temp }}/na-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: This job's verdict
        id: verdict
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs verdict --job na-viewer

  na-browser:
    needs: [na-native, na-emscripten]
    if: >-
      !cancelled() && (!inputs.bisect_sha || inputs.bisect_adapter) && (
      inputs.batch == true ||
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:native-adapter') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:native-adapter'))) &&
      inputs.batch != true && !inputs.bisect_sha && vars.NATIVE_ADAPTER_SPLIT == 'shadow'
    concurrency:
      group: geometry-platform-na-browser-${{ !inputs.batch && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.batch }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Job-wide, so both wasm-pack test steps compile the same test binary: the M1
    # browser parity fails instead of skipping when its native reference is absent.
    env:
      IFCLITE_REQUIRE_M1_REFERENCE: '1'
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      head: ${{ steps.verdict.outputs.head }}
      steps: ${{ toJSON(steps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.bisect_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Checkout pinned upstream SDK (fetched, never vendored)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: NVIDIA-Omniverse/usd-brep
          ref: c9c5979f04cea8c38213004d4f04df0dcfb40d05
          path: upstream-smlib
          persist-credentials: false
      # Restore-only, from the single job's own key: the shadow phase writes no Rust
      # cache (the Actions cache is at its limit), and both layouts start alike.
      # The split's own cache arrangement is decided at the flip.
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: geometry-platform
          save-if: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: na-split-smlib-wasm
          path: ${{ runner.temp }}/smlib-wasm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: na-split-native-refs
          path: ${{ runner.temp }}/na-native-refs
      # Back where the native tests wrote them: $RUNNER_TEMP, and m7/m10 in the wasm crate.
      - name: Restore the native references
        run: node scripts/native-adapter-split.mjs unpack --from "$RUNNER_TEMP/na-native-refs"
      - name: Stage /smlib beside the wasm crate for its actual-Worker tests
        run: |
          node scripts/stage-retained-browser-assets.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib" --out "$GITHUB_WORKSPACE/rust/wasm-bindings/smlib"
          if [ -f "$RUNNER_TEMP/m3-native-openings.json" ]; then
            cp "$RUNNER_TEMP/m3-native-openings.json" rust/wasm-bindings/smlib/m3-native-openings.json
          fi
          if [ -f "$RUNNER_TEMP/m9-native-types.json" ]; then
            cp "$RUNNER_TEMP/m9-native-types.json" rust/wasm-bindings/smlib/m9-native-types.json
          fi
          if [ -f "$RUNNER_TEMP/m11-f-native-faces.json" ]; then
            cp "$RUNNER_TEMP/m11-f-native-faces.json" rust/wasm-bindings/smlib/m11-f-native-faces.json
          fi
          if [ -f "$RUNNER_TEMP/m11-n-native.json" ]; then
            cp "$RUNNER_TEMP/m11-n-native.json" rust/wasm-bindings/smlib/m11-n-native.json
          fi
          if [ -f "$RUNNER_TEMP/m11-i-native-instances.json" ]; then
            cp "$RUNNER_TEMP/m11-i-native-instances.json" rust/wasm-bindings/smlib/m11-i-native-instances.json
          fi
          if [ -f "$RUNNER_TEMP/m11-a-native-appearance.json" ]; then
            cp "$RUNNER_TEMP/m11-a-native-appearance.json" rust/wasm-bindings/smlib/m11-a-native-appearance.json
          fi
          if [ -f "$RUNNER_TEMP/m11-t-native-surface.json" ]; then
            cp "$RUNNER_TEMP/m11-t-native-surface.json" rust/wasm-bindings/smlib/m11-t-native-surface.json
          fi
          set -o pipefail
          shopt -s nullglob
          for reference in "$RUNNER_TEMP"/native-references/*.json; do
            cp "$reference" "rust/wasm-bindings/smlib/$(basename "$reference")"
          done
          node scripts/stage-retained-runtime-peer.mjs
          if [ -f "$RUNNER_TEMP/m8-native.json" ]; then
            cp "$RUNNER_TEMP/m8-native.json" rust/wasm-bindings/smlib/m8-native.json
          fi
          echo "IFCLITE_REAL_CHROMEDRIVER=$(command -v chromedriver)" >> "$GITHUB_ENV"
      - name: Actual module-Worker retained browser executor (ifc-lite-wasm)
        id: browser-runtime
        continue-on-error: true
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: |
          set -o pipefail
          wasm-pack test --headless --chrome \
            --chromedriver "$GITHUB_WORKSPACE/scripts/wasm-test-mime-driver.mjs" rust/wasm-bindings --lib \
            --features retained-browser -- retained_browser --nocapture | tee "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: m8 real browser Worker parity" "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: retained refusal browser lifecycle" "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: retained consumed-host browser lifecycle" "$RUNNER_TEMP/retained-browser.log"
          grep -F "sdk witness executed: m10_browser_parity" "$RUNNER_TEMP/retained-browser.log"
          for witness in m5_browser_parity m5_browser_lineage m5_browser_clipped_opening m1_browser_parity; do
            grep -F "sdk witness executed: $witness" "$RUNNER_TEMP/retained-browser.log"
          done
      - name: M3 native and browser opening parity
        id: m3-browser
        continue-on-error: true
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: |
          wasm-pack test --headless --chrome \
            --chromedriver "$GITHUB_WORKSPACE/scripts/wasm-test-mime-driver.mjs" rust/wasm-bindings --lib \
            --features retained-browser -- retained_browser_m3_opening_parity
      - name: Collect evidence for the comparison
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs collect --job na-browser --out "$RUNNER_TEMP/na-evidence"
      - name: Upload evidence for the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-evidence-na-browser
          path: ${{ runner.temp }}/na-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: This job's verdict
        id: verdict
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs verdict --job na-browser

  na-cli-parity:
    needs: [na-native, na-emscripten, na-wasm, na-viewer]
    if: >-
      !cancelled() && (!inputs.bisect_sha || inputs.bisect_adapter) && (
      inputs.batch == true ||
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:native-adapter') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:native-adapter'))) &&
      inputs.batch != true && !inputs.bisect_sha && vars.NATIVE_ADAPTER_SPLIT == 'shadow'
    concurrency:
      group: geometry-platform-na-cli-parity-${{ !inputs.batch && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.batch }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      head: ${{ steps.verdict.outputs.head }}
      steps: ${{ toJSON(steps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.bisect_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checkout pinned upstream SDK (fetched, never vendored)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: NVIDIA-Omniverse/usd-brep
          ref: c9c5979f04cea8c38213004d4f04df0dcfb40d05
          path: upstream-smlib
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: na-split-smlib-wasm
          path: ${{ runner.temp }}/smlib-wasm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: na-split-wasm-pkg
          path: packages/wasm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: na-split-native-refs
          path: ${{ runner.temp }}/na-native-refs
      - name: Restore the native references
        run: node scripts/native-adapter-split.mjs unpack --from "$RUNNER_TEMP/na-native-refs"
      # Absent when na-viewer's cli-retained failed: the lanes below then fail with their own messages.
      - name: Fetch na-viewer's staged engine
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: na-split-cli-retained-engine
          path: ${{ runner.temp }}/cli-retained-engine
      - name: Fetch na-viewer's built packages
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: na-split-dists
          path: ${{ runner.temp }}
      - name: Unpack na-viewer's built packages
        run: if [ -f "$RUNNER_TEMP/na-dists.tar" ]; then tar -xf "$RUNNER_TEMP/na-dists.tar"; fi
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          version=$(pnpm exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: native-adapter-chromium-ubuntu24.04-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Ensure Playwright Chromium system dependencies are available
        run: |
          # The dry run simulates apt and reports the missing packages for this image.
          pnpm exec playwright install-deps --dry-run chromium ||
            pnpm exec playwright install-deps chromium
      # retained-browser-contract.mjs reads the native M11-I reference from the staged
      # /smlib directory, which the single job's "Stage /smlib" step filled earlier.
      - name: Canonical JavaScript retained API with an actual module Worker
        id: browser-api
        continue-on-error: true
        run: |
          mkdir -p rust/wasm-bindings/smlib
          if [ -f "$RUNNER_TEMP/m11-i-native-instances.json" ]; then
            cp "$RUNNER_TEMP/m11-i-native-instances.json" rust/wasm-bindings/smlib/m11-i-native-instances.json
          fi
          node scripts/retained-browser-contract.mjs --build "$RUNNER_TEMP/smlib-wasm" \
            --sdk "$GITHUB_WORKSPACE/upstream-smlib"
      # The single job's cli-retained step after the engine and the CLI are built.
      - name: Retained engine and authoring parity against the native products
        id: cli-parity
        continue-on-error: true
        run: |
          set -o pipefail
          IFCLITE_RETAINED_ENGINE="$RUNNER_TEMP/cli-retained-engine" \
            IFCLITE_NATIVE_PRODUCTS="$RUNNER_TEMP/native-compare/products.tsv" \
            IFCLITE_M3_REFERENCE="$RUNNER_TEMP/m3-native-openings.json" \
            IFCLITE_M11A_REFERENCE="$RUNNER_TEMP/m11-a-native-appearance.json" \
            node --test scripts/retained-compare/real-engine.test.mjs
          IFCLITE_REQUIRE_SMLIB=1 IFCLITE_RETAINED_ENGINE="$RUNNER_TEMP/cli-retained-engine" \
            IFCLITE_NATIVE_PRODUCTS="$RUNNER_TEMP/native-compare/products.tsv" \
            node --test scripts/retained-compare/real-authoring.test.mjs 2>&1 | tee "$RUNNER_TEMP/cli-real-authoring.log"
          node scripts/check-retained-witnesses.mjs --lane cli --log "$RUNNER_TEMP/cli-real-authoring.log"
      # The single job's viewer-retained step's first test.
      - name: Browser parity against the native products
        id: browser-parity
        continue-on-error: true
        env:
          IFCLITE_RETAINED_ENGINE: ${{ runner.temp }}/cli-retained-engine
          IFCLITE_NATIVE_PRODUCTS: ${{ runner.temp }}/native-compare/products.tsv
          IFCLITE_BROWSER_OUT: ${{ runner.temp }}/viewer-retained
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          test -s "$IFCLITE_RETAINED_ENGINE/engine-manifest.json"
          test -s "$IFCLITE_NATIVE_PRODUCTS"
          node --test scripts/retained-compare/browser.test.mjs
      - name: Keep this job's retained viewer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-viewer-part-na-cli-parity
          path: |
            ${{ runner.temp }}/cli-real-authoring.log
            ${{ runner.temp }}/viewer-retained/
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Collect evidence for the comparison
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs collect --job na-cli-parity --out "$RUNNER_TEMP/na-evidence"
      - name: Upload evidence for the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-evidence-na-cli-parity
          path: ${{ runner.temp }}/na-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: This job's verdict
        id: verdict
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/native-adapter-split.mjs verdict --job na-cli-parity

  # The strict judge. At the flip it becomes `native-adapter` (no name:), which the
  # nightly coverage record and the bisect read by id.
  na-split-judge:
    needs: [na-native, na-emscripten, na-wasm, na-viewer, na-browser, na-cli-parity]
    if: >-
      !cancelled() && (!inputs.bisect_sha || inputs.bisect_adapter) && (
      inputs.batch == true ||
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:native-adapter') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:native-adapter'))) &&
      inputs.batch != true && !inputs.bisect_sha && vars.NATIVE_ADAPTER_SPLIT == 'shadow'
    concurrency:
      group: geometry-platform-na-split-judge-${{ !inputs.batch && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.batch }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.bisect_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The single job's evidence artifact, rebuilt from the three jobs that now write it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        continue-on-error: true
        with:
          pattern: na-split-viewer-part-*
          path: retained-viewer-comparison
          merge-multiple: true
      - name: Upload retained viewer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-retained-viewer-comparison
          path: retained-viewer-comparison
          if-no-files-found: error
          overwrite: true
      # Every lane job must have succeeded: skipped, cancelled, a missing verdict or
      # two different commits all fail. Prints the lane table in the single job's form.
      - name: Require every lane job and every independent result
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/native-adapter-split.mjs judge

  # Report only (job-level continue-on-error): both layouts on this commit, per lane.
  na-split-compare:
    needs: [native-adapter, na-native, na-emscripten, na-wasm, na-viewer, na-browser, na-cli-parity, na-split-judge]
    if: >-
      !cancelled() && (!inputs.bisect_sha || inputs.bisect_adapter) && (
      inputs.batch == true ||
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:native-adapter') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:native-adapter'))) &&
      inputs.batch != true && !inputs.bisect_sha && vars.NATIVE_ADAPTER_SPLIT == 'shadow'
    concurrency:
      group: geometry-platform-na-split-compare-${{ !inputs.batch && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.batch }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Reads this run's jobs listing for the timings.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.bisect_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: na-mono-evidence
          path: ${{ runner.temp }}/mono
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: na-split-evidence-*
          path: ${{ runner.temp }}/split
      - name: Compare the single job with the split
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-adapter-split.mjs compare --mono "$RUNNER_TEMP/mono" --split "$RUNNER_TEMP/split" --report "$RUNNER_TEMP/na-split-compare.md"
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: na-split-compare-report
          path: ${{ runner.temp }}/na-split-compare.md
          if-no-files-found: error
          overwrite: true

  # The downloaded corpus, apart from the committed-fixture lane above: it is far
  # longer than that lane, and as a step inside it a timeout was indistinguishable
  # from (and starved) every other lane. Scheduled and dispatch-only. Sharded by
  # model bytes (scripts/retained-compare/corpus-shards.mjs); the shard count
  # below must equal every `--shards` in native-corpus-result.
  native-corpus:
    name: Native corpus (shard ${{ matrix.shard }}/8)
    # A bisect probe runs only the shards it names; native-corpus-result stays nightly and dispatch only.
    if: (inputs.bisect_sha && inputs.bisect_shards) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.corpus == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.bisect_shards || '[0, 1, 2, 3, 4, 5, 6, 7]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.bisect_sha }}
          persist-credentials: false
      - name: Checkout pinned upstream SDK (fetched, never vendored)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: NVIDIA-Omniverse/usd-brep
          ref: c9c5979f04cea8c38213004d4f04df0dcfb40d05
          path: upstream-smlib
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Build native owned boundary and worker
        run: |
          cmake -S native/smlib-adapter -B "$RUNNER_TEMP/smlib-native" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSMLIB_SOURCE="$GITHUB_WORKSPACE/upstream-smlib"
          cmake --build "$RUNNER_TEMP/smlib-native" --parallel 4
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: geometry-platform
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restore-only: test.yml on main saves this exact tree. The fetch below
      # then re-hashes every file and downloads only what is missing, so a
      # release-CDN outage no longer fails the lane while the manifest is
      # unchanged (#9329, #9342, #9351).
      - name: Restore the corpus from the main-branch cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/models
          key: ci-fixtures-source-v2-${{ runner.os }}-${{ hashFiles('tests/models/manifest.json', 'tests/models/README.md', 'tests/models/.manifest-ignore') }}
      - name: Download the corpus
        run: pnpm fixtures
      - name: Select this shard's models
        run: node scripts/retained-compare/corpus-shards.mjs shard --manifest tests/models/manifest.json --shards 8 --index ${{ matrix.shard }} --out tests/models/manifest.shard.json
      # Own budget and continue-on-error so the verdict step below can tell a timeout
      # (INCOMPLETE) from a finished run with parity violations (PARITY).
      - name: Compare this shard natively
        id: compare
        continue-on-error: true
        timeout-minutes: 100
        run: |
          cargo run --release --locked -p ifc-lite-retained-native --features retained-runtime --example retained_compare -- \
            --worker "$RUNNER_TEMP/smlib-native/ifclite_smlib_worker" --out "$RUNNER_TEMP/native-corpus" --manifest tests/models/manifest.shard.json
      # Without --gate the comparison exits 0 on violations; judge summary.json. Parity
      # violations are report-only (warnings) until the corpus has a baseline: the first
      # complete sharded run held thousands. Incomplete runs, universe mismatches and
      # absent fixtures fail.
      - name: Judge this shard
        if: always()
        env:
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "comparison step outcome: $COMPARE_OUTCOME"
          node scripts/check-retained-corpus-summary.mjs --report-violations "$RUNNER_TEMP/native-corpus/summary.json"
          [[ "$COMPARE_OUTCOME" == success ]]
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-corpus-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/native-corpus/*.json
            ${{ runner.temp }}/native-corpus/*.tsv
          if-no-files-found: error

  # The required aggregate over every shard: red when any shard timed out or
  # failed, or when a shard's evidence is missing.
  native-corpus-result:
    name: Native corpus result
    needs: [native-corpus]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.corpus == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-corpus-shard-*
          path: shards
      # Models left out on purpose (scripts/retained-compare/corpus-exclusions.json) are not
      # in any shard: say so as a warning and in the job summary, so green never reads as
      # covering them.
      - name: Report models that were not checked
        if: always()
        run: node scripts/retained-compare/corpus-shards.mjs excluded --manifest tests/models/manifest.json
      - name: Every shard completed (parity violations are report-only)
        env:
          SHARDS_RESULT: ${{ needs.native-corpus.result }}
        run: |
          echo "native-corpus matrix result: $SHARDS_RESULT"
          node scripts/check-retained-corpus-summary.mjs --shards 8 --report-violations shards/native-corpus-shard-*/summary.json
          [[ "$SHARDS_RESULT" == success ]]
      - name: Merge the shards' product tables for the browser corpus
        run: node scripts/retained-compare/corpus-shards.mjs merge --shards 8 --out products.tsv shards/native-corpus-shard-*/products.tsv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-corpus-products
          path: products.tsv
          if-no-files-found: error

  # Report only by design: never part of any verdict (job-level continue-on-error).
  browser-corpus:
    name: Browser corpus (report only)
    needs: [native-adapter, native-corpus-result]
    if: always() && needs.native-corpus-result.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Restore-only: test.yml on main saves this exact tree. The fetch below
      # then re-hashes every file and downloads only what is missing, so a
      # release-CDN outage no longer fails the lane while the manifest is
      # unchanged (#9329, #9342, #9351).
      - name: Restore the corpus from the main-branch cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/models
          key: ci-fixtures-source-v2-${{ runner.os }}-${{ hashFiles('tests/models/manifest.json', 'tests/models/README.md', 'tests/models/.manifest-ignore') }}
      # The models the product table names come from the fetch, not the checkout.
      - name: Download the corpus
        run: pnpm fixtures
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-corpus-products
          path: native-corpus
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-retained-engine
          path: ${{ runner.temp }}/cli-retained-engine
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-dist
          path: packages/cli/dist
      - name: Compare the corpus in the browser
        run: |
          node scripts/retained-compare/browser.mjs --engine "$RUNNER_TEMP/cli-retained-engine" \
            --native native-corpus/products.tsv --out "$RUNNER_TEMP/viewer-retained-corpus" --corpus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retained-browser-corpus
          path: ${{ runner.temp }}/viewer-retained-corpus/
          if-no-files-found: error

  # The coverage record: every first-parent commit on main since the last green full run,
  # which this run covers. Not needed by the lane, so a broken record never stops it; it
  # fails loudly on the tracking issue instead. The artifact is what the bisect reads.
  nightly-range:
    name: Nightly coverage range
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.corpus == true))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      detail: ${{ steps.range.outputs.detail }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Name the commits this run covers
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-adapter-nightly.mjs range --out "$RUNNER_TEMP/nightly-range.json"
      - name: Keep the coverage record for the bisect
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-range
          path: ${{ runner.temp }}/nightly-range.json
          if-no-files-found: error
          retention-days: 30

  # One tracking issue for every red night, with the commit range since the last green
  # full run; native-adapter-bisect.yml follows this run and posts the first bad commit there.
  report-scheduled-failure:
    needs: [nightly-range, native-adapter, native-corpus-result]
    if: always() && github.event_name == 'schedule' && (needs.nightly-range.result != 'success' || needs.native-adapter.result != 'success' || needs.native-corpus-result.result != 'success')
    uses: ./.github/workflows/report-scheduled-failure.yml
    with:
      workflow_name: Geometry platform (native adapter)
      jobs: nightly-range, native-adapter, native-corpus-result
      result: nightly-range=${{ needs.nightly-range.result }}, native-adapter=${{ needs.native-adapter.result }}, native-corpus=${{ needs.native-corpus-result.result }}
      detail: ${{ needs.nightly-range.outputs.detail }}
      labels: nightly-red
    permissions:
      actions: read
      contents: read
      issues: write
