name: Hosted CPU sampler control
on:
  workflow_call:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify resource behavior before passive host observation
        run: node --test scripts/perf/sdk-resources.test.mjs
      - name: Retain three prospective CPU sampler controls
        run: node scripts/perf/sdk-cpu-check.mjs
      - name: Upload complete or refused raw CPU readings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-sampler-${{ github.run_id }}-${{ github.run_attempt }}
          path: cpu-check.json
          retention-days: 30
          if-no-files-found: error
