name: Hosted isolated graphics controls
on:
  workflow_call:
    inputs:
      symbolic_only:
        type: boolean
        default: false
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Select exact root pnpm without modifying the action launcher
        run: |
          mkdir gpu-results
          node --input-type=module -e "import { selectPnpm } from './scripts/perf/sdk-pnpm.mjs'; await selectPnpm(process.cwd(), process.cwd() + '/gpu-results');"
      - name: Frozen dependency install (no application or WASM build)
        run: pnpm install --frozen-lockfile
      - name: Verify graphics-control invariants
        if: ${{ !inputs.symbolic_only }}
        run: node --test scripts/perf/gpu-control.test.mjs
      - name: Two fixed prospective Chrome profiles, no retries or fallback
        if: ${{ !inputs.symbolic_only }}
        env:
          DEBUG: pw:browser
          DEBUG_COLORS: '0'
        run: node scripts/perf/gpu-run.mjs
      - name: Verify symbolic receipt and shared outer ownership invariants
        if: ${{ inputs.symbolic_only }}
        run: node --test scripts/perf/gpu-control.test.mjs scripts/perf/gpu-outer.test.mjs scripts/perf/symbolic-upload-recorder.test.mjs scripts/perf/symbolic-upload-qualification.test.mjs
      - name: One corrected-profile symbolic upload control, no model or timing
        if: ${{ inputs.symbolic_only }}
        env:
          DEBUG: pw:browser
          DEBUG_COLORS: '0'
        run: node scripts/perf/symbolic-upload-gpu-run.mjs
      - name: Upload raw original and corrected controls, including refusals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: gpu-results/
          retention-days: 30
          if-no-files-found: error
