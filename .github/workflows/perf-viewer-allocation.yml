# Separate fixed allocation diagnostic. No comparator schedule/identity guard change.
name: Viewer source allocation diagnostic
on:
  workflow_dispatch:
    inputs:
      independent_input:
        description: 'Final-head O-S1 input/retained-scene correctness; two instrumented UI loads, no timing verdict'
        type: boolean
        default: false
  workflow_call:
    inputs:
      independent_input:
        type: boolean
        default: false
      requested_base_ref:
        type: string
        default: ''
      requested_candidate_ref:
        type: string
        default: ''
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_BUILD_JOBS: "2"
jobs:
  allocation:
    name: Fixed O-S1 source allocation diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      REQUESTED_BASE_REF: ${{ inputs.requested_base_ref }}
      REQUESTED_CANDIDATE_REF: ${{ inputs.requested_candidate_ref }}
      INDEPENDENT_INPUT_DIAGNOSTIC: ${{ inputs.independent_input && 'true' || 'false' }}
      BASE_REF: ${{ inputs.independent_input && '7dfc29870b0aa6a593c163592fcb84a92e5dfa19' || 'c61932d4a9d85efe1b0f817a5274a115f0571ee3' }}
      CANDIDATE_REF: ${{ inputs.independent_input && '9fc86cb8ead77486b0bcd29726b775c27085524b' || '2feb6545b588e02d55d4d6b4d9afbe8be261452e' }}
      BASE_DIR: ${{ github.workspace }}/../allocation-base
      CANDIDATE_DIR: ${{ github.workspace }}/../allocation-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Validate before either input can become a checkout ref or command argument.
      # Inputs enter through environment values, never shell interpolation.
      - name: Validate immutable inputs and write prospective fixed protocol
        run: node scripts/perf/viewer-allocation-prepare.mjs validate

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_REF }}
          path: source-base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: source-candidate
          persist-credentials: false

      # Move into isolated sibling roots so root Turbo never discovers the other
      # revision as an untracked nested package. This is not a measurement step.
      - name: Isolate immutable source checkouts
        run: |
          mv source-base "$BASE_DIR"
          mv source-candidate "$CANDIDATE_DIR"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: viewer-source-allocation
          save-if: 'false'

      - name: Install harness and both immutable dependency graphs
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir "$BASE_DIR" install --frozen-lockfile
          pnpm --dir "$CANDIDATE_DIR" install --frozen-lockfile
      - name: Run bounded protocol invariants (no viewer timing)
        run: node --test scripts/perf/viewer-source-slice-observer.test.mjs scripts/perf/viewer-allocation-plan.test.mjs
      - name: Run independent input functional controls (no model/GPU/timing)
        if: inputs.independent_input
        env:
          INPUT_WITNESS_FIXTURES_REQUIRED: 'true'
        run: node --test scripts/perf/input-witness.test.mjs scripts/perf/input-witness-integration.test.mjs
      - name: Typecheck the explicit harness and existing benchmark helper program
        run: pnpm typecheck:viewer-source-allocation
      - name: Fetch and verify exactly the fixed public fixtures
        run: node scripts/perf/viewer-allocation-prepare.mjs fixtures
      - name: Verify source/toolchain closure and mark fresh build start
        run: node scripts/perf/viewer-allocation-prepare.mjs start
      - name: Typecheck both final immutable consumer graphs and test sources
        if: inputs.independent_input
        env:
          TURBO_FORCE: 'true'
          TURBO_CONCURRENCY: '2'
          TURBO_ENV_MODE: 'loose'
        run: |
          set -o pipefail
          (cd "$BASE_DIR" && CARGO_TARGET_DIR="$RUNNER_TEMP/allocation-base-cargo" pnpm typecheck) 2>&1 | tee "$GITHUB_WORKSPACE/viewer-allocation-results/base-typecheck.log"
          (cd "$CANDIDATE_DIR" && CARGO_TARGET_DIR="$RUNNER_TEMP/allocation-candidate-cargo" pnpm typecheck) 2>&1 | tee "$GITHUB_WORKSPACE/viewer-allocation-results/candidate-typecheck.log"
      - name: Build baseline from source through root Turbo
        working-directory: ${{ env.BASE_DIR }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/allocation-base-cargo
        run: |
          set -o pipefail
          pnpm build --force --filter=@ifc-lite/viewer --concurrency=1 --env-mode=loose 2>&1 | tee "$GITHUB_WORKSPACE/viewer-allocation-results/base-build.log"
      - name: Build candidate from source through root Turbo
        working-directory: ${{ env.CANDIDATE_DIR }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/allocation-candidate-cargo
        run: |
          set -o pipefail
          pnpm build --force --filter=@ifc-lite/viewer --concurrency=1 --env-mode=loose 2>&1 | tee "$GITHUB_WORKSPACE/viewer-allocation-results/candidate-build.log"
      - name: Freeze source/runtime/viewer/fixture provenance before timing
        run: node scripts/perf/viewer-allocation-prepare.mjs freeze

      # Both builds have exited. Serial fresh Chrome processes, two independent primary O-S1 loads. Failure is terminal; no retries.
      - name: Run exactly two allocation controls (no timing verdict)
        env:
          DEBUG: pw:browser
          DEBUG_COLORS: "0"
        run: node scripts/perf/viewer-allocation-run.mjs
      - name: Preserve protocol, provenance, successful and refused samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-source-allocation-${{ github.run_id }}-${{ github.run_attempt }}
          path: viewer-allocation-results/
          retention-days: 30
          if-no-files-found: error
