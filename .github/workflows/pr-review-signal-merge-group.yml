name: PR review signal (merge group)

# GitHub merge-queue groups have no PR to inspect; the PR-level run in
# pr-review-signal.yml already gated entry to the queue. This reports the
# required 'PR review signal' check so a group can complete.
#
# ITS OWN FILE, NOT A SECOND JOB IN pr-review-signal.yml. As a job there,
# skipped by `if: merge_group`, it published a SKIPPED 'PR review signal' run on
# every PR next to the real one. Mergify reads the later of the two, so
# `check-success=PR review signal` in .mergify.yml never held and no PR could
# enter the queue (2026-11-17). A workflow that only triggers on merge_group
# creates no run on a pull request at all.
on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  review-signal-merge-group:
    name: PR review signal
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'PR review signal - satisfied at PR level; nothing to check on a merge-queue group'
