# `main` requires review conversations to be resolved, so a PR with an open
# thread cannot enter the merge queue even when every check is green, and
# auto-merge waits without saying why. Agents watching a PR wake on new comments,
# so post one naming the open threads. It posts again only when that set changes,
# and never when there are none, so a clean review or a summary comment stays quiet.
# `workflow_run` covers the one reviewer that runs here and opens threads, Claude
# review, whose token raises no review event; `pull_request_review` covers people
# and external apps such as CodeRabbit and Bugbot. Test and PR-Agent review are
# not triggers: neither opens a review thread (PR-Agent posts one conversation
# comment per lane, scripts/review/pr-agent-publish.mjs), so their completions,
# most of this workflow's runs, could not change what it posts. A thread
# someone unresolves by hand raises neither event and waits for the next review.
# Checks out no code.
name: PR unresolved threads

on:
  workflow_run:
    workflows: [Claude review]
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write

jobs:
  notify:
    # A Mergify batch PR is closed within minutes and carries no review threads.
    if: >-
      github.event_name == 'pull_request_review' ||
      (contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event) &&
      !startsWith(github.event.workflow_run.head_branch, 'mergify/merge-queue/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One notice per PR at a time, so two finishing runs cannot post it twice, and
    # a burst of reviews collapses to the newest pending job, which reads the
    # threads as they are when it starts. Keyed on the PR number where the event
    # carries one. A fork PR's `workflow_run` does not, so it keys on the SHA and
    # can run beside a review-triggered job for the same PR.
    concurrency:
      group: pr-unresolved-threads-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
    steps:
      - name: Post the open threads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          # A same-repo `workflow_run` names its PR; a fork's is looked up below.
          REVIEWED_PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          owner=${REPO%/*}
          name=${REPO#*/}
          # GitHub now and then answers a read with an empty body, which gh reports
          # as "unexpected end of JSON input" and which failed this step (run
          # 42883172181). The same reads for the same PR succeed on other runs,
          # so retry them; three failures in a row still fail the step. The
          # comment below is a write and is not retried, so it cannot post twice.
          read_api() {
            local attempt out
            for attempt in 1 2 3; do
              # Captured per attempt: gh prints an error body to stdout, and a
              # failed attempt's output must not reach the caller.
              if out=$(gh api "$@"); then
                printf '%s\n' "$out"
                return 0
              fi
              echo "::warning::gh api $1 failed (attempt $attempt of 3)" >&2
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            return 1
          }
          pr=$REVIEWED_PR
          if [ -z "$pr" ]; then
            pr=$(read_api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          fi
          if [ -z "$pr" ]; then
            echo "no open PR for $SHA"
            exit 0
          fi
          data=$(read_api graphql -F owner="$owner" -F name="$name" -F pr="$pr" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  headRefOid
                  reviewThreads(first: 100) { nodes { id isResolved comments(first: 1) { nodes { url path author { login } } } } }
                  comments(last: 100) { nodes { body } }
                }
              }
            }')
          open=$(jq -c '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)]' <<<"$data")
          count=$(jq 'length' <<<"$open")
          if [ "$count" -eq 0 ]; then
            echo "no open threads on #$pr"
            exit 0
          fi
          # Same threads already announced: stay quiet, a repeat would wake every watcher.
          key=$(jq -r '[.[].id] | sort | join(",")' <<<"$open" | sha256sum | cut -c1-16)
          marker="<!-- pr-unresolved-threads key=${key} -->"
          if jq -e --arg m "$marker" 'any(.data.repository.pullRequest.comments.nodes[]; .body | contains($m))' <<<"$data" >/dev/null; then
            echo "#$pr already announced these threads"
            exit 0
          fi
          list=$(jq -r '.[] | .comments.nodes[0] | "- \(.path) (\(.author.login // "unknown")): \(.url)"' <<<"$open")
          body="**${count} unresolved review thread(s) block this PR from the merge queue**, even when every check is green. Fix or answer each one, then resolve it.

          ${list}

          ${marker}"
          gh pr comment "$pr" --repo "$REPO" --body "$body"
