# Advisory HTTP interoperability checks run outside the required viewer shards.
name: Registry integration

on:
  pull_request:
    paths:
      - 'apps/viewer/src/lib/registry/**'
      - 'apps/viewer/src/components/sources/Registry*'
      - 'apps/viewer/src/components/sources/Oci*'
      - 'apps/viewer/src/components/sources/SourcesPanel.tsx'
      - 'apps/viewer/src/i18n/catalogues/registry.en.ts'
      - 'apps/viewer/src/test/registry-*.ts'
      - 'apps/viewer/vite.config.ts'
      - 'apps/viewer/public/samples/hello-wall.ifc'
      - '.github/actions/setup-oci-registries/**'
      - '.github/actions/setup-wasm-build/**'
      - '.github/workflows/registry-integration.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  registry-roundtrip:
    name: Registry edited-model roundtrip (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The edited-model roundtrip uses the real viewer exporter and parser.
      # Reuse the OCI lane's checked prebuilt runtime, with a source fallback.
      - name: Fetch prebuilt WASM
        id: prebuilt-wasm
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if node scripts/fetch-prebuilt-wasm.mjs; then exit 0; fi
            echo "::warning::prebuilt WASM fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Setup WASM build toolchain
        if: steps.prebuilt-wasm.outcome != 'success'
        uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: registry-integration
          save-if: 'false'
      - name: Build WASM from source
        if: steps.prebuilt-wasm.outcome != 'success'
        run: bash scripts/build-wasm.sh
      - name: Build viewer workspace dependencies
        run: pnpm build --filter='@ifc-lite/viewer^...'

      - name: Test OCI handoff and edited IFC publication
        env:
          TEST_PATTERN: 'lib/registry/.*test|components/sources/Oci.*test|components/sources/SourcesPanel.*test'
        run: pnpm test --filter=@ifc-lite/viewer
