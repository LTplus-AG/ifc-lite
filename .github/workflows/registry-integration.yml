# Advisory: external registry code runs only on disposable GitHub-hosted
# runners, outside the required viewer shards and merge-queue aggregate.
name: Registry integration

on:
  pull_request:
    paths:
      - 'apps/viewer/src/lib/registry/**'
      - 'apps/viewer/src/components/sources/Registry*'
      - 'apps/viewer/src/components/sources/SourcesPanel.tsx'
      - 'apps/viewer/src/i18n/catalogues/registry.en.ts'
      - 'apps/viewer/src/test/registry-*.ts'
      - 'apps/viewer/registry-proxy.ts'
      - 'apps/viewer/vite.config.ts'
      - 'apps/viewer/public/samples/hello-wall.ifc'
      - '.github/actions/setup-oci-registries/**'
      - '.github/actions/setup-wasm-build/**'
      - '.github/workflows/registry-integration.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  registry-roundtrip:
    name: Registry edited-model roundtrip (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The edited-model roundtrip uses the real viewer exporter and parser.
      # Reuse the OCI lane's checked prebuilt runtime, with a source fallback.
      - name: Fetch prebuilt WASM
        id: prebuilt-wasm
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if node scripts/fetch-prebuilt-wasm.mjs; then exit 0; fi
            echo "::warning::prebuilt WASM fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Setup WASM build toolchain
        if: steps.prebuilt-wasm.outcome != 'success'
        uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: registry-integration
          save-if: 'false'
      - name: Build WASM from source
        if: steps.prebuilt-wasm.outcome != 'success'
        run: bash scripts/build-wasm.sh
      - name: Build viewer workspace dependencies
        run: pnpm build --filter='@ifc-lite/viewer^...'

      - name: Setup registry Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-05
        with:
          toolchain: 1.98.1
      - name: Build pinned Subsoil registry
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d "$RUNNER_TEMP/subsoil-source.XXXXXX")"
          git -C "$source_dir" init
          git -C "$source_dir" remote add origin https://github.com/zahmadsaleem/subsoil.git
          git -C "$source_dir" fetch --depth=1 origin 117c7788fbd839a855f4c324248b930e1b232f02
          git -C "$source_dir" checkout --detach FETCH_HEAD
          cargo +1.98.1 build --locked --bin subsoil --manifest-path "$source_dir/Cargo.toml" --target-dir "$RUNNER_TEMP/subsoil-target"
      - name: Setup independent ORAS retrieval
        id: registry-tools
        uses: ./.github/actions/setup-oci-registries
      - name: Test edited IFC publication and independent retrieval
        env:
          OCI_REGISTRY_BINARY: ${{ runner.temp }}/subsoil-target/debug/subsoil
          ORAS_BINARY: ${{ steps.registry-tools.outputs.oras-path }}
          TEST_PATTERN: 'lib/registry/.*test|components/sources/Registry.*test'
        run: |
          test -x "$OCI_REGISTRY_BINARY"
          test -x "$ORAS_BINARY"
          pnpm test --filter=@ifc-lite/viewer --only
