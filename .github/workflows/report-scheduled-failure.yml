name: Report scheduled CI failure

on:
  workflow_call:
    inputs:
      workflow_name:
        description: Human-readable workflow name.
        required: true
        type: string
      jobs:
        description: Jobs whose result is being reported.
        required: true
        type: string
      result:
        description: Serialized result or results from the caller's needs context.
        required: true
        type: string
      dry_run:
        description: Exercise the reporter without changing issue state.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the scheduled-lane issue
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          JOBS: ${{ inputs.jobs }}
          RESULT: ${{ inputs.result }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "ci: scheduled ${{ inputs.workflow_name }} lane is not reporting"
        run: |
          set -euo pipefail
          title="ci: scheduled ${WORKFLOW_NAME} lane is not reporting"
          body="The scheduled ${WORKFLOW_NAME} lane did not succeed (jobs: ${JOBS}; results: ${RESULT}). Run: ${RUN_URL}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run reporter: $title"
            echo "$body"
            exit 0
          fi
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --limit 100 --json number,title | \
            node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const hit = JSON.parse(input).find(issue => issue.title === process.env.TITLE);
                if (hit) process.stdout.write(String(hit.number));
              });
            ')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
