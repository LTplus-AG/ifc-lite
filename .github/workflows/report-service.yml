name: Model report storage integration

on:
  pull_request:
    paths:
      - 'apps/report-service/**'
      - 'apps/viewer/src/components/error-report/**'
      - 'apps/viewer/src/services/error-reports/**'
      - 'packages/report-contract/**'
      - '.github/workflows/report-service.yml'
      - '.github/actions/setup-report-integration/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      receipt_concurrency_diagnostic:
        description: 'Qualification branch only: trace the four pure React receipt cases and ordinary inverse'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: report-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-integration:
    if: inputs.receipt_concurrency_diagnostic != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Provision real report integration prerequisites
        uses: ./.github/actions/setup-report-integration
      - name: Real database and multipart storage qualification
        run: pnpm test --filter=@ifc-lite/report-service --filter=@ifc-lite/report-contract --concurrency=1 --env-mode=loose
      - name: Remove owned report integration prerequisites
        if: always()
        uses: ./.github/actions/setup-report-integration
        with:
          state: stop

  mounted-public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: report-public-ui-wasm
      - name: Root Turbo viewer dependency graph and test-source typecheck
        run: pnpm typecheck
      - name: Prepare bounded receipt phase evidence
        if: inputs.receipt_concurrency_diagnostic == true
        shell: bash
        run: |
          set -euo pipefail
          receipt_phase_dir="$RUNNER_TEMP/receipt-concurrent-diagnostic"
          mkdir -p "$receipt_phase_dir"
          echo "RECEIPT_CONCURRENT_PHASE_LOG=$receipt_phase_dir/phases.jsonl" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$receipt_phase_dir/source.txt"
          sha256sum apps/viewer/src/components/error-report/PublicModelReceipt.tsx \
            apps/viewer/src/components/error-report/PublicModelReceipt.concurrent.test.tsx \
            scripts/lib/revert-oracle-run-plan.mjs packages/wasm/pkg/ifc-lite_bg.wasm \
            packages/wasm/pkg/ifc-lite.js packages/wasm/pkg/ifc-lite.d.ts > "$receipt_phase_dir/actual-source-runtime.sha256"
      - name: Provision real report integration prerequisites
        if: inputs.receipt_concurrency_diagnostic != true
        uses: ./.github/actions/setup-report-integration
      - name: Fetch bounded authentic reporter IFC for mounted HTTP qualification
        if: inputs.receipt_concurrency_diagnostic != true
        shell: bash
        run: |
          set -euo pipefail
          report_ui_fixture="$RUNNER_TEMP/report-public-ui.ifc"
          curl --fail --silent --show-error --location --max-time 30 --max-filesize 65536 \
            https://github.com/user-attachments/files/33384683/out_visible.ifc.txt -o "$report_ui_fixture"
          test "$(wc -c < "$report_ui_fixture")" -eq 22701
          echo "cc6fbbf632c2779891e485c3297d437b1d8555448934b8c8b5a3cce5326553a2  $report_ui_fixture" | sha256sum --check --status
          echo "REPORT_TEST_PUBLIC_UI_IFC_FILE=$report_ui_fixture" >> "$GITHUB_ENV"
      - name: Mounted reporting UI through real handler, database and multipart storage
        env:
          REPORT_TEST_PUBLIC_UI: ${{ inputs.receipt_concurrency_diagnostic && 'false' || 'true' }}
          TEST_PATTERN: ${{ inputs.receipt_concurrency_diagnostic && 'PublicModelReceipt.concurrent' || '(PublicModelSharing.http|PublicModelReceipt.race|PublicModelReceipt.concurrent)' }}
        run: pnpm test --filter=@ifc-lite/viewer --concurrency=2 --env-mode=loose
      - name: Isolate stale public receipt behavior with the original implementation
        run: |
          if git diff --name-only --diff-filter=A origin/main...HEAD -- apps/viewer/src/components/error-report/PublicModelReceipt.tsx | grep -Fxq 'apps/viewer/src/components/error-report/PublicModelReceipt.tsx'; then
            node scripts/check-test-revert-oracle.mjs --base origin/main --ci --json --only apps/viewer/src/components/error-report/PublicModelReceipt.tsx --mutation tests/evidence/model-reports-7495/public-receipt-race.oracle.patch --test apps/viewer/src/components/error-report/PublicModelReceipt.race.test.tsx
          elif git diff --name-only --diff-filter=M origin/main...HEAD -- apps/viewer/src/components/error-report/PublicModelReceipt.tsx | grep -Fxq 'apps/viewer/src/components/error-report/PublicModelReceipt.tsx'; then
            node scripts/check-test-revert-oracle.mjs --base origin/main --ci --json --only apps/viewer/src/components/error-report/PublicModelReceipt.tsx --test apps/viewer/src/components/error-report/PublicModelReceipt.race.test.tsx --test apps/viewer/src/components/error-report/PublicModelReceipt.concurrent.test.tsx
          else
            echo 'Public receipt is on main: ordinary whole-change inversion resumes; historical receipt inverse not applied.'
          fi
      - name: Prove restored public receipt controls pass
        if: inputs.receipt_concurrency_diagnostic != true
        env:
          TEST_PATTERN: '(PublicModelReceipt.race|PublicModelReceipt.concurrent)'
        run: pnpm test --filter=@ifc-lite/viewer --concurrency=2 --env-mode=loose --force
      - name: Retain actual receipt phase evidence
        if: always() && inputs.receipt_concurrency_diagnostic == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receipt-concurrent-phases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt-concurrent-diagnostic
          if-no-files-found: error
      - name: Remove owned report integration prerequisites
        if: always() && inputs.receipt_concurrency_diagnostic != true
        uses: ./.github/actions/setup-report-integration
        with:
          state: stop
