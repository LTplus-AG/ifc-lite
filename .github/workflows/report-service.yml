name: Model report storage integration

on:
  pull_request:
    paths:
      - 'apps/report-service/**'
      - 'apps/viewer/src/components/error-report/**'
      - 'apps/viewer/src/services/error-reports/**'
      - 'packages/report-contract/**'
      - '.github/workflows/report-service.yml'
      - '.github/actions/setup-report-integration/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      scanner_max_model:
        description: Run the selected exact 1 GiB real-scanner qualification
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: report-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-integration:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/qualification/7532-final-top-max-0d879cc0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Provision real report integration prerequisites
        uses: ./.github/actions/setup-report-integration
      - name: Real database and multipart storage qualification
        run: pnpm test --filter=@ifc-lite/report-service --filter=@ifc-lite/report-contract --concurrency=1 --env-mode=loose
      - name: Remove owned report integration prerequisites
        if: always()
        uses: ./.github/actions/setup-report-integration
        with:
          state: stop

  real-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPORT_REQUIRE_SCANNER: 'true'
      REPORT_SCANNER_MAX_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.scanner_max_model && 'true' || 'false' }}
      REPORT_SCANNER_SIGNATURE_DIRECTORY: /tmp/ifclite-scanner-signatures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-report-integration
      - name: Record exact final TOP selected-MAX source
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qualification/7532-final-top-max-0d879cc0'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/scanner-final-top-max"
          git rev-parse HEAD 'HEAD^{tree}' 0ec8b7e7f34173af51a8dbe138069c18bc2ae98b '0ec8b7e7f34173af51a8dbe138069c18bc2ae98b^{tree}' > "$RUNNER_TEMP/scanner-final-top-max/source.txt"
          git diff --name-status HEAD^ HEAD > "$RUNNER_TEMP/scanner-final-top-max/qualification-paths.txt"
          git ls-files -z apps/report-service/src apps/report-service/scripts apps/report-service/test deploy/reports/scanner.md | xargs -0 sha256sum > "$RUNNER_TEMP/scanner-final-top-max/source-before.sha256"
      - name: Build scanner and fetch its public authoring-tool fixture
        run: |
          pnpm build --filter=@ifc-lite/report-service... --concurrency=1
          pnpm fixtures ara3d/AC20-FZK-Haus.ifc
      - name: Prepare pinned engine and fresh signed databases without model access
        run: |
          scanner_image="$(node --input-type=module -e 'import {SCANNER_IMAGE} from "./apps/report-service/dist/scanner-sandbox.js"; process.stdout.write(SCANNER_IMAGE)')"
          docker pull "$scanner_image"
          pnpm exec tsx apps/report-service/scripts/scan-public-once.ts update-signatures
      - name: Actual final TOP PG/S3/engine and selected maximum model
        shell: bash
        run: |
          set -euo pipefail
          test "$REPORT_SCANNER_MAX_MODEL" = true
          sha256sum tests/models/ara3d/AC20-FZK-Haus.ifc > "$RUNNER_TEMP/scanner-final-top-max/authored-fixture.sha256"
          pnpm test --filter=@ifc-lite/report-service --filter=@ifc-lite/report-contract --concurrency=1 --env-mode=loose 2>&1 | tee "$RUNNER_TEMP/scanner-final-top-max/root-selected-max.log"
          sha256sum --check "$RUNNER_TEMP/scanner-final-top-max/source-before.sha256"
          sha256sum --check "$RUNNER_TEMP/scanner-final-top-max/authored-fixture.sha256"
          test -z "$(git status --porcelain)"
      - name: Retain actual final TOP maximum model evidence
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qualification/7532-final-top-max-0d879cc0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner-final-top-max-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scanner-final-top-max/
          if-no-files-found: error
          retention-days: 7
      - name: Remove owned report fixtures
        if: always()
        uses: ./.github/actions/setup-report-integration
        with:
          state: stop
      - name: Remove scanner signature fixture
        if: always()
        run: rm -rf -- "$REPORT_SCANNER_SIGNATURE_DIRECTORY"

  mounted-public-ui:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/qualification/7532-final-top-max-0d879cc0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: report-public-ui-wasm
      - name: Root Turbo viewer dependency graph and test-source typecheck
        run: pnpm typecheck
      - name: Provision real report integration prerequisites
        uses: ./.github/actions/setup-report-integration
      - name: Fetch bounded authentic reporter IFC for mounted HTTP qualification
        shell: bash
        run: |
          set -euo pipefail
          report_ui_fixture="$RUNNER_TEMP/report-public-ui.ifc"
          curl --fail --silent --show-error --location --max-time 30 --max-filesize 65536 \
            https://github.com/user-attachments/files/33384683/out_visible.ifc.txt -o "$report_ui_fixture"
          test "$(wc -c < "$report_ui_fixture")" -eq 22701
          echo "cc6fbbf632c2779891e485c3297d437b1d8555448934b8c8b5a3cce5326553a2  $report_ui_fixture" | sha256sum --check --status
          echo "REPORT_TEST_PUBLIC_UI_IFC_FILE=$report_ui_fixture" >> "$GITHUB_ENV"
      - name: Mounted reporting UI through real handler, database and multipart storage
        env:
          REPORT_TEST_PUBLIC_UI: 'true'
          TEST_PATTERN: '(PublicModelSharing.http|PublicModelReceipt.race|PublicModelReceipt.concurrent)'
        run: pnpm test --filter=@ifc-lite/viewer --concurrency=2 --env-mode=loose
      - name: Isolate stale public receipt behavior with the original implementation
        run: |
          if git diff --name-only --diff-filter=A origin/main...HEAD -- apps/viewer/src/components/error-report/PublicModelReceipt.tsx | grep -Fxq 'apps/viewer/src/components/error-report/PublicModelReceipt.tsx'; then
            node scripts/check-test-revert-oracle.mjs --base origin/main --ci --json --only apps/viewer/src/components/error-report/PublicModelReceipt.tsx --mutation tests/evidence/model-reports-7495/public-receipt-race.oracle.patch --test apps/viewer/src/components/error-report/PublicModelReceipt.race.test.tsx
          elif git diff --name-only --diff-filter=M origin/main...HEAD -- apps/viewer/src/components/error-report/PublicModelReceipt.tsx | grep -Fxq 'apps/viewer/src/components/error-report/PublicModelReceipt.tsx'; then
            node scripts/check-test-revert-oracle.mjs --base origin/main --ci --json --only apps/viewer/src/components/error-report/PublicModelReceipt.tsx --test apps/viewer/src/components/error-report/PublicModelReceipt.race.test.tsx --test apps/viewer/src/components/error-report/PublicModelReceipt.concurrent.test.tsx
          else
            echo 'Public receipt is on main: ordinary whole-change inversion resumes; historical receipt inverse not applied.'
          fi
      - name: Prove restored public receipt controls pass
        env:
          TEST_PATTERN: '(PublicModelReceipt.race|PublicModelReceipt.concurrent)'
        run: pnpm test --filter=@ifc-lite/viewer --concurrency=2 --env-mode=loose --force
      - name: Remove owned report integration prerequisites
        if: always()
        uses: ./.github/actions/setup-report-integration
        with:
          state: stop
