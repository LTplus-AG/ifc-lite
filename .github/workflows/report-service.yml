name: Model report storage integration

on:
  pull_request:
    paths:
      - 'apps/report-service/**'
      - 'apps/viewer/src/components/error-report/**'
      - 'apps/viewer/src/services/error-reports/**'
      - 'packages/report-contract/**'
      - '.github/workflows/report-service.yml'
      - '.github/actions/setup-report-integration/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-integration:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/qualification/7521-cli-held-exit-0d879cc0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Provision real report integration prerequisites
        uses: ./.github/actions/setup-report-integration
      - name: Real database and multipart storage qualification
        run: pnpm test --filter=@ifc-lite/report-service --filter=@ifc-lite/report-contract --concurrency=1 --env-mode=loose
      - name: Remove owned report integration prerequisites
        if: always()
        uses: ./.github/actions/setup-report-integration
        with:
          state: stop

  real-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPORT_REQUIRE_SCANNER: 'true'
      REPORT_SCANNER_SIGNATURE_DIRECTORY: /tmp/ifclite-scanner-signatures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-report-integration
      - name: Record exact scanner CLI held-exit qualification source
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qualification/7521-cli-held-exit-0d879cc0'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner-cli-held-exit"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD 'HEAD^{tree}' 185750b96466ed8362960378c0b83a73c7e31969 '185750b96466ed8362960378c0b83a73c7e31969^{tree}' > "$RUNNER_TEMP/scanner-cli-held-exit/source.txt"
          git diff --name-status HEAD^ HEAD > "$RUNNER_TEMP/scanner-cli-held-exit/qualification-paths.txt"
          git ls-files -z scripts/check-test-revert-oracle.mjs apps/report-service/src apps/report-service/scripts apps/report-service/test | xargs -0 sha256sum > "$RUNNER_TEMP/scanner-cli-held-exit/source-before.sha256"
      - name: Build scanner and fetch its public authoring-tool fixture
        run: |
          pnpm build --filter=@ifc-lite/report-service... --concurrency=1
          pnpm fixtures ara3d/AC20-FZK-Haus.ifc
      - name: Prepare pinned engine and fresh signed databases without model access
        run: |
          scanner_image="$(node --input-type=module -e 'import {SCANNER_IMAGE} from "./apps/report-service/dist/scanner-sandbox.js"; process.stdout.write(SCANNER_IMAGE)')"
          docker pull "$scanner_image"
          pnpm exec tsx apps/report-service/scripts/scan-public-once.ts update-signatures
      - name: Real engine, database and storage qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner-cli-held-exit"
          sha256sum tests/models/ara3d/AC20-FZK-Haus.ifc > "$RUNNER_TEMP/scanner-cli-held-exit/authored-fixture.sha256"
          pnpm test --filter=@ifc-lite/report-service --filter=@ifc-lite/report-contract --concurrency=1 --env-mode=loose 2>&1 | tee "$RUNNER_TEMP/scanner-cli-held-exit/root-positive.log"
      - name: Observe real scanner CLI held exit contract inverse
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qualification/7521-cli-held-exit-0d879cc0'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-test-revert-oracle.mjs --base 6db99a8ac5eb66ddcf5a5433239de0c9128d148d --ci --json \
            --only apps/report-service/scripts/scan-public-once.ts --mutation .qualification/7521/cli-held-zero-exit.patch \
            --test apps/report-service/test/scanner.integration.test.ts \
            2>&1 | tee "$RUNNER_TEMP/scanner-cli-held-exit/cli-held-zero-exit-inverse.log"
      - name: Require restored real root graph and exact source
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qualification/7521-cli-held-exit-0d879cc0'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/scanner-cli-held-exit/source-before.sha256"
          test -z "$(git status --porcelain)"
          pnpm test --filter=@ifc-lite/report-service --filter=@ifc-lite/report-contract --concurrency=1 --env-mode=loose --force 2>&1 | tee "$RUNNER_TEMP/scanner-cli-held-exit/root-restored.log"
          sha256sum --check "$RUNNER_TEMP/scanner-cli-held-exit/source-before.sha256"
          test -z "$(git status --porcelain)"
      - name: Retain original actual scanner evidence
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qualification/7521-cli-held-exit-0d879cc0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner-cli-held-exit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scanner-cli-held-exit/
          if-no-files-found: error
          retention-days: 7
      - name: Remove owned report fixtures
        if: always()
        uses: ./.github/actions/setup-report-integration
        with:
          state: stop
      - name: Remove scanner signature fixture
        if: always()
        run: rm -rf -- "$REPORT_SCANNER_SIGNATURE_DIRECTORY"

  mounted-public-ui:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/qualification/7521-cli-held-exit-0d879cc0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: report-public-ui-wasm
      - name: Root Turbo viewer dependency graph and test-source typecheck
        run: pnpm typecheck
      - name: Provision real report integration prerequisites
        uses: ./.github/actions/setup-report-integration
      - name: Fetch bounded authentic reporter IFC for mounted HTTP qualification
        shell: bash
        run: |
          set -euo pipefail
          report_ui_fixture="$RUNNER_TEMP/report-public-ui.ifc"
          curl --fail --silent --show-error --location --max-time 30 --max-filesize 65536 \
            https://github.com/user-attachments/files/33384683/out_visible.ifc.txt -o "$report_ui_fixture"
          test "$(wc -c < "$report_ui_fixture")" -eq 22701
          echo "cc6fbbf632c2779891e485c3297d437b1d8555448934b8c8b5a3cce5326553a2  $report_ui_fixture" | sha256sum --check --status
          echo "REPORT_TEST_PUBLIC_UI_IFC_FILE=$report_ui_fixture" >> "$GITHUB_ENV"
      - name: Mounted reporting UI through real handler, database and multipart storage
        env:
          REPORT_TEST_PUBLIC_UI: 'true'
          TEST_PATTERN: '(PublicModelSharing.http|PublicModelReceipt.race)'
        run: pnpm test --filter=@ifc-lite/viewer --concurrency=2 --env-mode=loose
      - name: Isolate stale public receipt behavior with the original implementation
        run: |
          if git diff --name-only --diff-filter=A origin/main...HEAD -- apps/viewer/src/components/error-report/PublicModelReceipt.tsx | grep -Fxq 'apps/viewer/src/components/error-report/PublicModelReceipt.tsx'; then
            node scripts/check-test-revert-oracle.mjs --base origin/main --ci --json --only apps/viewer/src/components/error-report/PublicModelReceipt.tsx --mutation tests/evidence/model-reports-7495/public-receipt-race.oracle.patch --test apps/viewer/src/components/error-report/PublicModelReceipt.race.test.tsx
          else
            echo 'Public receipt is on main: ordinary whole-change inversion resumes; historical receipt inverse not applied.'
          fi
      - name: Prove restored public receipt controls pass
        env:
          TEST_PATTERN: PublicModelReceipt.race
        run: pnpm test --filter=@ifc-lite/viewer --concurrency=2 --env-mode=loose --force
      - name: Remove owned report integration prerequisites
        if: always()
        uses: ./.github/actions/setup-report-integration
        with:
          state: stop
