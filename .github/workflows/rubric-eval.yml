name: Rubric eval

# MANUAL ONLY, AND THAT IS THE POINT.
#
# Every case is one model call against the same subscription pool the review lane
# uses, so running this per-PR would spend the reviewer's quota measuring the
# reviewer. It answers one question, asked deliberately: did a rubric change
# recover recall, or only move the prose around?
#
# The ground truth is real: defects CodeRabbit found on this repository's own PRs
# and the Claude lane, running the current rubric, MISSED. Recall against them is
# currently zero, so the only direction that matters is up.
on:
  workflow_dispatch:
    inputs:
      rubric:
        description: 'Path to the rubric to score (default: the shipped one)'
        required: false
        default: 'scripts/review/rubric.md'
      model:
        description: 'Model to score with'
        required: false
        default: 'sonnet'

permissions:
  contents: read

concurrency:
  group: rubric-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Rubric eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          # NO fetch-depth: 0, and the reason is worth recording so nobody adds
          # it back. It was added here on the theory that the cases' historical
          # head shas need full history. They are not reachable either way:
          # measured, 0 of 18 case head shas are ancestors of origin/main -- every
          # one was squash-merged -- refs/pull/N/head has since moved to each PR's
          # current head, and two cases carry synthetic shas. A full-history
          # clone of this monorepo would buy the eval nothing and cost minutes.
          #
          # So the eval scores siblings (retrieved with `--base HEAD`, which
          # resolves at depth 1) and the PR description, but NOT whole-file
          # evidence for historical heads. rubric-eval.mjs says so per case rather
          # than reporting a number for a pack it could not assemble.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The scorer is tested before it scores. A harness whose matcher has
      # regressed would report a rubric as better or worse than it is, and the
      # whole reason this exists is that prose cannot be judged by reading it.
      - name: Unit-test the scorer itself
        run: node --test scripts/review/rubric-eval.test.mjs

      - name: Install the reviewer CLI
        run: npm install -g @anthropic-ai/claude-code@2.0.76

      - name: Score
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          EVAL_MODEL: ${{ inputs.model }}
          # VIA env, NOT interpolated into the shell. `workflow_dispatch` needs
          # write access so this is not an escalation today, but an input spliced
          # into a `run:` block is a shape worth not having; `EVAL_MODEL` already
          # travels this way and the rubric path should match it.
          EVAL_RUBRIC: ${{ inputs.rubric }}
        # `--base` decides which arm this run measures. With it the eval scores
        # the pipeline the lane ships; without it, the diff-only baseline. It
        # used to default to HEAD, which made the documented baseline
        # unreachable; explicit means BOTH arms are runnable, but it also means
        # this line is the only thing standing between the eval and silently
        # scoring a pack that was never built.
        run: node scripts/review/rubric-eval.mjs --rubric "$EVAL_RUBRIC" --base HEAD
