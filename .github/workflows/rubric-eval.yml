name: Rubric eval

# MANUAL ONLY, AND THAT IS THE POINT.
#
# Cases spend subscription quota or paid provider credits, so running this
# per-PR would spend the reviewer's quota measuring the reviewer. It answers one question, asked deliberately: did a rubric change
# recover recall, or only move the prose around?
#
# The ground truth is real: defects CodeRabbit found on this repository's own PRs
# and earlier versions of the review lane missed. Extra findings still require
# adjudication; the historical defects are not an exhaustive oracle.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Claude subscription or paid OpenRouter strong-seat comparison'
        type: choice
        options: [claude, openrouter]
        default: claude
      resume_run_id:
        description: 'Optional completed comparison run whose artifacts should be resumed'
        required: false
        default: ''
      rubric:
        description: 'Path to the rubric to score (default: the shipped one)'
        required: false
        default: 'scripts/review/rubric.md'
      model:
        description: 'Claude model (OpenRouter uses fixed comparison candidates)'
        required: false
        default: 'sonnet'

permissions:
  contents: read
  actions: read

concurrency:
  group: rubric-eval
  cancel-in-progress: false

jobs:
  eval:
    if: inputs.provider != 'openrouter'
    name: Rubric eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          # NO fetch-depth: 0. Historical PR heads were squash-merged and are not
          # ancestors of main, so a full clone still does not contain them. The
          # scorer fetches each exact pinned 40-hex object at depth 1 instead and
          # refuses if one remains unavailable; that supplies whole-file evidence
          # without paying for repository history that cannot reach these tips.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The scorer is tested before it scores. A harness whose matcher has
      # regressed would report a rubric as better or worse than it is, and the
      # whole reason this exists is that prose cannot be judged by reading it.
      - name: Unit-test the scorer itself
        run: node --test scripts/review/rubric-eval.test.mjs

      - name: Install the reviewer CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.278

      - name: Score
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          # The semantic matcher (scripts/review/lib/semantic-match.mjs). Unset,
          # the harness scores with the stem rule exactly as before and says so.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EVAL_MODEL: ${{ inputs.model }}
          # VIA env, NOT interpolated into the shell. `workflow_dispatch` needs
          # write access so this is not an escalation today, but an input spliced
          # into a `run:` block is a shape worth not having; `EVAL_MODEL` already
          # travels this way and the rubric path should match it.
          EVAL_RUBRIC: ${{ inputs.rubric }}
        # `--base` decides which arm this run measures. With it the eval scores
        # the pipeline the lane ships; without it, the diff-only baseline. It
        # used to default to HEAD, which made the documented baseline
        # unreachable; explicit means BOTH arms are runnable, but it also means
        # this line is the only thing standing between the eval and silently
        # scoring a pack that was never built.
        run: node scripts/review/rubric-eval.mjs --rubric "$EVAL_RUBRIC" --base HEAD

  openrouter:
    if: inputs.provider == 'openrouter'
    name: Compare ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: openai/gpt-6.1-sol
            artifact: gpt-6.1-sol
          - model: anthropic/claude-sonnet-5.5
            artifact: claude-sonnet-5.5
          - model: anthropic/claude-opus-5.5
            artifact: claude-opus-5.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test evaluation adapters
        run: node --test scripts/review/rubric-eval.test.mjs scripts/review/openrouter-eval-reviewer.test.mjs scripts/review/lib/eval-cache.test.mjs scripts/review/semantic-match.test.mjs
      - name: Restore completed cases and their cost ledger
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          EVAL_ARTIFACT: ${{ matrix.artifact }}
          EVAL_RUBRIC: ${{ inputs.rubric }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" --jq .head_sha)
          git fetch --depth=1 origin "$source_sha"
          echo "EVAL_CONTEXT_BASE=$source_sha" >> "$GITHUB_ENV"
          git show "$source_sha:$EVAL_RUBRIC" > "$RUNNER_TEMP/source-rubric.md"
          cmp "$RUNNER_TEMP/source-rubric.md" "$EVAL_RUBRIC"
          gh run download "$RESUME_RUN_ID" --name "review-eval-$EVAL_ARTIFACT" --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
      - name: Compare generator recall with the production validator and retry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EVAL_MODEL: ${{ matrix.model }}
          EVAL_RUBRIC: ${{ inputs.rubric }}
          EVAL_COST_LEDGER: ${{ runner.temp }}/eval-cost.txt
          # Three serial case loops, each with a conservative $10 reservation
          # limit including corrective retries. No paid judge in this comparison.
          EVAL_BUDGET_USD: '10'
        run: >-
          node scripts/review/rubric-eval.mjs --rubric "$EVAL_RUBRIC" --base "${EVAL_CONTEXT_BASE:-HEAD}"
          --reviewer scripts/review/openrouter-eval-reviewer.mjs --no-judge
          --output-dir "$RUNNER_TEMP/eval" --resume
      - name: Preserve scores, usage, and raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-eval-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/eval/
            ${{ runner.temp }}/eval-cost.txt
          if-no-files-found: warn
          retention-days: 30
