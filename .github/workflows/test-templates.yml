name: Test Templates

on:
  workflow_call:
  workflow_dispatch:
  # push:main intentionally dropped — branch-protected PR runs validate
  # the same SHA before merge.
  pull_request:
    paths:
      - 'packages/create-ifc-lite/**'
      - '.github/workflows/test-templates.yml'

concurrency:
  group: scaffold-cohort-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-templates:
    name: Scaffold & verify (${{ matrix.template }})
    # Free GitHub-hosted runner. This job scaffolds a template, runs
    # `npm ci` + tsc + a vite/tsc build against PUBLISHED packages —
    # no Rust/WASM compile and no cargo cache to preserve, so it never
    # needed Depot's paid cores. A 6-way matrix on `depot-ubuntu-24.04-4`
    # was billing 6 x 2x the base rate for pure JS work; `ubuntu-latest` is
    # free + unlimited on a public repo. See scripts/README-vercel-cost.md.
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'ci:hosted')))) && fromJSON('["self-hosted","linux","x64","ifclite"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: basic
            check_command: npx tsc --noEmit
            build_command: npm run build
          - template: threejs
            check_command: npx tsc --noEmit
            build_command: npx vite build
          - template: babylonjs
            check_command: npx tsc --noEmit
            build_command: npx vite build
          - template: react
            check_command: npx tsc --noEmit
            build_command: npx vite build
          - template: server
            check_command: npm run typecheck
            build_command: npm run build
          - template: server-native
            check_command: npm run typecheck
            build_command: npm run build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Setup pnpm
        # v6 reads the version from the `packageManager` field in
        # package.json (`pnpm@10.8.1`); specifying `with.version` here
        # would conflict and the action errors with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile

      - name: Build create-ifc-lite
        run: pnpm exec turbo build --filter=create-ifc-lite --concurrency=2

      - name: Scaffold ${{ matrix.template }} template
        run: |
          mkdir -p /tmp/scaffold
          cd /tmp/scaffold
          node $GITHUB_WORKSPACE/packages/create-ifc-lite/dist/index.js \
            test-${{ matrix.template }} --template ${{ matrix.template }}

      - name: Install the resolved template cohort
        run: npm ci --prefer-offline
        working-directory: /tmp/scaffold/test-${{ matrix.template }}

      - name: Type-check template
        run: ${{ matrix.check_command }}
        working-directory: /tmp/scaffold/test-${{ matrix.template }}

      - name: Build template
        run: ${{ matrix.build_command }}
        working-directory: /tmp/scaffold/test-${{ matrix.template }}

      - name: Fetch the reference IFC for the basic consumer
        if: matrix.template == 'basic'
        run: node scripts/fixtures/fetch-fixtures.mjs ara3d/AC20-FZK-Haus.ifc

      - name: Run the generated basic project on real IFC bytes
        if: matrix.template == 'basic'
        working-directory: /tmp/scaffold/test-basic
        run: |
          npm run parse "$GITHUB_WORKSPACE/tests/models/ara3d/AC20-FZK-Haus.ifc"
          cp "$GITHUB_WORKSPACE/packages/create-ifc-lite/test/fixtures/verify-basic-consumer.mjs" ./verify-basic-consumer.mjs
          node verify-basic-consumer.mjs "$GITHUB_WORKSPACE/tests/models/ara3d/AC20-FZK-Haus.ifc"
