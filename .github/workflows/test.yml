name: Test

on:
  # `edited` IS THE RETARGET EVENT, and without it a PR moved onto `main` gets
  # NO lanes at all (#3772). The default activity types are
  # opened/synchronize/reopened; changing a PR's base fires `edited` and nothing
  # else. Measured on #3695/#3699/#3701: each merged `main` into its branch
  # while still based on a feature branch -- that `synchronize` was dropped by
  # `branches: [main]` below -- and was then retargeted, which fired only
  # `edited`. #3699 had ZERO `Test` runs in its life. All 16 required lanes sat
  # absent, which reads identically to "passed" on the PR surface.
  #
  # NO `github.event.changes.base` GATE, and that omission is the considered
  # half of this fix rather than the lazy one. Gating the jobs so a title/body
  # edit skips them would make every such edit publish a full set of SKIPPED
  # check runs -- and `skipped` counts as a pass BOTH in the `test` aggregate at
  # the foot of this file (`case "$r" in success|skipped) ;;`) and in GitHub's
  # required-status-check evaluation, which takes the LATEST run per check name.
  # A red PR would go green on a typo fix in its description. That is the exact
  # absence-reads-as-success class this trigger is being widened to close.
  #
  # THE PRICE, AND HOW IT IS NOW PAID (CI redesign, step 2): a title or body
  # edit used to cost a second full run of a head that already had a verdict
  # -- 158 of 400 PR runs in 38 h, routine on the changesets release PR,
  # which rewrites its body after every merge. `changes` now PROBES such an
  # event (scripts/ci-verdict-replay.mjs --probe): when it is an `edited`
  # with no `changes.base` AND the head SHA already carries a completed
  # aggregate verdict, it emits `noop=true`, publishes no filter output, and
  # every lane skips; the aggregate then REPLAYS that recorded verdict rather
  # than judging the skipped lanes. A red head stays red, a green one stays
  # green, and a retarget (`changes.base` present) or a head with no verdict
  # yet still gets the full run. The decision lives in the script, which reads
  # the event payload -- no job here gates on `changes.base`, for the reason
  # the paragraph above gives. What an edit still does NOT cost is the run
  # already in flight; see `cancel-in-progress` below.
  #
  # NO `ready_for_review` EITHER, and for the plainer reason: nothing in this
  # workflow gates on `draft`, so every job already runs on a draft PR. Adding
  # the type would buy a second run of a head that has already been judged.
  #
  # NO `labeled` EITHER. The `ci:hosted` routing label (and `draft`) is read
  # by every `runs-on` expression when a run is CREATED, so applying it does
  # not move a run already queued for the fleet; it takes effect on the next
  # run — a push, or close-and-reopen (`reopened`), the documented way to
  # re-run this workflow on the same head. Triggering on `labeled` would buy
  # a full 16-lane run for every label the risk/review bots apply to a PR.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  # Post-merge guard. Two PRs can each be green against their own base and be
  # broken as a pair on main: #2551 removed a helper from
  # measure-parity.test.tsx at 01:41 on 2026-08-12, #2538 added a caller of it
  # at 06:35, and main was red from then on. Nothing ran on main, so it
  # surfaced hours later on an unrelated first-time contributor's PR, and every
  # open PR's Node lane was red until it was fixed.
  push:
    branches: [main]
  # Merge-queue batches. Every lane runs (no path filtering - see `changes`),
  # so the queue is the full gate and a bad batch is dequeued, never merged.
  merge_group:
    types: [checks_requested]

concurrency:
  # PR runs share a group per ref, so a new commit supersedes the old run — the
  # newer commit is the only one whose verdict matters.
  #
  # Push runs get a group PER COMMIT. Not merely `cancel-in-progress: false`:
  # GitHub keeps only one running plus one PENDING run per group, and a newer
  # queued run EVICTS the pending one even when cancellation is off. With three
  # merges in quick succession, a docs-only third merge would evict the queued
  # run for a frontend-breaking second merge, and its path filters would then
  # skip the Node lane — leaving exactly the broken state this guard exists to
  # catch unchecked. A per-commit group means no merge can displace another.
  #
  # AN `edited` RUN NEVER CANCELS (#3772). With `edited` now a trigger and the
  # PR group keyed on the ref, an unconditional `cancel-in-progress` would let a
  # description edit kill a 16-lane run mid-flight and start it again from
  # scratch -- and the changesets release PR rewrites its own body after every
  # merge to main, so this is routine, not hypothetical. The group stays keyed
  # on the REF rather than on `head.sha`, which is the other way to stop the
  # cancellation: a per-SHA group would put a superseded run in its own group
  # where nothing can reach it, so a stale-head run would survive the
  # `synchronize` that obsoleted it and publish its verdict afterwards. Keeping
  # the ref group means a real push still cancels; only the no-op event
  # declines to. The `edited` run itself queues behind the in-flight one and is
  # evicted if a push arrives first, which is the right outcome.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pull_request' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

permissions:
  contents: read
  pull-requests: read
  # The no-op `edited` probe and replay read this head's check runs
  # (scripts/ci-verdict-replay.mjs). Read-only.
  checks: read
  # The push-replay probe lists the artifacts of this PR's earlier Test runs
  # (scripts/ci-push-replay.mjs). Read-only.
  actions: read

# Force JavaScript actions onto Node 24. GitHub deprecated Node 20 for
# actions in late 2025 and will flip the default in June 2026. Setting
# this opts us in early so the deprecation warning doesn't show up on
# every run, and it covers any third-party action that hasn't shipped a
# Node-24-native release yet.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Recorded-provider browser journeys (including the revert oracle) need a
  # selectable model. Their requests are intercepted; this grants no API key.
  VITE_LLM_FREE_MODELS: openai/gpt-4o-mini

jobs:
  # Path filter — emits booleans the downstream jobs use as `if:` gates.
  # Doc-only and non-test changes skip every expensive job below.
  changes:
    name: Detect changes
    # Free GitHub-hosted runner. ifc-lite is a PUBLIC repo, so standard
    # `ubuntu-latest` runners are free + unlimited (GitHub only bills public
    # repos for *larger* runners). Light jobs — path filter, lint, the gate —
    # don't need a larger runner; Rust/WASM compilation also stays on the
    # standard runner so routine CI remains within the Depot Developer tier.
    # See scripts/README-vercel-cost.md for the full runner-cost rationale.
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'ci:hosted')))) && fromJSON('["self-hosted","linux","x64","ifclite"]') || 'ubuntu-latest' }}
    # A path filter over one checkout. Anything past a minute is a hung API call,
    # not work. Capped because the default is SIX HOURS and a job killed by its own
    # timeout does NOT cancel the run: the aggregate would still run, every lane
    # would read `skipped`, and before the map entry above that was a green gate.
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.all.outputs.rust || steps.filter.outputs.rust }}
      frontend: ${{ steps.all.outputs.frontend || steps.filter.outputs.frontend }}
      geometry: ${{ steps.all.outputs.geometry || steps.filter.outputs.geometry }}
      python: ${{ steps.all.outputs.python || steps.filter.outputs.python }}
      plato: ${{ steps.all.outputs.plato || steps.filter.outputs.plato }}
      docs: ${{ steps.all.outputs.docs || steps.filter.outputs.docs }}
      agents_md: ${{ steps.all.outputs.agents_md || steps.filter.outputs.agents_md }}
      license_headers: ${{ steps.all.outputs.license_headers || steps.filter.outputs.license_headers }}
      perf_ratchet: ${{ steps.all.outputs.perf_ratchet || steps.filter.outputs.perf_ratchet }}
      # `true` only for a title/body `edited` of a head that already has a
      # completed aggregate verdict. Every lane then skips (no filter output
      # above is `true`) and the aggregate replays the verdict. See the
      # `edited` trigger comment at the top of this file.
      noop: ${{ steps.noop.outputs.noop || 'false' }}
      replay: ${{ steps.pushreplay.outputs.replay || 'false' }}
      replay_run: ${{ steps.pushreplay.outputs.replay_run || '' }}
      # `true` when the WASM source is byte-identical to the published release
      # tag, so `build` can fetch the prebuilt bundle instead of compiling
      # wasm32. See the `build` job and scripts/ci-wasm-prebuilt-eligible.sh.
      wasm_prebuilt: ${{ steps.wasm.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Depth 2 on EVERY event: on a PR the late-changeset gate below
          # compares the merge ref with HEAD~1 (the base tip). merge_group and
          # push fetch their own base. The push path's paths-filter needed
          # depth 2 already; PRs filter via the API.
          fetch-depth: 2
      # A RELEASE COMMIT THAT STILL CARRIES A CHANGESET PUBLISHES NOTHING
      # (#5647). changesets/action publishes only a tree with no pending
      # changesets, and Release runs once per push, on its tip. So a push that
      # carries a Version Packages commit AND a pending changeset publishes
      # nothing: a stale version PR squashed onto a main that gained a
      # changeset since its last refresh, or a changeset entry landing in the
      # same queue push as the version PR (up to five entries land at once).
      #
      # The base is therefore the start of what can land in ONE push: on
      # merge_group the CURRENT main tip, fetched here (entries ahead of this
      # one are not on main yet and may land with it); on push, the commit
      # main moved from; on a PR, the merge ref's parent. A failing entry is
      # kicked from the queue, and a failing PR cannot be queued (the
      # aggregate is required).
      #
      # On PUSH the commit has already landed, so the check ANNOTATES and
      # does not fail the step: every lane `needs: changes`, so failing here
      # would skip build, tests and parity for exactly the push that got past
      # the queue, hiding any real breakage it carries. The `::error::`
      # annotation still shows, and Release's own late-changeset step fails
      # that push's Release run.
      #
      # It runs HERE, in `changes`, because this job feeds the required
      # `Build + WASM + Rust + Node` aggregate on every event and fails first.
      # It is the first step so a failure is judged even on an `edited` event:
      # the no-op probe below never runs, `noop` stays false, and the
      # aggregate judges this job rather than replaying an older verdict. A
      # fetch that fails fails the step, which is the closed direction.
      - name: Refuse a release commit that still carries changesets
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "${EVENT}" in
            merge_group)
              git fetch --no-tags --depth=1 origin refs/heads/main
              BASE=$(git rev-parse FETCH_HEAD); CONTEXT=merge ;;
            push)
              git fetch --no-tags --depth=1 origin "${BEFORE}"
              BASE="${BEFORE}"; CONTEXT=push ;;
            *)
              BASE=HEAD~1; CONTEXT=merge ;;
          esac
          if [ "${EVENT}" = push ]; then
            node scripts/check-release-late-changesets.mjs --context "${CONTEXT}" --base "${BASE}" \
              || echo "Late-changeset gate reported on push (annotation above); not failing 'changes' so the lanes still run."
          else
            node scripts/check-release-late-changesets.mjs --context "${CONTEXT}" --base "${BASE}"
          fi
      # THE NO-OP EDIT PROBE. Only an `edited` event can be a no-op, so the
      # step is skipped on every other event and costs nothing there; on an
      # `edited` it is one check-runs read. `noop=true` requires BOTH a
      # title/body-only edit and an existing completed verdict for this head;
      # anything else is `noop=false` and the full run below proceeds.
      - name: Probe for a no-op edit
        id: noop
        if: github.event_name == 'pull_request' && github.event.action == 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-verdict-replay.mjs --probe
      # THE PUSH REPLAY, both halves (scripts/ci-push-replay.mjs). A PR run
      # records the exact tree it tests -- GitHub records neither the merge
      # commit nor its tree -- as an artifact NAMED for the tree. A push to
      # main whose squash commit has that exact tree, from a GREEN run of the
      # merged PR's final head, skips the lanes that run already executed:
      # measured, 57 of 97 merges re-tested an identical tree. The paths
      # filter below still runs, so the push-only lanes (rust-full, census,
      # CSG gates) and the always-on plato-check and rust-semver still run and
      # are judged; the aggregate re-verifies the recorded run. A merge that
      # touches Cargo/toolchain/workflow files never replays: those key caches
      # only a push to main writes.
      - name: Record the tree this PR run tests
        id: tree
        if: github.event_name == 'pull_request' && steps.noop.outputs.noop != 'true'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p "$RUNNER_TEMP/tested-tree"
          echo "$tree" > "$RUNNER_TEMP/tested-tree/tree"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload the tested tree
        if: steps.tree.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree/
          retention-days: 14
          if-no-files-found: error
      - name: Probe for a push of an already-tested tree
        id: pushreplay
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-push-replay.mjs --probe
      # A merge-queue batch is validated as a whole: declare every area changed
      # so all lanes run. paths-filter is a pull_request/push tool and has no
      # PR to diff on merge_group.
      - if: github.event_name == 'merge_group'
        id: all
        run: for k in rust frontend geometry python plato docs agents_md license_headers perf_ratchet; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'merge_group' && steps.noop.outputs.noop != 'true'
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'apps/server/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'scripts/build-wasm.sh'
              - '.cargo/config.toml'
              - 'scripts/build-imported-geometry.mjs'
              - 'scripts/lib/imported-artifacts.mjs'
              # The committed kernel artifacts the `--check` step diffs against:
              # a hand-edit or stale regeneration of them must trigger the check.
              - 'packages/ifcx/src/generated/**'
              - 'tests/models/manifest.json'
              - '.github/workflows/test.yml'
            # AGENTS.md is the instruction file every agent reads, and
            # scripts/check-agents-md-size.mjs gates its size and line length.
            # It gets its OWN output rather than joining `frontend`: the gate is
            # two `node` steps needing no build artifact and no install, and
            # `frontend` fans out to nine jobs including four viewer shards and
            # the e2e lane. Without a filter of its own, a PR editing only the
            # root AGENTS.md would either run the whole frontend lane or match
            # nothing at all -- and matching nothing is the #3314 class where a
            # gate cannot fire on its own input.
            agents_md:
              # test.yml DEFINES the agents-md job, so an edit that breaks, renames
              # or deletes its steps must be able to run it. Without this line the
              # filter is false, the job skips, the aggregate counts `skipped` as a
              # pass, and the row is green -- the #3314 class one level up, in the
              # one filter that had no workflow entry while the other five did.
              - '.github/workflows/test.yml'
              - 'AGENTS.md'
              - '**/AGENTS.md'
              - 'scripts/agents-md-budget.txt'
              - 'scripts/check-agents-md-size.mjs'
              - 'scripts/check-agents-md-size.test.mjs'
              - 'scripts/lib/module-size-ratchet.mjs'
              # The gate composes its budget path from a bare 'scripts' literal,
              # so check-ci-path-coverage derives every file under scripts/ as an
              # input. Rather than exempt 165 prefix fragments by hand, name the
              # tree: over-triggering is the safe direction for a reachability
              # check (that allowlist's own header says so), and the cost is one
              # 5-minute free-runner job with no install and no build artifact.
              - 'scripts/**'
            # The MPL-2.0 header gate (`add-license-headers.mjs --check`). Its
            # own job for the same reasons agents_md has one: it needs no build
            # artifact, no pnpm install and no Depot runner, and its INPUT is
            # every first-party source tree in the repo -- `docs/**` (its
            # stylesheets), `tools/**` (its `.mjs` and `.py` harnesses) and
            # `apps/landing/**` among them, none of which is in `frontend` and
            # none of which should drag a PR through the nine-job frontend
            # lane just to check a comment at the top of a file. Each of those
            # three was confirmed to hold scanned files, not assumed to: a
            # trigger justified by a tree the gate reads nothing from is the
            # same false comfort as the gate itself was before #4087. A gate
            # whose trigger is narrower than its input cannot fire on the PR
            # that introduces the very thing it guards against
            # (scripts/check-ci-path-coverage.mjs), so this filter is the whole
            # scanned population, deliberately over-triggering.
            license_headers:
              # test.yml DEFINES the license-headers job, so an edit that
              # breaks, renames or deletes its steps must be able to run it.
              - '.github/workflows/test.yml'
              - 'api/**'
              - 'apps/**'
              - 'docs/**'
              - 'examples/**'
              - 'packages/**'
              - 'rust/**'
              - 'server/**'
              - 'shared/ai/**'
              - 'tests/**'
              - 'tools/**'
              # The gate's own source and its scanned `scripts/` tree, one
              # glob covering both.
              - 'scripts/**'
              # The REPO ROOT, scanned non-recursively by extension (it used to
              # be one named file, `playwright.config.ts`, which is still the
              # only root-level file any of these match today). A gate that
              # reads a path no glob can trigger it on is a gate that does not
              # run on the PR introducing the mistake, so these have to widen
              # with the scan. `*` does not cross `/`, so each of these matches
              # root-level files ONLY and costs nothing on a subtree edit.
              - '*.ts'
              - '*.tsx'
              - '*.js'
              - '*.mjs'
              - '*.cjs'
              - '*.mts'
              - '*.cts'
              - '*.css'
              - '*.rs'
              - '*.py'
            frontend:
              # A changeset naming a package that does not exist fails the
              # RELEASE workflow, which only runs on main - so the Lint job has
              # to see changeset-only PRs, or the check it runs cannot fire on
              # the PR that introduces the mistake.
              - '.changeset/**'
              # scripts/check-changeset-bump.mjs reads the API-surface snapshot as
              # its baseline, so the snapshot must be able to trigger the job.
              - 'scripts/api-surface.json'
              # oxlint lints all of `apps/` except `apps/landing`, but this
              # filter names the two apps individually rather than `apps/**` —
              # broadening it would drag every landing-page edit through the
              # full frontend lane. The cost of that choice: a NEW app under
              # `apps/` gets linted without being able to trigger the Lint job,
              # so the PR adding it skips the gate and drops its violations on
              # whoever touches the frontend next. Add it here when you add it.
              - 'apps/viewer/**'
              - 'apps/viewer-embed/**'
              - 'apps/cloud-service/**'
              - 'apps/report-service/**'
              - 'apps/autodesk-exchange-worker/**'
              - 'apps/autodesk-service/**'
              # `examples/*` is a pnpm-workspace member and is now a lint target
              # (scripts/check-lint-ran.mjs). Without it here, an examples-only
              # PR leaves `frontend` false, the Lint job never runs, and the new
              # target protects nothing on the PRs that change those files --
              # the same trap the comment above describes for `apps/`.
              - 'examples/**'
              - 'packages/**'
              - 'tests/e2e/**'
              # Perf tools consume benchmark helpers; the CI path-coverage mirror
              # reads every tracked benchmark input, so all must trigger Node tests.
              - 'tests/benchmark/**'
              - 'playwright.config.ts'
              # The relay handlers and their tests. `pnpm test:api` runs in this
              # job, so without these a PR touching ONLY the relay skips the one
              # lane that exercises its allowlists - the guard would exist and
              # never fire, which is the failure this filter block already warns
              # about twice above.
              - 'server/**'
              - 'shared/ai/**'
              - 'api/**'
              - 'tests/api/**'
              # `pnpm test:integration` runs THIS EXACT FILE in the Node tests
              # job. Without it here the test cannot trigger its own execution:
              # a PR editing only the integration harness skips the only lane
              # that runs it.
              - 'tests/integration.test.ts'
              # The tsconfig BOTH `pnpm test:integration` and `pnpm test:api`
              # compile against (`tsx --tsconfig tests/tsconfig.json`). Same
              # trap as `.oxlintrc.json` above: a PR editing only the config a
              # lane reads must not be able to skip that lane.
              - 'tests/tsconfig.json'
              # The lint CONFIG, so a PR that only edits it cannot skip the
              # Lint job that reads it. Absent CI reads as green here, and a
              # guard cannot fire in a job that never runs.
              - '.oxlintrc.json'
              # EVERY workflow, not just this one and server-binaries.yml.
              # `scripts/check-swallowed-push.mjs` declares its SCOPE to be
              # `.github/workflows/**` and runs in the Node tests job, so with
              # only two workflows named here the gate was unreachable on 13 of
              # the 15 files it guards -- PR #3118 edited release.yml and
              # docker.yml and Node tests SKIPPED. `server-binaries.yml` (the
              # server-bin platform-parity check's input, issue #2619) and
              # `test.yml` are subsumed by this glob; test.yml stays named
              # individually in the OTHER filters below, which this does not
              # cover. COST: a workflow-only PR now runs the JS lane. Every job
              # it adds is on a FREE ubuntu-latest runner. Workflow-only PRs
              # are rare (dependabot bumps).
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'scripts/**'
              # `check-ci-path-coverage` reads .gitignore to decide which paths
              # are committed source and which are build output it must not
              # walk. That makes .gitignore an INPUT to the gate: an edit to it
              # can turn a covered path into an uncovered one. Without this
              # line a gitignore-only PR skips Node tests and the gate never
              # sees the change that moved its own verdict.
              - '.gitignore'
              # The offset file itself. `node-tests` carries the Rust
              # major-offset gate, and `scripts/**` above already brings the
              # gate's own sources into this lane -- but the ONE file whose
              # contents that gate exists to check sat in no filter at all, so
              # a PR editing only `rust-major-offset.json` skipped the job and
              # the gate could not fire on the change that declares the offset.
              # Same trap this block warns about for `apps/`, `examples/` and
              # `.oxlintrc.json` above. It goes here rather than under `rust:`
              # because the gate is a Node step and `rust:` would additionally
              # spin the WASM compile lane for a one-line JSON edit
              # (scripts/README-vercel-cost.md).
              - 'rust-major-offset.json'
              - 'tests/models/manifest.json'
              # The path-coverage regression harness mirrors tracked evidence,
              # and conservative gate inputs include the committed archive tree.
              - 'tests/evidence/**'
              # The AI evaluation gates (scripts/ai-eval) read the corpus,
              # recordings, label sheets and study records: an edit to any of
              # them must run the gates that validate them.
              - 'tests/ai-eval/**'
              - '.github/workflows/test.yml'
              # scripts/generate-coverage-ledger.mjs and its test read these
              # two paths directly (the sample fixture set and the generated
              # ledger doc it checks for freshness). apps/landing/** is
              # deliberately excluded from `frontend` above, so this names the
              # one subtree the ledger generator actually reads rather than
              # widening that exclusion.
              - 'apps/landing/samples/**'
              - 'docs/architecture/coverage-ledger.md'
              # scripts/generate-enum-reconciliation.mjs checks this generated ledger (#5365).
              - 'docs/architecture/schema-enum-reconciliation.md'
            geometry:
              - 'rust/geometry/**'
              - 'rust/core/**'
              - 'rust/processing/**'
              - 'apps/server/Cargo.toml'
              - 'Cargo.lock'
              # Workspace inputs the feature builds inherit: a root manifest or
              # toolchain change can break the off-by-default gate builds that
              # only the csg-accept-gates lane compiles.
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'scripts/ci-assert-runnable-cargo-tests.mjs'
              - '.github/workflows/test.yml'
              # The watertightness census sweeps the fixture set named here, so a
              # corpus change moves its pinned counts even with no code change.
              - 'tests/models/manifest.json'
            # `scripts/lib/revert-oracle-python.mjs` (#4079) routes any
            # `test_*.py` / `*_test.py` ANYWHERE in the repo through `python3
            # -m pytest` — `pythonTestOwner` walks up from the test file to
            # the nearest project marker (requirements.lock/.txt,
            # pyproject.toml, setup.py/.cfg, Pipfile) with no directory
            # restriction, so the routing is repo-wide, not scoped to
            # tools/ifcopenshell_reference. The `revert-oracle` job's runner
            # ships no Python toolchain of its own — installing one
            # unconditionally would pay that cost on every PR for a lane most
            # never touch. This gates that install: true only when the diff
            # could actually be asked to run a Python test. The two globs
            # mirror `TEST_FILE_RE`'s python alternatives in
            # scripts/lib/revert-oracle.mjs byte-for-byte (any `test_*.py` /
            # `*_test.py`, any depth) rather than naming known marker
            # directories by hand, so a NEW Python test tree can never fall
            # outside this filter the way rust/python's and the since-removed
            # scripts/perf/evidence tree's Python test fixtures did before this
            # fix — both already existed unfiltered when this comment was
            # written. That evidence tree was retired in #4112; the path no
            # longer exists and nothing needs to be looked for there.
            python:
              - '**/test_*.py'
              - '**/*_test.py'
              - '.github/workflows/test.yml'
            plato:
              - 'tools/plato/**'
              - 'rust/clash/src/generated/**'
              - 'packages/clash/src/math/generated/**'
              - 'scripts/generate-plato-clash.mjs'
              - '.github/workflows/test.yml'
            # The perf-ratchet ceilings (#6959). Its own output so that the
            # daily lowering bot's PR, which touches ONLY
            # tests/perf-ratchets/*.json, runs `build` (which measures) and the
            # `perf-ratchet` gate without dragging the nine-job frontend lane
            # along. Its scripts are under `scripts/**`, which `frontend`
            # already carries.
            perf_ratchet:
              - 'tests/perf-ratchets/**'
              - 'scripts/perf-ratchet/**'
              # The native-instructions measurer (#6982) runs these.
              - 'scripts/perf/instructions.sh'
              - 'scripts/perf/instructions-report.mjs'
              - '.github/workflows/test.yml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'requirements-docs.txt'
              - 'README.md'
              - 'apps/landing/**'
              - 'tests/benchmark/baseline.json'
              # TypeDoc consumes every public declaration entry and the tooling
              # that builds it. Reference generation must run on API changes.
              - 'packages/**'
              - 'shared/ai/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
              - 'scripts/docs/**'
              - 'scripts/lib/public-entrypoints.mjs'
              - 'scripts/consumer/packed-packages.mjs'
              - 'scripts/lib/is-main-entry.mjs'
              - 'scripts/lib/shipped-target.*'
              - 'scripts/*worker-urls.*'
              - 'scripts/run-build-wasm.mjs'
              - 'scripts/build-wasm.sh'
              - '.github/workflows/test.yml'
              - '.github/workflows/docs.yml'
              - '.github/actions/setup-docs-api/**'

      # Decide whether `build` can skip the from-source wasm32 compile. The
      # probe emits `true` only when the WASM source is byte-identical to the
      # `@ifc-lite/wasm@<version>` release tag that produced the published
      # bundle; any doubt emits `false` → build from source. It can never
      # green-light a stale bundle.
      - name: Resolve prebuilt-WASM eligibility
        id: wasm
        if: steps.noop.outputs.noop != 'true'
        run: echo "eligible=$(bash scripts/ci-wasm-prebuilt-eligible.sh)" >> "$GITHUB_OUTPUT"

  # Shared install + WASM + workspace build. Uploads built dist/ for the
  # downstream JS jobs; Rust jobs do their own checkout + cargo cache
  # restore (Swatinem) and don't need this artifact.
  build:
    name: Build packages + WASM
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.perf_ratchet == 'true') && needs.changes.outputs.replay != 'true'
    # Keep all routine CI on GitHub's free standard runner. This public repo's
    # previous 4-vCPU Depot path consumed the Developer plan's included minutes
    # in a few days; the prebuilt bundle remains a speed optimization only.
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'ci:hosted')))) && fromJSON('["self-hosted","linux","x64","ifclite"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fixtures live in a GitHub Release (see tests/models/manifest.json
          # and AGENTS.md §9). The repo no longer uses Git LFS — explicitly
          # disable the smudge filter so a stray .gitattributes can't
          # reintroduce it on a contributor branch.
          lfs: false
          persist-credentials: false

      - name: Setup pnpm
        # v6 reads the version from the `packageManager` field in
        # package.json (`pnpm@10.8.1`); specifying `with.version` here
        # would conflict and the action errors with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Rust + wasm-pack for the wasm32 build (pure-Rust CSG kernel — no
      # C++ toolchain needed since M9). Single-sourced in
      # .github/actions/setup-wasm-build so the four wasm-building
      # workflows stay in lock-step. Skipped on the prebuilt fast path unless the
      # imported-geometry freshness check below needs cargo.
      - name: Setup WASM build toolchain
        if: needs.changes.outputs.wasm_prebuilt != 'true' || needs.changes.outputs.rust == 'true'
        uses: ./.github/actions/setup-wasm-build
        with:
          cache-prefix: ci-build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fast path: drop the published bundle into packages/wasm/pkg/ so the
      # from-source `Build WASM` step below soft-skips (wasm-pack absent +
      # runtime present → exit 0) and downstream consumers get a working
      # runtime. Only runs when `changes` proved the source matches the release
      # tag, so this is the exact binary a source build would produce. Retried
      # because it's the one new hard-fail path (no Rust toolchain to fall back
      # to on this runner); a transient npm blip shouldn't block the PR.
      - name: Fetch prebuilt WASM
        if: needs.changes.outputs.wasm_prebuilt == 'true'
        run: |
          for attempt in 1 2 3; do
            if node scripts/fetch-prebuilt-wasm.mjs; then exit 0; fi
            echo "::warning::prebuilt WASM fetch attempt ${attempt} failed; retrying…"
            sleep $((attempt * 5))
          done
          echo "::error::Could not fetch the prebuilt @ifc-lite/wasm bundle after 3 attempts."
          exit 1

      # Cache the fetched fixture tree keyed on the manifest hash. ~994 MiB.
      # Cache hit = no network. Cache miss (manifest changed) = one cold pull
      # from the GitHub Release CDN. Pattern documented in AGENTS.md §9.
      - name: Cache test fixtures
        id: fixtures-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/models
          # Namespace cache key separately from `release.yml` (`release-fixtures-…`).
          # Phase A hardening — keeps the privileged release runner from ever
          # reading a cache writeable by a fork-triggered job.
          key: ci-fixtures-${{ runner.os }}-${{ hashFiles('tests/models/manifest.json') }}

      - name: Fetch fixtures
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        run: pnpm fixtures

      - name: Verify fixtures
        run: pnpm fixtures:check

      # Rebuild the wasm bindings from rust/wasm-bindings/ on every run. The
      # runtime (ifc-lite_bg.wasm / ifc-lite.js) is gitignored and rebuilt here
      # so a stale binary can never ship (#654); the type surface
      # (pkg/ifc-lite.d.ts) is committed for the wasm-free typecheck lane
      # (#952). This step catches Rust → wasm breakage before downstream
      # consumers see it.
      # Skipped on the prebuilt fast path (the bundle was just fetched above);
      # the type-sync gate below is skipped there too, since a frontend-only PR
      # can't have changed the committed .d.ts.
      - name: Build WASM
        if: needs.changes.outputs.wasm_prebuilt != 'true'
        run: bash scripts/build-wasm.sh

      # Guard the wasm-free typecheck lane (#952): the committed
      # packages/wasm/pkg/ifc-lite.d.ts must stay in sync with the Rust source.
      # The build above just regenerated it (and stripped the platform-variant
      # __wasm_bindgen_func_elem_* trampoline indices, so this diff is stable
      # across linux/macOS), so any diff means the committed types are stale —
      # fail the PR. Scoped to the .d.ts only; pkg/README.md and pkg/package.json
      # churn on every wasm-pack run (see AGENTS.md) and are intentionally
      # excluded.
      - name: Verify committed wasm types are in sync
        if: needs.changes.outputs.wasm_prebuilt != 'true'
        run: |
          if ! git diff --quiet -- packages/wasm/pkg/ifc-lite.d.ts; then
            echo "::error file=packages/wasm/pkg/ifc-lite.d.ts::Committed wasm types are out of sync with the Rust source. Run 'bash scripts/build-wasm.sh' and commit the regenerated packages/wasm/pkg/ifc-lite.d.ts."
            git diff -- packages/wasm/pkg/ifc-lite.d.ts
            exit 1
          fi
          echo "✅ committed wasm types match the Rust source"

      # The generated IFCX imported-geometry kernel must match the Rust crate it
      # is built from. Regenerates into a temp dir and diffs; not a build gate for
      # packages (their --verify is Rust-free). Needs cargo, so 'Setup WASM build toolchain'
      # is also enabled whenever the rust filter is true, even on the prebuilt fast path
      # (the script provisions its own pinned wasm2js).
      - name: Verify imported geometry artifacts are current
        if: needs.changes.outputs.rust == 'true'
        run: node scripts/build-imported-geometry.mjs --check

      # Build all workspace packages so their dist/ artifacts exist for
      # downstream consumers — turbo handles the dep graph.
      - name: Build packages
        run: pnpm build

      # Perf ratchet, `bundle` family (#6959). `pnpm build` above already
      # built the engine wasm and the viewer's dist/ (turbo builds apps/*
      # too), so this only reads them: no second build. It MEASURES here and
      # the `perf-ratchet` job JUDGES, so a ceiling breach goes red on its own
      # check instead of failing `build` and skipping every lane that needs it.
      # continue-on-error for the same reason: a measurer fault uploads no
      # artifact, and `perf-ratchet` then fails on the missing download.
      - name: Measure perf-ratchet bundle family
        id: perf-ratchet-measure
        continue-on-error: true
        run: node scripts/perf-ratchet/measure-bundle.mjs --out "$RUNNER_TEMP/perf-ratchet/bundle.json"

      - name: Upload perf-ratchet measurements
        if: steps.perf-ratchet-measure.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-ratchet-measured
          path: ${{ runner.temp }}/perf-ratchet/
          retention-days: 7
          if-no-files-found: error

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          # `packages/*/pkg` covers `wasm/pkg`, which downstream
          # `pnpm build` calls require.
          path: |
            packages/*/dist
            packages/*/wasm
            packages/*/pkg
          retention-days: 1
          if-no-files-found: error

      # Keep a separate root so build-output still extracts into packages/.
      # Recipe tests execute the compiled scripts from the same shared build.
      - name: Upload example builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-build-output
          path: examples/*/dist
          retention-days: 1
          if-no-files-found: error

      # The viewer app `pnpm build` just produced (turbo builds apps/* too, via
      # the viewer's own `build` script, so the __tla chunk-await guard has
      # already run over exactly these files). viewer-e2e serves it with
      # `vite preview` instead of rebuilding it per shard: measured 3.6 min x 4
      # shards of `pnpm build:e2e`, which with no turbo cache on the runner
      # rebuilt every package the viewer depends on before the vite build.
      # PR-only because viewer-e2e is.
      - name: Upload viewer app build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-dist
          path: apps/viewer/dist
          # upload-artifact skips dotfiles by default, and the real app ships
          # one: public/.well-known/microsoft-identity-association.json. The
          # E2E shards must serve the exact build, not a filtered copy of it.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # #3661: text review missed 10/10 independently confirmed defect cases even
  # after rubric retuning. This asks the executable question instead: do this
  # branch's changed tests fail when its production change is removed?
  revert-oracle:
    name: Changed tests observe production
    needs: [changes, build]
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true') &&
      !contains(github.event.pull_request.labels.*.name, 'revert-oracle-exempt')
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'ci:hosted')))) && fromJSON('["self-hosted","linux","x64","ifclite"]') || 'ubuntu-latest' }}
    # Python extension tests build separate wheels before and after the revert.
    # A changed Playwright spec may add two viewer builds and two scoped
    # browser runs (#6267); the oracle step's own timeout below is the bound
    # that applies to each case, this is the ceiling over all of them.
    timeout-minutes: ${{ needs.changes.outputs.python == 'true' && 90 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The codegen freshness gate regenerates the public Rust IfcType files
      # and applies the same rustfmt finalization used for committed output
      # before byte comparison (#5054). Keep that check in this Node-owned
      # lane, but make its formatter dependency explicit rather than relying
      # on a runner image incidental.
      - name: Install Rust formatter for codegen freshness
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-05
        with:
          toolchain: stable
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages
      - name: Download example builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: example-build-output
          path: examples
      # #4079 taught scripts/lib/revert-oracle-python.mjs to route a changed
      # `test_*.py` / `*_test.py` ANYWHERE in the repo (routing is
      # marker-based — `pythonTestOwner` walks up to the nearest project
      # marker, not scoped to any one directory) through `python3 -m
      # pytest`, but this runner's base image ships python3 with
      # NO pytest module — an oracle run over such a diff exits BASELINE-BROKEN
      # (`No module named pytest`), not a real verdict. Installed only when
      # the `changes` job's `python` filter says this diff could reach that
      # lane, mirroring ifcopenshell-parity.yml's own `full` job: the full
      # requirements.lock, not bare pytest, because test_validate_export.py's
      # SchemaConformanceHasTeeth cases (#4043) import ifcopenshell and are
      # `unittest.skipUnless(HAVE_IFCOPENSHELL, ...)` — bare pytest would run
      # them as silent skips instead of the real assertions the oracle needs
      # to revert against.
      # #6267: a changed Playwright spec can be the witness, measured in a real
      # browser. Manifest fixtures are provisioned for every oracle runner;
      # the optional browser encoder is installed only for these specs. The
      # oracle decides whether a browser runs (not when a cheaper test observes).
      - name: Detect changed Playwright specs
        id: browser
        run: |
          if git diff --name-only --diff-filter=d origin/main...HEAD -- 'tests/e2e/*.spec.ts' 'tests/e2e/**/*.spec.ts' 'tests/benchmark/frames/*.spec.ts' | grep -q .; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only --diff-filter=d origin/main...HEAD -- 'tests/benchmark/frames/*.spec.ts' | grep -q .; then
            echo "frames=true" >> "$GITHUB_OUTPUT"
          else
            echo "frames=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Provision optional revert-oracle runner toolchains
        uses: ./.github/actions/setup-revert-oracle
        with:
          python: ${{ needs.changes.outputs.python == 'true' && 'full' || 'none' }}
          rust: ${{ needs.changes.outputs.rust }}
          browser: ${{ steps.browser.outputs.needed }}
      - name: Install frame observer browser
        if: steps.browser.outputs.frames == 'true'
        run: pnpm exec playwright install --with-deps chromium-headless-shell
      # #7495: report integration witnesses must run against real durable
      # services on BOTH oracle sides. Missing prerequisites are not evidence.
      - name: Detect changed report integration witnesses
        id: report-integration
        run: |
          if git diff --name-only --diff-filter=d origin/main...HEAD -- 'apps/report-service/test/integration.test.ts' 'apps/report-service/test/*.integration.test.ts' | grep -q .; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Provision report integration witnesses
        if: steps.report-integration.outputs.needed == 'true'
        uses: ./.github/actions/setup-report-integration
      - name: Prove the changed tests observe the production change
        # `&&` binds tighter than `||`: python is tested first so a PR that
        # changes both keeps the wheel builds' 85 minutes (which also covers
        # the <= ~36-minute browser path); a browser-only PR gets 40.
        timeout-minutes: ${{ needs.changes.outputs.python == 'true' && 85 || steps.browser.outputs.needed == 'true' && 40 || 18 }}
        env:
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          # Same as the viewer-e2e lane: GPU-dependent assertions skip on the
          # runner's SwiftShader device, and a skip never counts as observation.
          E2E_GPU_STRICT: '0'
        run: |
          oracle_args=(--base origin/main --ci --json)
          # #7714: whole-file inversion removes the new module/test wiring,
          # collecting no certificate tests. Keep every API and test; disable
          # only cross-decoder cache reuse. Real concurrent success/decline
          # witnesses must observe repeated whole-source certification.
          # Once this module is on main, whole-change inversion resumes.
          if git diff --name-only --diff-filter=A origin/main...HEAD -- rust/core/src/decoder/precision_certificate.rs | grep -Fxq 'rust/core/src/decoder/precision_certificate.rs'; then
            oracle_args+=(--mutation tests/evidence/planar-carrier-7714/source-cache.oracle.patch)
          # #6729: keep the newly introduced GPU pass importable and remove
          # only its geometric visibility constraint. The paired projection
          # witness must then assert the original wrong foreground ownership.
          # Once the module is on main, ordinary whole-change reverts resume.
          elif git diff --name-only --diff-filter=A origin/main...HEAD -- packages/renderer/src/opaque-visibility-pass.ts | grep -Fxq 'packages/renderer/src/opaque-visibility-pass.ts'; then
            oracle_args+=(--mutation tests/evidence/reporter-6729/visibility.oracle.patch)
          # #7974: whole-change revert deletes the new bounds helper imported
          # by the changed tests, so collection fails before an assertion runs.
          # Keep it loadable and restore ONLY the old mesh-only bounds lookup:
          # instanced/released failures must lose their grouped camera. Once
          # idsBcfBounds.ts is on main, whole-change reverts resume automatically.
          elif git diff --name-only --diff-filter=A origin/main...HEAD -- apps/viewer/src/hooks/ids/idsBcfBounds.ts | grep -Fxq 'apps/viewer/src/hooks/ids/idsBcfBounds.ts'; then
            oracle_args+=(--mutation tests/evidence/ids-bcf-7974/bounds.oracle.patch)
          # #7292: the initial exact-kernel modules/APIs must stay loadable;
          # a whole-production revert prevents the changed Rust tests compiling.
          # Reverse ONLY geometric signed-zero key normalization in SourceAxes:
          # the actual production weld must split one shared corner and turn RED.
          # All changed tests still run on BOTH sides, with unchanged selection
          # and timeout. Once source_axes.rs is on main, whole-change revert resumes.
          elif git diff --name-only --diff-filter=A origin/main...HEAD -- rust/geometry/src/kernel/plane_weld/source_axes.rs | grep -Fxq 'rust/geometry/src/kernel/plane_weld/source_axes.rs'; then
            oracle_args+=(--mutation docs/architecture/evidence/issue-7292/signed-zero.oracle.patch)
          # #7955 D1b: cache ownership adds mapped_cache_ownership.rs, which
          # the tests name, so a whole-change revert cannot compile them
          # (REVERT-BROKE-BUILD). Keep the module and break ONLY the behaviour:
          # caches stop retaining the publishing account, coverage refusals
          # never fire, a source-walk stop becomes an ordinary drop and observe
          # stops translating typed stops. Once
          # mapped_cache_ownership.rs is on main, whole-change revert resumes.
          elif git diff --name-only --diff-filter=A origin/main...HEAD -- rust/geometry/src/router/mapped_cache_ownership.rs | grep -Fxq 'rust/geometry/src/router/mapped_cache_ownership.rs'; then
            oracle_args+=(--mutation tests/evidence/d1b-resource-raii-terminal/behaviour.oracle.patch)
          # #7955 D1: the new resource module carries the audited mesh clone and
          # merge admission. Whole-change revert removes the module the tests
          # import, so no assertion runs; this reverses ONLY the cost charged
          # before reserve/copy: zero copy/live/output allowances then admit
          # the merge and the accounted-merge tests turn RED. All changed tests
          # still run on both sides. Once resource/mesh.rs is on main, ordinary
          # whole-change revert resumes automatically.
          elif git diff --name-only --diff-filter=A origin/main...HEAD -- rust/geometry/src/resource/mesh.rs | grep -Fxq 'rust/geometry/src/resource/mesh.rs'; then
            oracle_args+=(--mutation tests/evidence/resource-accounts-d1/behaviour.oracle.patch)
          # #7495: deleting the newly introduced report service prevents test
          # collection. Its initial qualification instead removes ONLY the
          # approved NDA digest check: wrong-digest acceptance must turn RED.
          # All changed tests still run on both sides; once agreement.ts is on
          # main, the ordinary whole-change revert resumes automatically.
          elif git diff --name-only --diff-filter=A origin/main...HEAD -- apps/report-service/src/agreement.ts | grep -Fxq 'apps/report-service/src/agreement.ts'; then
            oracle_args+=(--mutation apps/report-service/test/fixtures/approved-digest.oracle.patch)
          # The initial publication transport adds modules imported by its
          # witnesses. Keep them loadable while disabling ONLY refusal of an
          # existing durable intent: a restarted worker must expose a second
          # real POST. Every changed test still runs on both oracle sides.
          # Once publication.ts is on main, normal whole-change revert resumes.
          elif git diff --name-only --diff-filter=A origin/main...HEAD -- apps/report-service/src/publication.ts | grep -Fxq 'apps/report-service/src/publication.ts'; then
            oracle_args+=(--mutation apps/report-service/test/fixtures/publication-intent.oracle.patch)
          # Keep new report UI imports available while removing recovery,
          # busy-dismissal and completed-source identity safeguards. Mounted
          # and real-storage assertions turn red; every changed test still runs.
          # Once the dialog is on main, ordinary whole-change revert resumes.
          elif git diff --name-only --diff-filter=A origin/main...HEAD -- apps/viewer/src/components/error-report/ErrorReportDialog.tsx | grep -Fxq 'apps/viewer/src/components/error-report/ErrorReportDialog.tsx'; then
            oracle_args+=(--mutation tests/evidence/model-reports-7495/publication-hold.oracle.patch)
          # New reviewed-destination/comment modules must remain importable.
