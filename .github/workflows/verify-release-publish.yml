name: Verify Release Publish

# Confirms every publishable npm package and Rust crate actually reached
# its registry after a Release run, independently of that run's own
# reasoning about whether it published anything.
#
# This used to be two jobs (`verify-npm-publish`, `verify-crates-publish`)
# living INSIDE release.yml as `needs: release` dependents, gated
# `if: always() && needs.release.outputs.published == 'true'`. #3181 found
# that on the v6.0.0 release — which published all 34 npm packages and then
# stalled partway through crates.io (#3180) — that in-run verify job never
# ran at all, on either attempt of the same run, for two different reasons:
#
#   Attempt 1 — starved. The successful npm publish pushed 34 version tags,
#   each firing `Server Binaries` + `Docker Image` (~76 runs in flight). The
#   verify job, a dependent job in the SAME run, sat `queued` for 25 minutes
#   and never got a runner before the run was re-triggered. The larger and
#   more successful the release, the less likely its own verifier runs.
#
#   Attempt 2 — gated off. The re-run had nothing left to publish (npm was
#   already done), so `needs.release.outputs.published` was 'false' and
#   `if: always() && ... == 'true'` skipped the job. That gate is correct
#   for its stated purpose (don't verify a run that only opened a version
#   PR) — but combined with attempt 1, it means a partial publish that gets
#   recovered by a re-run is never verified by either attempt.
#
# A `workflow_run` trigger fixes both, structurally rather than by tuning
# the gate further:
#   - it is not a dependent JOB inside the run it is checking, so that run's
#     own tag-push flood cannot starve it out of a runner slot the way a
#     `needs:` dependent can;
#   - it does not read that run's `published` output at all. Instead it
#     checks out the exact commit Release ran on and asks npm / crates.io
#     directly whether the version in package.json / Cargo.toml at THAT
#     commit is published. That is true (and cheaply re-verified as
#     already-true) regardless of which attempt, or how many re-runs, is
#     what actually got it there — including a run that only opened a
#     version PR, which just finds the previous, already-published version
#     still there and passes immediately.
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]

permissions:
  contents: read

jobs:
  verify-npm-publish:
    name: Verify npm publish
    runs-on: ubuntu-latest
    # A cancelled Release run (e.g. superseded by a newer push under its own
    # concurrency group) never got far enough to publish anything new — skip
    # rather than re-checking a version this run had no part in. Any other
    # conclusion, including 'failure', is checked: a FAILED Release run
    # partway through publish is exactly the case (a partial publish) this
    # exists to catch.
    if: github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Checkout Repo at the Release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: false
          persist-credentials: false

      - name: Setup pnpm
        # v6 reads the version from the `packageManager` field in
        # package.json (`pnpm@10.8.1`); specifying `with.version` here
        # would conflict and the action errors with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify all packages on npm
        # New packages can take longer to appear in npm metadata after publish.
        # Retry for up to ~4 minutes before failing.
        run: node scripts/verify-npm-publish.js --retries 12 --delay 20000

  verify-crates-publish:
    name: Verify crates.io publish
    runs-on: ubuntu-latest
    # Same reasoning as verify-npm-publish above. npm completing tells you
    # NOTHING about crates.io — they are two independent registries
    # published by `release-all.mjs`. #3181: the v6.0.0 release published
    # all 34 npm packages while only 3 of 7 crates reached crates.io
    # (#3180), and there was no crates.io-side check at all to catch it.
    if: github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Checkout Repo at the Release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify all crates on crates.io
        # Crates.io propagation is normally fast, but give it the same
        # ~4-minute retry budget as the npm check for a slow moment.
        run: node scripts/verify-crates-publish.js --retries 12 --delay 20000
