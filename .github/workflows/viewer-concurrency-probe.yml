# The viewer suite at VIEWER_TEST_CONCURRENCY=2 over EIGHT shards, measured
# after a main push's Test run finishes, to decide the gate's concurrency from
# CI numbers instead of the local 19 s vs 70 s in #3061. The gate itself
# (`viewer-tests` in test.yml) keeps concurrency 1 over sixteen shards.
#
# OFF unless the repo variable VIEWER_CONCURRENCY_PROBE is exactly `on`: with
# it unset the `plan` job's `if` is false and every other job needs `plan`, so
# no job runs and nothing is billed.
#
# A separate workflow on purpose. As jobs inside Test it held every main push
# run open until its shards finished, which delayed test-red-on-main.yml (it
# fires on Test's completion) by the probe's whole duration.
#
# SAFE `workflow_run` USE. It runs only for a `push` to `main` of THIS
# repository, so the code it checks out (the run's head_sha) is code already
# on main, never a fork's. It holds no secrets, its token is read-only
# (`actions: read` for the artifact, `contents: read` for the checkout), and
# the checkout keeps no credentials.
#
# GitHub-hosted runners only, so it never takes a slot a required lane needs
# on the self-hosted fleet.

name: Viewer concurrency probe

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

# Concurrency is set on the probe and report jobs, not here: a burst of merges
# then keeps at most one running and one pending set of shards, and a run the
# plan skips (switch off, nothing to measure) never enters a group, so it can
# neither queue jobs nor cancel a pending run that had something to measure.

jobs:
  # ADVISORY throughout: every step is continue-on-error and the report exits
  # 0, so nothing here can show a red check on main. Findings are warnings in
  # the report's summary.
  #
  # Probe only a Test run (a) whose own viewer tests ran (frontend or Rust
  # code changed, not a replay), (b) whose commit has this probe's script (a
  # run that started before this workflow merged, or a late re-run, does not),
  # and (c) whose `build-output` artifact has not expired (1-day retention).
  plan:
    name: Viewer concurrency probe, advisory (plan)
    if: vars.VIEWER_CONCURRENCY_PROBE == 'on' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      probe: ${{ steps.check.outputs.probe }}
    steps:
      - name: Is there something to probe
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          # Every way out names its reason; an API error is never read as a verdict.
          skip() { echo "::notice title=Viewer concurrency probe (advisory)::skipped: $1"; echo "probe=false" >> "$GITHUB_OUTPUT"; exit 0; }
          jobs=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion != "skipped") | .name') \
            || skip "could not list Test run $RUN_ID's jobs"
          printf '%s\n' "$jobs" | grep -qx 'Viewer tests (shard 0)' || skip "the viewer tests did not run in Test run $RUN_ID"
          if ! err=$(gh api "repos/$REPO/contents/scripts/viewer-concurrency-probe.mjs?ref=$SHA" --silent 2>&1); then
            case "$err" in
              *404*) skip "commit $SHA has no scripts/viewer-concurrency-probe.mjs" ;;
              *) skip "could not check commit $SHA for the probe script: $err" ;;
            esac
          fi
          expired=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?name=build-output" --jq '.artifacts[].expired') \
            || skip "could not list Test run $RUN_ID's artifacts"
          printf '%s\n' "$expired" | grep -qx false || skip "Test run $RUN_ID has no unexpired build-output artifact"
          echo "probe=true" >> "$GITHUB_OUTPUT"

  probe:
    name: Viewer tests at concurrency 2, advisory (shard ${{ matrix.shard }}/8)
    needs: plan
    if: needs.plan.outputs.probe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: viewer-concurrency-probe-shard-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Record the job start
        continue-on-error: true
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: false
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        continue-on-error: true
        with:
          node-version: 22
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
        continue-on-error: true
      - name: Download the Test run's build artifacts
        id: build
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Cache test fixtures
        continue-on-error: true
        id: fixtures-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/models
          key: ci-fixtures-source-v2-${{ runner.os }}-${{ hashFiles('tests/models/manifest.json', 'tests/models/README.md', 'tests/models/.manifest-ignore') }}
      - name: Fetch fixtures
        id: fixtures
        continue-on-error: true
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        run: pnpm fixtures
      - name: Verify fixtures
        id: verify
        continue-on-error: true
        run: pnpm fixtures:check
      # Only on a complete setup: a failed install or download would otherwise
      # read as a test failure at concurrency 2. Without it this shard leaves
      # no record, and the report names it as missing.
      - name: Viewer tests at concurrency 2
        if: steps.checkout.outcome == 'success' && steps.pnpm.outcome == 'success' && steps.node.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success' && steps.fixtures.outcome != 'failure' && steps.verify.outcome == 'success'
        continue-on-error: true
        run: node scripts/viewer-concurrency-probe.mjs --shard
        env:
          TEST_SHARDS: '8'
          TEST_SHARD: ${{ matrix.shard }}
          VIEWER_TEST_CONCURRENCY: '2'
          OUT: ${{ runner.temp }}/viewer-concurrency-probe-${{ matrix.shard }}.json
      - name: Upload the shard record
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-concurrency-probe-${{ matrix.shard }}
          path: ${{ runner.temp }}/viewer-concurrency-probe-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  # Warns (never fails) when a test failed at concurrency 2 or when fewer files
  # reported a result than the 16-shard gate selects.
  report:
    name: Viewer concurrency probe, advisory (report)
    needs: [plan, probe]
    if: ${{ !cancelled() && needs.plan.outputs.probe == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: viewer-concurrency-probe-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: false
          persist-credentials: false
      # No records at all is reported by the next step.
      - name: Download the shard records
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: viewer-concurrency-probe-*
          path: ${{ runner.temp }}/probe
          merge-multiple: true
      - name: Report
        continue-on-error: true
        run: node scripts/viewer-concurrency-probe.mjs --report
        env:
          RECORDS: ${{ runner.temp }}/probe
          EXPECTED_SHARDS: '8'
