name: Viewer selection cancellation

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
  CANCELLED_RUN_ID: ${{ github.event.workflow_run.id }}
  CANCELLED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

jobs:
  resolve:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'cancelled' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: Resolve the historical PR head from the Test run record
        id: head
        run: node scripts/ci-viewer-select-status.mjs --cancelled-head
        env:
          GITHUB_TOKEN: ${{ github.token }}

  report:
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    # All writers of this commit status share the per-head-SHA group in Test.
    concurrency:
      group: viewer-selection-status-${{ needs.resolve.outputs.sha }}
      queue: max
    permissions:
      actions: read
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run executes on the default branch. Keep the privileged
      # status writer on that trusted revision and consume no PR artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: Report cancellation when the latest Test attempt has no viewer verdict
        run: node scripts/ci-viewer-select-status.mjs --cancelled
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
