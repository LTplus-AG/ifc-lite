# The merge queue tests each PR on its own: one full `Test` run on a temporary
# `mergify/merge-queue/*` PR per queued PR. Ordinary PR pushes keep the fast lane
# (scripts/ci-pr-lane.mjs).
#
# NO BATCHES. The Mergify plan stopped allowing `batch_size` above 1 on
# 2026-11-16; every queue then refused to start ("The 'Merge Queue Batch'
# feature requires a higher subscription tier", #10506). Parallel checks take
# their place: up to `max_parallel_checks` PRs are tested at once, each stacked
# on the ones ahead of it, so the commit that lands is always the tree that was
# tested. A full run is about 50 jobs and the org has 60 hosted runners, so 2 is
# the most that fits without starving PR lanes; 2 runs of ~40 min clear about 3
# merges an hour, above the 2.2 an hour the batches managed (Nov 10-16).
#
# A PR enters the queue only once it is ready: `PR review signal` green and no
# unresolved review threads. Before that, agents labelled a PR right after a
# push, the review posted findings two minutes later, and the agent pulled the
# label, fixed, and relabelled: 16 of 44 dequeues after Nov 14, each one
# aborting the run it was in. Now the label can go on early and Mergify waits.
#
# Ceiling PRs (tests/perf-ratchets/*.json) keep their own queue. They were split
# out when batches landed untested commits (#8459, c306ff57d4); with one PR per
# check that gap is closed for every queue, and the split stays so a ceiling
# change can never be batched again by a future plan or config
# (scripts/perf-ratchet/merge-queue.test.mjs).
#
# The Version Packages PR (`changeset-release/main`) consumes every pending
# changeset, so it is only correct against `main` exactly as it was generated.
# Stacked on PRs that carry changesets, its tested tree holds changesets it did
# not consume and the late-changeset gate fails (#8621, #8630). So it gets its
# own queue, first in priority, interrupting running checks so it is tested on
# `main` itself rather than on top of other PRs. release-pr-freshness.yml drafts
# it, which leaves the queue, whenever `main` moves under it.
merge_queue:
  max_parallel_checks: 2

priority_rules:
  - name: Version Packages release first
    conditions:
      - head=changeset-release/main
    priority: 5000
    allow_checks_interruption: true

queue_rules:
  # Every queue also requires the `CLA` status on the PR itself (cla.yml). The
  # CLA gate does not re-check Mergify's own draft PRs, because their commits come
  # from PRs that already passed; this condition is what makes that true.
  - name: release
    queue_conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - head=changeset-release/main
    merge_conditions:
      - check-success=Build + WASM + Rust + Node
      - check-success=Viewer tests (shard 0)
      - check-success=Rust tests (feature builds)
    batch_size: 1
    merge_method: squash
    # #10273: do not inherit agent trailers from individual commit messages.
    # Credit actual commit authors; PR descriptions should omit agent credits.
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers:
        - co-authored-by

  - name: default
    # TRIAL: only labelled PRs. GitHub's own queue stays on until this is proven.
    queue_conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - -head=changeset-release/main
      - -files~=^tests/perf-ratchets/
      - check-success=PR review signal
      - "#review-threads-unresolved=0"
    # Skipped jobs do not satisfy check-success, so a queue run that ran only the fast
    # lane cannot merge even if branch detection in test.yml ever broke.
    merge_conditions:
      - check-success=Build + WASM + Rust + Node
      - check-success=Viewer tests (shard 0)
      - check-success=Rust tests (feature builds)
    batch_size: 1
    merge_method: squash
    # #10273: do not inherit agent trailers from individual commit messages.
    # Credit actual commit authors; PR descriptions should omit agent credits.
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers:
        - co-authored-by

  # Ceiling edits, one at a time (see the header). Same gate as `default`.
  - name: ceilings
    queue_conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - -head=changeset-release/main
      - files~=^tests/perf-ratchets/
      - check-success=PR review signal
      - "#review-threads-unresolved=0"
    merge_conditions:
      - check-success=Build + WASM + Rust + Node
      - check-success=Viewer tests (shard 0)
      - check-success=Rust tests (feature builds)
    batch_size: 1
    merge_method: squash
    # #10273: do not inherit agent trailers from individual commit messages.
    # Credit actual commit authors; PR descriptions should omit agent credits.
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers:
        - co-authored-by

pull_request_rules:
  - name: queue PRs labelled for the Mergify trial
    conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - -head=changeset-release/main
      - -files~=^tests/perf-ratchets/
      - check-success=PR review signal
      - "#review-threads-unresolved=0"
    actions:
      queue:
        name: default

  - name: queue ceiling PRs labelled for the Mergify trial, alone
    conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - -head=changeset-release/main
      - files~=^tests/perf-ratchets/
      - check-success=PR review signal
      - "#review-threads-unresolved=0"
    actions:
      queue:
        name: ceilings

  - name: queue the Version Packages PR alone, first
    conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - head=changeset-release/main
    actions:
      queue:
        name: release

merge_protections_settings:
  auto_merge_conditions: true
