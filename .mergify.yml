# The merge queue tests each PR on its own: one full `Test` run on a temporary
# `mergify/merge-queue/*` PR per queued PR. Ordinary PR pushes keep the fast lane
# (scripts/ci-pr-lane.mjs).
#
# NO BATCHES: the Mergify plan refuses `batch_size` above 1, and one queue
# asking for it stops every queue (#10506). Parallel checks test up to
# `max_parallel_checks` PRs at once, each stacked on the ones ahead, so the
# commit that lands is the tree that was tested. A full run is ~50 jobs against
# 60 hosted runners, so two overlapping runs already queue for runners; raise it
# only with more runners.
#
# A labelled PR (other than Version Packages) enters the queue only once it is
# ready: `PR review signal` green, no unresolved review thread, and the `PR
# viewer selection` status not failing or pending (`auto_merge_conditions`, at
# the foot). The label can go on early. Once
# queued, a push, removing the label, or a new review thread takes it out and
# its queue run is lost: main's branch protection requires resolved
# conversations, and Mergify adds that to every queue's conditions itself.
#
# Ceiling PRs (tests/perf-ratchets/*.json) keep their own queue, from when
# batches landed untested commits (#8459, c306ff57d4).
#
# The Version Packages PR (`changeset-release/main`) consumes every pending
# changeset, so it is only correct against `main` exactly as it was generated.
# Stacked on PRs that carry changesets, its tested tree holds changesets it did
# not consume and the late-changeset gate fails (#8621, #8630). So it gets its
# own queue, first in priority, interrupting running checks so it is tested on
# `main` itself rather than on top of other PRs. release-pr-freshness.yml drafts
# it, which leaves the queue, whenever `main` moves under it.
merge_queue:
  max_parallel_checks: 2

priority_rules:
  - name: Version Packages release first
    conditions:
      - head=changeset-release/main
    priority: 5000
    allow_checks_interruption: true

queue_rules:
  # Every queue also requires the `CLA` status on the PR itself (cla.yml). The
  # CLA gate does not re-check Mergify's own draft PRs, because their commits come
  # from PRs that already passed; this condition is what makes that true.
  - name: release
    queue_conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - head=changeset-release/main
    merge_conditions:
      - check-success=Build + WASM + Rust + Node
      - check-success=Viewer tests (shard 0)
      - check-success=Rust tests (feature builds)
    batch_size: 1
    merge_method: squash
    # #10273: do not inherit agent trailers from individual commit messages.
    # Credit actual commit authors; PR descriptions should omit agent credits.
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers:
        - co-authored-by

  - name: default
    # TRIAL: only labelled PRs. GitHub's own queue stays on until this is proven.
    queue_conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - -head=changeset-release/main
      - -files~=^tests/perf-ratchets/
    # Skipped jobs do not satisfy check-success, so a queue run that ran only the fast
    # lane cannot merge even if branch detection in test.yml ever broke.
    merge_conditions:
      - check-success=Build + WASM + Rust + Node
      - check-success=Viewer tests (shard 0)
      - check-success=Rust tests (feature builds)
    batch_size: 1
    merge_method: squash
    # #10273: do not inherit agent trailers from individual commit messages.
    # Credit actual commit authors; PR descriptions should omit agent credits.
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers:
        - co-authored-by

  # Ceiling edits, one at a time (see the header). Same gate as `default`.
  - name: ceilings
    queue_conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - -head=changeset-release/main
      - files~=^tests/perf-ratchets/
    merge_conditions:
      - check-success=Build + WASM + Rust + Node
      - check-success=Viewer tests (shard 0)
      - check-success=Rust tests (feature builds)
    batch_size: 1
    merge_method: squash
    # #10273: do not inherit agent trailers from individual commit messages.
    # Credit actual commit authors; PR descriptions should omit agent credits.
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers:
        - co-authored-by

pull_request_rules:
  - name: queue PRs labelled for the Mergify trial
    conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - -head=changeset-release/main
      - -files~=^tests/perf-ratchets/
    actions:
      queue:
        name: default

  - name: queue ceiling PRs labelled for the Mergify trial, alone
    conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - -head=changeset-release/main
      - files~=^tests/perf-ratchets/
    actions:
      queue:
        name: ceilings

  - name: queue the Version Packages PR alone, first
    conditions:
      - label=mergify-trial
      - -draft
      - status-success=CLA
      - head=changeset-release/main
    actions:
      queue:
        name: release

# Auto-merge is what queues a labelled PR (#8526); pull_request_rules do not
# run (Workflow Automation is not activated on this repo). This gate keeps a PR
# out until its review has landed, so threads are found before a queue run
# starts rather than during it.
#
# `PR viewer selection` is the commit status of the selected viewer tests on
# a fast-lane PR (scripts/ci-viewer-select-status.mjs; test.yml keeps that job
# advisory so a flake never turns the Test run red). Negated, so an ABSENT
# status passes: the job is skipped on the full lane, docs-only changes, fork
# PRs and when CI_PR_VIEWER_SELECT is not `on`. Pending is posted before the
# build, so the gate cannot open before the tests report. Statuses are per
# sha: a push starts clean. Here, not in queue_conditions: those are re-checked
# while queued, and a re-run of the job would dequeue the PR mid-run.
merge_protections_settings:
  auto_merge_conditions:
    - or:
      - head=changeset-release/main
      - and:
        - check-success=PR review signal
        - "#review-threads-unresolved=0"
        - -check-failure=PR viewer selection
        - -check-pending=PR viewer selection
