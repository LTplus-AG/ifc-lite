[package]
name = "ifc-lite-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance IFC processing server for Railway deployment"
keywords = ["ifc", "bim", "server", "aec", "api"]
categories = ["web-programming", "parsing"]

[features]
# `mimalloc` (default): route the server's Rust allocations through mimalloc.
# The platform system heap's global lock dominated native geometry self-time
# (~70%) and capped rayon scaling to ~1.8x on IfcMappedItem-heavy models (#1623);
# mimalloc's per-thread heaps remove the lock. `--no-default-features` ⇒ platform
# allocator, unchanged.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
# Native global allocator (see the `mimalloc` feature).
mimalloc = { workspace = true, optional = true }

# Web framework
axum = { version = "0.8", features = ["multipart", "tokio"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "compression-gzip", "catch-panic"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# IFC processing (workspace crates)
ifc-lite-core.workspace = true
# CSG runs on the pure-Rust exact kernel inside ifc-lite-geometry — same
# kernel as the viewer's wasm build, no C++ cross-toolchain needed for any
# triple (Manifold/BSP removed at M9; see
# docs/architecture/pure-rust-csg-kernel.md).
ifc-lite-geometry.workspace = true
# `observability` routes the geometry crate's production diagnostics through
# tracing so they land in this server's existing subscriber (main.rs) as
# structured events instead of raw stderr lines.
ifc-lite-processing = { workspace = true, features = ["observability"] }

# Parallelism
rayon.workspace = true

# Serialization
serde.workspace = true
# #4064: cached JSON must round-trip finite coordinate values exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }

# Streaming
futures = "0.3"
async-stream = "0.3"

# Caching
cacache = "13"

# Hashing
sha2.workspace = true
hex = "0.4"

# Logging
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror.workspace = true
anyhow = "1.0"

# Fast hashing (for style index); the version is the workspace's, shared with ifc-lite-geometry
rustc-hash.workspace = true

# CPU count
num_cpus = "1.16"

# Parquet/Arrow for efficient binary serialization
arrow.workspace = true
parquet = { workspace = true, features = ["lz4"] }
bytes = "1.5"

# Compression/decompression
flate2 = "1.0"
# .ifcZIP container unwrapping (issue #1494). Same crate/features as
# rust/export; DEFLATE + store cover every real buildingSMART container.
zip.workspace = true

# Base64 encoding for SSE payloads
base64 = "0.23"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Paused-clock transport timeout regressions; test-only so production timer
# behavior cannot be frozen accidentally.
tokio = { workspace = true, features = ["test-util"] }
# `util` feature pulls in `ServiceExt::oneshot` for in-process route tests.
tower = { version = "0.5", features = ["util"] }
# benches/serialization.rs compares ZSTD against the production LZ4_RAW codec.
# Production writes and replays LZ4_RAW only (SERVER-34), so `zstd` (and its C
# `zstd-sys`) is a bench-only feature rather than a runtime one.
parquet = { workspace = true, features = ["zstd"] }

[[bench]]
name = "serialization"
harness = false

[lints]
workspace = true
