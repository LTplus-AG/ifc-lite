site_name: IFC-Lite Documentation
site_url: https://ifclite.dev/docs/
site_description: High-performance browser-native IFC platform documentation
site_author: IFC-Lite Contributors
repo_url: https://github.com/LTplus-AG/ifc-lite
repo_name: LTplus-AG/ifc-lite
edit_uri: edit/main/docs/
use_directory_urls: true

validation:
  nav:
    omitted_files: warn

# architecture/evidence/** are the supporting artifacts (fixtures, screenshots,
# method notes) behind the design docs above them, not pages in their own right.
# They are absent from `nav` but reached from their parent design doc.
#
# research/** holds decision records: the measurements behind an experiment,
# kept so nobody re-runs it. Same reason for skipping `nav` -- a dropped
# experiment does not belong beside the user guides -- but NOT the same
# reachability. These are built and search-indexed like any page, and today
# nothing links to them, so they are findable only by search or a direct URL.
# If you add one, link it from the design doc it informs; "kept" and "kept where
# the next person finds it" are not the same thing.
#
# Declaring them here keeps `omitted_files: warn` meaningful for everything else.
# The issue-scoped section implementation/acceptance record is linked from its
# evidence README; keep it searchable without adding a temporary plan to site nav.
# Autodesk's delivery plan records qualification work; public usage belongs in
# the web viewer guide rather than the implementation checklist.
not_in_nav: |
  # IDS Studio campaign plan, tracker and handover; internal engineering docs, linked from the IDS guide once Studio ships.
  architecture/ids-studio/**
  # Issue-scoped viewer AI charter; linked from its user guide as layers ship.
  architecture/viewer-ai-plan.md
  architecture/viewer-ai-implementation.md
  architecture/viewer-ai-adapters.md
  architecture/viewer-ai-bcf-publication.md
  architecture/viewer-ai-authoring-matrix.md
  architecture/viewer-ai-evaluation.md
  architecture/viewer-ai-semantic.md
  architecture/section-6614-6615-spec.md
  architecture/autodesk-cloud-sources-plan.md
  architecture/evidence/**
  research/**

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.png
  # PLANKOPF: Swiss engineering plan-sheet identity, matching ifclite.dev.
  # font:false so Material skips its legacy Fonts API (no variable weights) —
  # docs/overrides/main.html loads variable Archivo + Fragment Mono instead.
  # primary/accent:custom so Material emits no colour rules; the carbon header
  # + Swiss-red accents are fully owned by docs/stylesheets/extra.css.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: false
      user: louistrue
      repo: ifc-lite
      normalize_issue_symbols: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LTplus-AG/ifc-lite
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/org/ifc-lite
  generator: false
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

