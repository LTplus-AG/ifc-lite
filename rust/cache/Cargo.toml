[package]
name = "ifc-lite-cache"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native writer for the browser-readable .ifclite binary cache (@ifc-lite/cache format v28)"
# Not published (#9584): the CLI is distributed through cargo from this
# repository (`cargo install --path rust/cache`), with no prebuilt binaries
# until a consumer asks for them.
publish = false

[lints]
workspace = true

[dependencies]
ifc-lite-core.workspace = true
ifc-lite-geometry.workspace = true
ifc-lite-processing.workspace = true
# Raw (headerless) deflate for the geometry chunks: what the reader's
# `DecompressionStream('deflate-raw')` takes. miniz_oxide directly, not flate2,
# so the stored bytes cannot change with whichever flate2 backend another
# workspace member's features select.
miniz_oxide = "0.9"
# The header's full-file xxhash64 (`@ifc-lite/cache` `utils/hash.ts`). Already
# in the graph through ifc-lite-core; MIT, see rust/core/Cargo.toml.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }
thiserror.workspace = true
# `ifc-build-cache` maps its input rather than copying it onto the heap; the
# version already in the lock (through another member's dependency graph).
memmap2 = "0.9"

[dev-dependencies]
ifc-lite-testkit = { path = "../testkit" }
rayon.workspace = true
