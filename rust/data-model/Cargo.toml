[package]
name = "ifc-lite-data-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "IFC data-model extraction (entities, properties, quantities, relationships, spatial hierarchy) + Parquet serialization, shared by the HTTP server and the native desktop backend."
keywords = ["ifc", "bim", "parquet", "parsing"]
categories = ["parsing"]

[dependencies]
ifc-lite-core = { path = "../core" }
rayon = "1.10"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
arrow = { version = "59", default-features = false, features = ["ipc"] }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
