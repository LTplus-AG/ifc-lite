# SPDX-License-Identifier: MPL-2.0
[package]
name = "ifc-lite-export"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Domain-format exporters for ifc-lite (HBJSON, OBJ, glTF/GLB, CSV, JSON, JSON-LD, STEP/IFC, IFC5/IFCX, Merged, Parquet/.bos)."

[dependencies]
ifc-lite-core = { workspace = true }
ifc-lite-geometry = { workspace = true }
ifc-lite-processing = { workspace = true }
rustc-hash.workspace = true
# Bulk little-endian reinterpret of f32/u32 slices to bytes (glTF vertex encoding)
# (the XXH3-128 mesh-dedup key lives in `ifc_lite_core::hash::ContentHash`).
bytemuck = "1.25"
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
nalgebra.workspace = true

# Parquet/.bos export pulls native compression (zstd/snap) + a zip writer that do
# NOT target wasm32 cleanly, so it is gated behind the `parquet-bos` feature and
# kept OUT of the default set — the wasm bundle (which uses default features) stays
# lean, while native server/CLI builds opt in. arrow/parquet/zip versions come from
# `[workspace.dependencies]`, shared with the server.
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true, features = ["snap", "zstd"] }
zip = { workspace = true, optional = true }

[features]
default = []
parquet-bos = ["dep:arrow", "dep:parquet", "dep:zip"]
# Surfaces the processing crate's faceted-brep phase timing (Instant-gated, native
# only) so `--example glb_export_profile` can attribute per-part brep wall time.
observability = ["ifc-lite-processing/observability"]

[lints]
workspace = true

[dev-dependencies]
# Round-trip oracle: the exported terrain is read back by ifc-lite's own LandXML parser.
ifc-lite-landxml = { workspace = true }
# Pins long values of the shared #7675 complex-property vector by digest.
sha2 = { workspace = true }
