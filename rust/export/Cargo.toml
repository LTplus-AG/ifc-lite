# SPDX-License-Identifier: MPL-2.0
[package]
name = "ifc-lite-export"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Domain-format exporters for ifc-lite (HBJSON, OBJ, glTF/GLB, CSV, JSON, JSON-LD, STEP/IFC, IFC5/IFCX, Merged, Parquet/.bos)."

[dependencies]
ifc-lite-core = { workspace = true }
ifc-lite-geometry = { workspace = true }
ifc-lite-processing = { workspace = true }
rustc-hash = "2.1"
# Bulk little-endian reinterpret of f32/u32 slices to bytes (glTF vertex encoding)
# and a single-pass 128-bit content hash for mesh dedup; both pure-Rust + wasm-safe.
bytemuck = "1.25"
# XXH3-128 for the mesh-dedup key. `twox-hash` rather than `xxhash-rust`: both
# implement the same algorithm, but twox-hash is MIT where xxhash-rust is
# BSL-1.0, and a downstream consumer of this crate ships under a licence
# allowlist that BSL-1.0 sits outside of. The digest only gates key equality and
# never reaches the output, so the choice of implementation is free here — which
# makes staying inside the common permissive set the obvious call.
# `default-features = false` deliberately: the default set pulls `rand` (for
# randomly-seeded hashers), which this use has no need of and which would widen
# the dependency graph for nothing. `alloc` is what the streaming hasher needs.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_128", "alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parquet/.bos export pulls native compression (zstd/snap) + a zip writer that do
# NOT target wasm32 cleanly, so it is gated behind the `parquet-bos` feature and
# kept OUT of the default set — the wasm bundle (which uses default features) stays
# lean, while native server/CLI builds opt in. arrow/parquet pinned to the server's 59.
arrow = { version = "59", default-features = false, features = ["ipc"], optional = true }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"], optional = true }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }

[features]
default = []
parquet-bos = ["dep:arrow", "dep:parquet", "dep:zip"]
# Surfaces the processing crate's faceted-brep phase timing (Instant-gated, native
# only) so `--example glb_export_profile` can attribute per-part brep wall time.
observability = ["ifc-lite-processing/observability"]

[lints]
workspace = true
