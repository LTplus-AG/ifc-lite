# SPDX-License-Identifier: MPL-2.0
[package]
name = "ifc-lite-geometry-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Release automation admission is gated on first-publish bootstrap; see RELEASE.md.
publish = ["crates-io"]
description = "Opt-in native geometry worker client and transport protocol for IFC-Lite"
readme = "README.md"
keywords = ["ifc", "bim", "geometry"]
categories = ["graphics"]
# Only the Rust client and its tests: no SDK, adapter binaries or browser assets.
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

[dependencies]
# Retained requests and completions are GeometryDocument types. Nothing in
# geometry depends back on this crate.
ifc-lite-geometry.workspace = true

[dev-dependencies]
# Real authored IFC sources decoded for the retained request witnesses.
ifc-lite-core.workspace = true

[lints]
workspace = true
