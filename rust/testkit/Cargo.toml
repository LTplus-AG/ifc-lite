[package]
name = "ifc-lite-testkit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Test-only helpers shared by the ifc-lite crates' test suites (fixture resolution, STEP builders, mesh oracles). Never published."
# Never published: consumers list it as a path-only dev-dependency (no
# `version`), which cargo strips from the packaged manifest, so it imposes
# no publish-order constraint (see scripts/release-crates-order.test.mjs).
publish = false

# The mesh oracles delegate to `ifc_lite_geometry::mesh_check` (the one home for
# closure / pairing / volume), so the oracles and the production gates cannot
# drift. This is a dev-dependency cycle for the geometry crate itself (geometry
# dev-depends on this crate); cargo allows it, and only raw slices cross it.
[dependencies]
ifc-lite-geometry = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
