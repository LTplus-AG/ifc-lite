# B3.4 kernel-stage extractor (moonshot spike). Standalone crate, NOT a
# workspace member: it path-depends on ifc-lite-geometry (with csg_capture for
# the corpus deserializer) and reconstructs the tri-pair plane-classification
# stage exactly as the kernel runs it. See ../REPORT.md.
[package]
name = "b34-extractor"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ifc-lite-geometry = { path = "../../../../rust/geometry", features = ["csg_capture"] }

[profile.release]
opt-level = 3
