<html lang="en"><head><meta charset="utf-8"><title>SMLib worker feasibility probe</title></head>
<body><h1>SMLib worker feasibility probe</h1><pre id="result">Running two independent WASM workers…</pre>
<script type="module">
const run = () => new Promise((resolve, reject) => {
  const worker = new Worker('./browser-worker.mjs', { type: 'module' });
  const deadline = setTimeout(() => { worker.terminate(); reject(new Error('Worker timed out')); }, 60000);
  worker.onmessage = ({ data }) => { clearTimeout(deadline); worker.terminate(); resolve(data); };
  worker.onerror = error => { clearTimeout(deadline); worker.terminate(); reject(new Error(error.message)); };
});
try {
  const workers = await Promise.all([run(), run()]);
  window.probeResult = { passed: workers.every(worker => worker.passed), workers,
    userAgent: navigator.userAgent, crossOriginIsolated };
} catch (error) {
  window.probeResult = { passed: false, error: String(error) };
}
document.querySelector('#result').textContent = JSON.stringify(window.probeResult, null, 2);
</script></body></html>
